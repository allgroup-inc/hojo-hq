[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = false
warn_redundant_casts = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
strict = false
ignore_missing_imports = true  # Handle third-party libraries with incomplete type stubs
check_untyped_defs = false
no_implicit_optional = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "kakehashi.kek_wrapper.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
disallow_untyped_calls = false
ignore_errors = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
