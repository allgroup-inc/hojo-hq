<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="みらいひらけ堂">
  <!-- 堂シリーズ共通ロゴ「虹と朝日」(もらいわすれ堂ロゴガイドv1準拠)。
       もら堂との違いは朝日の位置だけ: 虹の真上にのぼりきった朝日=「みらいがひらいた」 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAECDC"/>
      <stop offset="1" stop-color="#F5E0CE"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#tile)"/>
  <g fill="#F5CE6E">
    <circle cx="38" cy="19.5" r="1.9"/>
    <circle cx="36.2" cy="23.7" r="1.9"/>
    <circle cx="32" cy="25.5" r="1.9"/>
    <circle cx="27.8" cy="23.7" r="1.9"/>
    <circle cx="26" cy="19.5" r="1.9"/>
    <circle cx="27.8" cy="15.3" r="1.9"/>
    <circle cx="32" cy="13.5" r="1.9"/>
    <circle cx="36.2" cy="15.3" r="1.9"/>
  </g>
  <circle cx="32" cy="19.5" r="4" fill="#F2C14E"/>
  <path d="M11 53 A21 21 0 0 1 53 53" stroke="#D2694A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M18 53 A14 14 0 0 1 46 53" stroke="#F2C14E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M25 53 A7 7 0 0 1 39 53" stroke="#6FAEA4" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
