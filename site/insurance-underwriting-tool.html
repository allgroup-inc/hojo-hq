<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保険引き受け目安検索 | 業種・規模から引き受け可能な保険をチェック</title>
  <meta name="description" content="患者の病名から3社（なないろ生命・FWD生命・チューリッヒ生命）の生命保険引き受け判定を検索。加入OK・条件付き・加入不可を一覧表示。">
  <meta name="theme-color" content="#00335C">
  <style>
    :root {
      /* ── Design Tokens: Colors ── */
      --color-primary: #00335C;
      --color-accent: #F9A825;
      --color-success: #2e7d32;
      --color-warning: #e65100;
      --color-error: #c62828;
      --color-neutral-50: #f5f5f5;
      --color-neutral-100: #efefef;
      --color-neutral-200: #e0e0e0;
      --color-neutral-700: #555;
      --color-neutral-900: #1a1a1a;
      --color-bg-light: #FFFBF4;

      /* ── Design Tokens: Spacing (8px grid) ── */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* ── Design Tokens: Typography ── */
      --font-family: "Segoe UI", "Noto Sans JP", sans-serif;
      --font-size-xs: 12px;
      --font-size-sm: 14px;
      --font-size-md: 16px;
      --font-size-lg: 18px;
      --font-size-xl: 24px;
      --font-size-2xl: 32px;
      --font-weight-normal: 400;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--color-bg-light) 0%, #f5f0ea 100%);
      padding: var(--space-md);
      min-height: 100vh;
      color: var(--color-neutral-900);
      line-height: 1.6;
    }

    /* ── Focus visible for keyboard navigation ── */
    *:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
      color: white;
      padding: var(--space-xl);
      text-align: center;
    }

    h1 {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-md);
    }

    .subtitle {
      font-size: var(--font-size-md);
      opacity: 0.95;
    }

    .main {
      padding: var(--space-xl);
    }

    /* ── Form ── */
    form {
      margin-bottom: var(--space-lg);
    }

    .form-group {
      margin-bottom: var(--space-lg);
    }

    label {
      display: block;
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-sm);
      font-size: var(--font-size-md);
    }

    small {
      display: block;
      color: var(--color-neutral-700);
      font-size: var(--font-size-xs);
      margin-top: var(--space-sm);
    }

    .search-box {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: var(--space-md);
      min-height: 48px;
      border: 2px solid var(--color-neutral-200);
      border-radius: 6px;
      font-size: var(--font-size-md);
      font-family: inherit;
      transition: all 0.25s;
      color: var(--color-neutral-900);
    }

    input[type="text"]:hover {
      border-color: var(--color-neutral-700);
    }

    input[type="text"]:focus-visible {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 4px rgba(249, 168, 37, 0.2);
      background: var(--color-bg-light);
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--color-neutral-700);
      opacity: 0.6;
    }

    .btn {
      padding: var(--space-md) var(--space-lg);
      min-height: 48px;
      border: none;
      border-radius: 6px;
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-bold);
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--color-accent);
      color: white;
      box-shadow: 0 2px 8px rgba(249, 168, 37, 0.2);
    }

    .btn-primary:hover:not(:disabled) {
      background: #f5951a;
      box-shadow: 0 4px 16px rgba(249, 168, 37, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--color-neutral-700);
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--color-neutral-900);
    }
    /* ── Tabs (ARIA) ── */
    [role="tablist"] {
      margin-bottom: var(--space-lg);
      border-bottom: 2px solid var(--color-neutral-100);
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    [role="tab"] {
      padding: var(--space-md) var(--space-lg);
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      color: var(--color-neutral-700);
      transition: all 0.25s;
      font-family: inherit;
    }

    [role="tab"]:hover {
      color: var(--color-primary);
      background: var(--color-neutral-50);
    }

    [role="tab"][aria-selected="true"] {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
      font-weight: var(--font-weight-bold);
    }

    [role="tabpanel"] {
      display: none;
    }

    [role="tabpanel"][aria-hidden="false"] {
      display: block;
    }
    .results-section {
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-lg);
      border-bottom: 2px solid var(--color-neutral-100);
    }

    .results-section:last-child {
      border-bottom: none;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .results-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
    }

    /* ── Badge ── */
    .badge {
      background: var(--color-accent);
      color: white;
      padding: var(--space-sm) var(--space-md);
      border-radius: 20px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      box-shadow: 0 2px 8px rgba(249, 168, 37, 0.2);
    }

    /* ── Data Table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-size-sm);
    }

    th {
      background: var(--color-primary);
      color: white;
      padding: var(--space-md) var(--space-sm);
      text-align: left;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-xs);
      word-break: break-word;
    }

    td {
      padding: var(--space-md) var(--space-sm);
      border-bottom: 1px solid var(--color-neutral-100);
      color: var(--color-neutral-900);
    }

    tbody tr:hover {
      background: var(--color-neutral-50);
    }

    /* ── Status Badges ── */
    .status-badge {
      display: inline-block;
      padding: var(--space-sm) var(--space-sm);
      border-radius: 4px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
    }

    .status-ok {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .status-conditional {
      background: #fff3e0;
      color: #e65100;
    }

    .status-ng {
      background: #ffebee;
      color: #b71c1c;
    }

    .status-unknown {
      background: var(--color-neutral-100);
      color: #424242;
    }
    .no-results {
      text-align: center;
      color: var(--color-neutral-700);
      padding: var(--space-xl);
      font-size: var(--font-size-md);
      background: var(--color-neutral-50);
      border-radius: 6px;
    }

    .no-results strong {
      color: var(--color-neutral-900);
    }

    .actions {
      display: none;
      text-align: center;
      margin-top: var(--space-lg);
      padding-top: var(--space-lg);
      border-top: 2px solid var(--color-neutral-100);
    }

    .actions.active {
      display: block;
    }

    /* ── Responsive Design ── */
    @media (max-width: 768px) {
      .container {
        border-radius: 8px;
      }

      header {
        padding: var(--space-lg) var(--space-md);
      }

      h1 {
        font-size: var(--font-size-xl);
      }

      .main {
        padding: var(--space-lg) var(--space-md);
      }

      .search-box {
        flex-direction: column;
      }

      input[type="text"] {
        min-width: 100%;
      }

      [role="tablist"] {
        gap: var(--space-xs);
      }

      [role="tab"] {
        padding: var(--space-sm) var(--space-md);
        font-size: var(--font-size-sm);
      }

      table {
        font-size: var(--font-size-xs);
      }

      th, td {
        padding: var(--space-sm) var(--space-xs);
      }
    }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── High Contrast Mode ── */
    @media (prefers-contrast: more) {
      input[type="text"] {
        border-width: 3px;
      }

      .btn {
        border: 2px solid currentColor;
      }

      [role="tab"][aria-selected="true"] {
        border-bottom-width: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>保険引き受け目安検索</h1>
      <p class="subtitle">患者の病名から、保険会社ごとの引き受け見込みを検索</p>
    </header>

    <main class="main">
      <form id="searchForm" role="search" aria-label="病名検索フォーム">
        <div class="form-group">
          <label for="diseaseInput">検索する病名を入力してください</label>
          <div class="search-box">
            <input
              type="text"
              id="diseaseInput"
              placeholder="例：がん、糖尿病、心筋梗塞"
              autocomplete="off"
              aria-describedby="diseaseHint"
            />
            <small id="diseaseHint">医学用語・一般名 両対応。複数キーワード対応</small>
          </div>
          <div class="search-box">
            <button type="button" class="btn btn-primary" onclick="search()">検索する</button>
            <button type="button" class="btn btn-secondary" onclick="clearSearch()">クリアしる</button>
          </div>
        </div>
      </form>

      <div role="tablist" aria-label="保険会社別検索結果">
        <button
          role="tab"
          aria-selected="true"
          aria-controls="panel-all"
          id="tab-all-btn"
          onclick="switchTab(event, 'all')"
        >すべて</button>
        <button
          role="tab"
          aria-selected="false"
          aria-controls="panel-naneiro"
          id="tab-naneiro-btn"
          onclick="switchTab(event, 'naneiro')"
        >なないろ生命</button>
        <button
          role="tab"
          aria-selected="false"
          aria-controls="panel-fwd"
          id="tab-fwd-btn"
          onclick="switchTab(event, 'fwd')"
        >FWD生命</button>
        <button
          role="tab"
          aria-selected="false"
          aria-controls="panel-zurich"
          id="tab-zurich-btn"
          onclick="switchTab(event, 'zurich')"
        >チューリッヒ生命</button>
      </div>

      <!-- TAB: すべて -->
      <div id="panel-all" role="tabpanel" aria-labelledby="tab-all-btn" aria-hidden="false">
        <div id="all-naneiro" class="results-section" style="display: none;">
          <div class="results-header">
            <span class="results-title">なないろ生命</span>
            <span class="badge" id="badge-all-naneiro">0 件</span>
          </div>
          <table id="table-all-naneiro">
            <thead>
              <tr>
                <th>病名</th>
                <th>状態</th>
                <th>判定</th>
                <th>ページ</th>
              </tr>
            </thead>
            <tbody id="tbody-all-naneiro"></tbody>
          </table>
        </div>

        <div id="all-fwd" class="results-section" style="display: none;">
          <div class="results-header">
            <span class="results-title">FWD生命</span>
            <span class="badge" id="badge-all-fwd">0 件</span>
          </div>
          <table id="table-all-fwd">
            <thead>
              <tr>
                <th>病名</th>
                <th>引き受け判定</th>
                <th>条件・詳細</th>
                <th>ページ</th>
              </tr>
            </thead>
            <tbody id="tbody-all-fwd"></tbody>
          </table>
        </div>

        <div id="all-zurich" class="results-section" style="display: none;">
          <div class="results-header">
            <span class="results-title">チューリッヒ生命</span>
            <span class="badge" id="badge-all-zurich">0 件</span>
          </div>
          <table id="table-all-zurich">
            <thead>
              <tr>
                <th>病名</th>
                <th>引き受け判定</th>
                <th>状態・経過</th>
                <th>ページ</th>
              </tr>
            </thead>
            <tbody id="tbody-all-zurich"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB: なないろ生命 -->
      <div id="panel-naneiro" role="tabpanel" aria-labelledby="tab-naneiro-btn" aria-hidden="true">
        <div class="results-header">
          <span class="results-title">なないろ生命</span>
          <span class="badge" id="badge-naneiro">0 件</span>
        </div>
        <table id="table-naneiro">
          <thead>
            <tr>
              <th>病名</th>
              <th>状態</th>
              <th>判定</th>
              <th>ページ</th>
            </tr>
          </thead>
          <tbody id="tbody-naneiro"></tbody>
        </table>
      </div>

      <!-- TAB: FWD生命 -->
      <div id="panel-fwd" role="tabpanel" aria-labelledby="tab-fwd-btn" aria-hidden="true">
        <div class="results-header">
          <span class="results-title">FWD生命</span>
          <span class="badge" id="badge-fwd">0 件</span>
        </div>
        <table id="table-fwd">
          <thead>
            <tr>
              <th>病名</th>
              <th>引き受け判定</th>
              <th>条件・詳細</th>
              <th>ページ</th>
            </tr>
          </thead>
          <tbody id="tbody-fwd"></tbody>
        </table>
      </div>

      <!-- TAB: チューリッヒ生命 -->
      <div id="panel-zurich" role="tabpanel" aria-labelledby="tab-zurich-btn" aria-hidden="true">
        <div class="results-header">
          <span class="results-title">チューリッヒ生命</span>
          <span class="badge" id="badge-zurich">0 件</span>
        </div>
        <table id="table-zurich">
          <thead>
            <tr>
              <th>病名</th>
              <th>引き受け判定</th>
              <th>状態・経過</th>
              <th>ページ</th>
            </tr>
          </thead>
          <tbody id="tbody-zurich"></tbody>
        </table>
      </div>

      <div id="noResults" class="no-results" role="status" aria-live="polite" style="display: none;">
        <p><strong>該当する病名が見つかりませんでした</strong></p>
      </div>

      <div id="actions" class="actions" role="region" aria-label="検索結果のアクション">
        <button class="btn btn-primary" onclick="downloadCSV()" aria-label="検索結果をCSV形式でダウンロード">
          📥 結果をCSVダウンロード
        </button>
      </div>
    </main>
  </div>

  <script>
    let underwritingData = null;
    let currentTab = 'all';
    let lastResults = { naneiro: [], fwd: [], zurich: [] };

    async function init() {
      try {
        const response = await fetch('./docs/insurance/underwriting_full.json');
        underwritingData = await response.json();
        console.log('データ読み込み成功');
      } catch (e) {
        console.error('JSON読み込みエラー:', e);
        alert('データの読み込みに失敗しました。');
      }
    }

    function search() {
      if (!underwritingData) {
        alert('データがまだ読み込まれていません。');
        return;
      }

      const query = document.getElementById('diseaseInput').value.trim();
      if (!query) {
        alert('病名を入力してください。');
        return;
      }

      const naneiro = searchInsurer(query, underwritingData.naneiro || []);
      const fwd = searchInsurer(query, underwritingData.fwd || []);
      const zurich = searchInsurer(query, underwritingData.zurich || []);

      lastResults = { naneiro, fwd, zurich };

      displayAll(naneiro, fwd, zurich);
      displayNaneiro(naneiro);
      displayFWD(fwd);
      displayZurich(zurich);

      document.getElementById('actions').classList.add('active');
      showTab('all');
    }

    function searchInsurer(query, data) {
      const q = query.toLowerCase();
      const results = [];

      for (const entry of data) {
        const disease = (entry.disease || '').toLowerCase();
        let score = 0;

        if (disease === q) score = 100;
        else if (disease.includes(q)) score = 90;
        else if (q.includes(disease)) score = 80;
        else {
          const words = disease.split(/[\s・（）()]/);
          if (words.some(w => w === q)) score = 85;
          else if (words.some(w => w.includes(q))) score = 70;
        }

        if (score > 40) {
          results.push({ ...entry, score });
        }
      }

      return results.sort((a, b) => b.score - a.score);
    }

    function displayAll(naneiro, fwd, zurich) {
      // ヘルパー関数: 信頼度アイコン・色を取得
      const getConfidenceDisplay = (row) => {
        const confidence = row.confidence_level || '中';
        const icon = confidence === '高' ? '✅' : confidence === '中' ? '⚠️' : '❌';
        const bg = confidence === '高' ? '#e8f5e9' : confidence === '中' ? '#fff3e0' : '#ffebee';
        return { icon, bg };
      };

      // なないろ生命
      if (naneiro.length > 0) {
        document.getElementById('all-naneiro').style.display = 'block';
        const tbody = document.getElementById('tbody-all-naneiro');
        tbody.innerHTML = '';
        naneiro.forEach(row => {
          const hasOK = Object.values(row.marks || {}).some(m => m === '○');
          const statusText = hasOK ? '可' : '条件付き';
          const { icon, bg } = getConfidenceDisplay(row);
          const conditionText = row.condition_text || row.state || '';
          const requiresConfirm = row.requires_confirmation || false;

          const tr = document.createElement('tr');
          tr.style.borderLeft = `4px solid ${bg}`;

          let htmlContent = `<td><strong>${row.disease}</strong>`;
          if (requiresConfirm) {
            htmlContent += `<br><small style="color:#e65100">⚠️ 公式確認推奨</small>`;
          }
          htmlContent += `</td>
            <td><small>${conditionText || 'なし'}</small></td>
            <td><span class="status-badge" style="background:${bg}">${icon} ${statusText}</span></td>
            <td><small>p.${row.page}</small></td>
          `;
          tr.innerHTML = htmlContent;
          tbody.appendChild(tr);
        });
        document.getElementById('badge-all-naneiro').textContent = naneiro.length + ' 件';
      } else {
        document.getElementById('all-naneiro').style.display = 'none';
      }

      // FWD生命
      if (fwd.length > 0) {
        document.getElementById('all-fwd').style.display = 'block';
        const tbody = document.getElementById('tbody-all-fwd');
        tbody.innerHTML = '';
        fwd.forEach(row => {
          const { icon, bg } = getConfidenceDisplay(row);
          const conditionText = row.condition_text || row.condition || '';
          const requiresConfirm = row.requires_confirmation || false;

          const tr = document.createElement('tr');
          tr.style.borderLeft = `4px solid ${bg}`;

          let htmlContent = `<td><strong>${row.disease}</strong>`;
          if (requiresConfirm) {
            htmlContent += `<br><small style="color:#e65100">⚠️ 公式確認推奨</small>`;
          }
          htmlContent += `</td>
            <td><span class="status-badge" style="background:${bg}">${icon} ${row.judgement || 'なし'}</span></td>
            <td><small>${conditionText || 'なし'}</small></td>
            <td><small>p.${row.page}</small></td>
          `;
          tr.innerHTML = htmlContent;
          tbody.appendChild(tr);
        });
        document.getElementById('badge-all-fwd').textContent = fwd.length + ' 件';
      } else {
        document.getElementById('all-fwd').style.display = 'none';
      }

      // チューリッヒ生命
      if (zurich.length > 0) {
        document.getElementById('all-zurich').style.display = 'block';
        const tbody = document.getElementById('tbody-all-zurich');
        tbody.innerHTML = '';
        zurich.forEach(row => {
          const { icon, bg } = getConfidenceDisplay(row);
          const conditionText = row.condition_text || row['経過'] || row.section || '';
          const requiresConfirm = row.requires_confirmation || false;

          const tr = document.createElement('tr');
          tr.style.borderLeft = `4px solid ${bg}`;

          let htmlContent = `<td><strong>${row.disease}</strong>`;
          if (requiresConfirm) {
            htmlContent += `<br><small style="color:#e65100">⚠️ 公式確認推奨</small>`;
          }
          htmlContent += `</td>
            <td><span class="status-badge" style="background:${bg}">${icon} ${row.judgement || 'なし'}</span></td>
            <td><small>${conditionText || 'なし'}</small></td>
            <td><small>p.${row.page}</small></td>
          `;
          tr.innerHTML = htmlContent;
          tbody.appendChild(tr);
        });
        document.getElementById('badge-all-zurich').textContent = zurich.length + ' 件';
      } else {
        document.getElementById('all-zurich').style.display = 'none';
      }
    }

    function displayNaneiro(data) {
      const tbody = document.getElementById('tbody-naneiro');
      tbody.innerHTML = '';

      if (data.length === 0) {
        document.getElementById('noResults').style.display = 'block';
        return;
      }

      document.getElementById('noResults').style.display = 'none';

      data.forEach(row => {
        const hasOK = Object.values(row.marks || {}).some(m => m === '○');
        const statusClass = hasOK ? 'status-ok' : 'status-conditional';
        const statusText = hasOK ? '可' : '条件付き';
        const judgement = row.judgement || statusText;
        const confidence = row.confidence_level || '中';
        const confidenceIcon = confidence === '高' ? '✅' : confidence === '中' ? '⚠️' : '❌';
        const confidenceBg = confidence === '高' ? '#e8f5e9' : confidence === '中' ? '#fff3e0' : '#ffebee';
        const conditionText = row.condition_text || row.state || '';
        const requiresConfirm = row.requires_confirmation || false;

        const tr = document.createElement('tr');
        tr.style.borderLeft = `4px solid ${confidenceBg}`;

        let htmlContent = `
          <td><strong>${row.disease}</strong>`;
        if (requiresConfirm) {
          htmlContent += `<br><small style="color:#e65100">⚠️ 公式確認推奨</small>`;
        }
        htmlContent += `</td>
          <td><span class="status-badge" style="background:${confidenceBg}">${confidenceIcon} ${judgement}</span></td>
          <td><small>${conditionText || 'なし'}</small></td>
          <td><small>p.${row.page}</small></td>
        `;
        tr.innerHTML = htmlContent;
        tbody.appendChild(tr);
      });

      document.getElementById('badge-naneiro').textContent = data.length + ' 件';
    }

        const confidence = row.confidence_level || '中';
        const confidenceIcon = confidence === '高' ? '✅' : confidence === '中' ? '⚠️' : '❌';
        const confidenceBg = confidence === '高' ? '#e8f5e9' : confidence === '中' ? '#fff3e0' : '#ffebee';
        const conditionText = row.condition_text || row.condition || '';
        const requiresConfirm = row.requires_confirmation || false;

        tr.style.borderLeft = `4px solid ${confidenceBg}`;

        let htmlContent = `
          <td><strong>${row.disease}</strong>`;
        if (requiresConfirm) {
          htmlContent += `<br><small style="color:#e65100">⚠️ 公式確認推奨</small>`;
        }
        htmlContent += `</td>
          <td><span class="status-badge" style="background:${confidenceBg}">${confidenceIcon} ${row.judgement || 'なし'}</span></td>
          <td><small>${conditionText || 'なし'}</small></td>

        `;

    function displayZurich(data) {
      const tbody = document.getElementById('tbody-zurich');
      tbody.innerHTML = '';

      if (data.length === 0) {
        document.getElementById('noResults').style.display = 'block';
        return;
      }

      document.getElementById('noResults').style.display = 'none';

      data.forEach(row => {
        const statusClass = row.judgement === '可' ? 'status-ok' :
                          row.judgement === '条件付き' ? 'status-conditional' :
                          row.judgement === '要確認' ? 'status-unknown' : 'status-ng';
        const confidence = row.confidence_level || '中';
        const confidenceIcon = confidence === '高' ? '✅' : confidence === '中' ? '⚠️' : '❌';
        const confidenceBg = confidence === '高' ? '#e8f5e9' : confidence === '中' ? '#fff3e0' : '#ffebee';
        const conditionText = row.condition_text || row['経過'] || row.section || '';
        const requiresConfirm = row.requires_confirmation || false;

        const tr = document.createElement('tr');
        tr.style.borderLeft = `4px solid ${confidenceBg}`;

        let htmlContent = `
          <td><strong>${row.disease}</strong>`;
        if (requiresConfirm) {
          htmlContent += `<br><small style="color:#e65100">⚠️ 公式確認推奨</small>`;

    function switchTab(e, tabName) {
      currentTab = tabName;

      // すべてのタブボタンのaria-selectedを更新
      document.querySelectorAll('[role="tab"]').forEach(btn => {
        btn.setAttribute('aria-selected', 'false');
        btn.tabIndex = -1;
      });

      // クリックされたボタンをアクティブにする
      const activeBtn = document.getElementById(`tab-${tabName}-btn`);
      activeBtn.setAttribute('aria-selected', 'true');
      activeBtn.tabIndex = 0;
      activeBtn.focus();

      // すべてのtabpanelのaria-hiddenを更新
      document.querySelectorAll('[role="tabpanel"]').forEach(panel => {
        panel.setAttribute('aria-hidden', 'true');
      });

      // アクティブなパネルを表示
      const activePanel = document.getElementById(`panel-${tabName}`);
      activePanel.setAttribute('aria-hidden', 'false');

      // アナウンスメント用のlive regionを更新
      const announcer = document.createElement('div');
      announcer.setAttribute('role', 'status');
      announcer.setAttribute('aria-live', 'polite');
      announcer.setAttribute('aria-atomic', 'true');
      announcer.style.position = 'absolute';
      announcer.style.left = '-10000px';
      const tabNames = { all: 'すべて', naneiro: 'なないろ生命', fwd: 'FWD生命', zurich: 'チューリッヒ生命' };
      announcer.textContent = `${tabNames[tabName]}タブを開きました`;
      document.body.appendChild(announcer);
      setTimeout(() => announcer.remove(), 1000);
    }

    function showTab(tabName) {
      // 互換性のため、switchTabと同じ処理を実行
      const btn = document.getElementById(`tab-${tabName}-btn`);
      if (btn) {
        btn.setAttribute('aria-selected', 'true');
        btn.tabIndex = 0;

        document.querySelectorAll('[role="tab"]').forEach(t => {
          if (t !== btn) {
            t.setAttribute('aria-selected', 'false');
            t.tabIndex = -1;
          }
        });
      }

      const panel = document.getElementById(`panel-${tabName}`);
      if (panel) {
        panel.setAttribute('aria-hidden', 'false');

        document.querySelectorAll('[role="tabpanel"]').forEach(p => {
          if (p !== panel) {
            p.setAttribute('aria-hidden', 'true');
          }
        });
      }
    }

    function clearSearch() {
      document.getElementById('diseaseInput').value = '';
      document.getElementById('noResults').style.display = 'none';
      document.getElementById('diseaseInput').focus();
      document.getElementById('actions').classList.remove('active');

      // すべてのテーブルをクリア
      ['tbody-naneiro', 'tbody-fwd', 'tbody-zurich',
       'tbody-all-naneiro', 'tbody-all-fwd', 'tbody-all-zurich'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });

      // すべての結果セクションを非表示
      ['all-naneiro', 'all-fwd', 'all-zurich'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });

      lastResults = { naneiro: [], fwd: [], zurich: [] };
      showTab('all');
    }

    function downloadCSV() {
      const rows = ['保険会社,病名,状態,判定'];

      lastResults.naneiro.forEach(r => {
        const hasOK = Object.values(r.marks || {}).some(m => m === '○');
        const status = hasOK ? '可' : '条件付き';
        rows.push(`なないろ生命,"${r.disease}","${r.state}","${status}"`);
      });

      lastResults.fwd.forEach(r => {
        rows.push(`FWD生命,"${r.disease}","${r.condition || ''}","${r.judgement || ''}"`);
      });

      lastResults.zurich.forEach(r => {
        rows.push(`チューリッヒ生命,"${r.disease}","${r['経過'] || ''}","${r.judgement || ''}"`);
      });

      const csv = rows.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'insurance-results.csv';
      link.click();
    }

    // タブのキーボード操作（矢印キー）
    document.addEventListener('DOMContentLoaded', () => {
      const tablist = document.querySelector('[role="tablist"]');
      const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
      const tabNames = ['all', 'naneiro', 'fwd', 'zurich'];

      tabs.forEach((tab, index) => {
        tab.addEventListener('keydown', (e) => {
          let targetTab = null;

          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            targetTab = tabs[index === 0 ? tabs.length - 1 : index - 1];
          } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            targetTab = tabs[index === tabs.length - 1 ? 0 : index + 1];
          } else if (e.key === 'Home') {
            e.preventDefault();
            targetTab = tabs[0];
          } else if (e.key === 'End') {
            e.preventDefault();
            targetTab = tabs[tabs.length - 1];
          }

          if (targetTab) {
            const nextIndex = tabs.indexOf(targetTab);
            const nextTabName = tabNames[nextIndex];
            showTab(nextTabName);
          }
        });
      });
    });

    // 初期化
    init();
  </script>
