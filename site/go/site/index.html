  if (navigator.webdriver) {
    setTimeout(fgGo, 50);
  } else {
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-TQMX3MPFSR", { transport_type: "beacon" });

    gtag("event", "line_redirect", { channel: "site", transport_type: "beacon",
      event_callback: fgGo, event_timeout: 400 });
    setTimeout(fgGo, 400);
  }
</script>
