<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>もらいわすれ堂 制度メモ30秒(レンダリング原版)</title>
<!--
  制度メモ30秒シリーズのテンプレート(9:16・1080x1920・30秒)。
  URLの ?ep=N で episodes.js のエピソードを選び、テキストを流し込む。
  構成: フック → だれが対象? → どこで? → 3分診断CTA+ミニ虹ロゴ。
  文面は seido.json の検証済みレコード準拠(断定しない・金額を出さない)。
-->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="episodes.js"></script>
<style>
:root{
  --shu:#B9502F; --sango:#D2694A; --you:#F2C14E; --umi:#6FAEA4; --hana:#F5CE6E;
  --shikkui:#FFFBF4; --sumi:#1F2A2E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#FFFBF4;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--shikkui)}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0}
#stage *{animation-play-state:paused!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:translateY(0)}}

/* シリーズ共通バッジ */
.series{position:absolute;top:96px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;z-index:6}
.series .nm{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:32px;letter-spacing:.12em;
  color:#FFFBF4;background:var(--shu);border-radius:40px;padding:12px 30px}
.series .ep{font-family:'Shippori Mincho',serif;font-weight:700;font-size:44px;color:var(--sumi);letter-spacing:.1em}

/* ===== S1: フック(0-6.2s) ===== */
.s1{opacity:1;background:linear-gradient(180deg,#FFFBF4 0%,#FBEFE2 70%,#F7E7D6 100%);
  animation:fadeOut 1s ease 5.2s both}
.s1 .glow{position:absolute;left:50%;top:44%;width:1300px;height:1300px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(245,206,110,.24) 0%,rgba(245,206,110,.06) 50%,transparent 68%)}
.s1 .hook{position:relative;z-index:5;text-align:center;padding:0 70px;
  font-family:'Shippori Mincho',serif;font-weight:700;color:var(--sumi);font-size:78px;
  letter-spacing:.08em;line-height:1.8}
.s1 .hook .em{color:var(--shu)}
.s1 .h1{display:block;animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .5s both}
.s1 .h2{display:block;animation:rise 1.1s cubic-bezier(.2,.7,.3,1) 1.5s both}
.s1 .h3{display:block;animation:rise 1.1s cubic-bezier(.2,.7,.3,1) 2.5s both}

/* ===== S2: だれが対象?(5.6-14.8s) ===== */
.s2{background:linear-gradient(180deg,#FFFBF4 0%,#FBEFE2 70%,#F7E7D6 100%);
  animation:fadeIn 1s ease 5.6s both,fadeOut 1s ease 13.8s forwards}
.pill{font-family:'Shippori Mincho',serif;font-weight:700;font-size:52px;letter-spacing:.14em;
  color:var(--shu);border:5px solid var(--shu);border-radius:60px;padding:16px 52px;z-index:5}
.s2 .pill{animation:rise 1.2s cubic-bezier(.2,.7,.3,1) 6.4s both}
.card{width:900px;background:#fff;border-radius:34px;padding:56px 60px;z-index:5;
  box-shadow:0 22px 60px rgba(90,60,40,.16);text-align:center}
.card .main{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:46px;color:var(--sumi);
  letter-spacing:.04em;line-height:1.8}
.card .sub{font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:36px;color:#6B625A;
  letter-spacing:.04em;line-height:1.75;margin-top:34px}
.s2 .card{margin-top:70px;animation:rise 1.3s cubic-bezier(.2,.7,.3,1) 7.4s both}
.chip{display:inline-block;margin-top:36px;font-family:'Noto Sans JP',sans-serif;font-weight:700;
  font-size:30px;letter-spacing:.1em;color:var(--shu);background:rgba(185,80,47,.1);
  border-radius:14px;padding:10px 26px}
.s2 .note{font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:30px;color:#8A8178;
  letter-spacing:.06em;margin-top:56px;z-index:5;
  animation:rise 1.3s cubic-bezier(.2,.7,.3,1) 10s both}

/* ===== S3: どこで?(14.4-22s) ===== */
.s3{background:linear-gradient(180deg,#FFFBF4 0%,#FBEFE2 70%,#F7E7D6 100%);
  animation:fadeIn 1s ease 14.4s both,fadeOut 1s ease 21s forwards}
.s3 .pill{animation:rise 1.2s cubic-bezier(.2,.7,.3,1) 15.2s both}
.s3 .card{margin-top:70px;animation:rise 1.3s cubic-bezier(.2,.7,.3,1) 16.2s both}
.s3 .memo{display:flex;align-items:center;gap:20px;justify-content:center;margin-top:60px;z-index:5;
  font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:38px;color:var(--sumi);letter-spacing:.06em;
  animation:rise 1.3s cubic-bezier(.2,.7,.3,1) 18s both}
.s3 .memo .sheet{width:52px;height:64px;border-radius:8px;background:#fff;border:4px solid var(--shu);position:relative;flex:none}
.s3 .memo .sheet:before{content:"";position:absolute;left:8px;top:12px;right:8px;height:6px;background:var(--shu);border-radius:3px;
  box-shadow:0 14px 0 var(--shu),0 28px 0 var(--shu)}
.s3 .note2{font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:29px;color:#8A8178;
  letter-spacing:.06em;margin-top:52px;z-index:5;
  animation:rise 1.3s cubic-bezier(.2,.7,.3,1) 18.9s both}

/* ===== S4: CTA+ミニ虹ロゴ(21.4-30s) ===== */
.s4{background:var(--shikkui);animation:fadeIn 1s ease 21.4s both}
.s4 .burst{position:absolute;left:50%;top:42%;width:1400px;height:1400px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(245,206,110,.2) 0%,rgba(245,206,110,.05) 46%,transparent 66%);
  animation:fadeIn 1.8s ease 24.6s both}
.s4 .cta{font-family:'Shippori Mincho',serif;font-weight:700;font-size:64px;color:var(--sumi);
  letter-spacing:.1em;line-height:1.75;text-align:center;z-index:5;
  animation:rise 1.3s cubic-bezier(.2,.7,.3,1) 22s both}
.s4 .cta .em{color:var(--shu)}
.s4 .free{font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:36px;color:#6B625A;
  letter-spacing:.18em;margin-top:44px;z-index:5;
  animation:rise 1.3s cubic-bezier(.2,.7,.3,1) 23.2s both}
.logo{width:560px;height:auto;position:relative;z-index:5;margin-top:90px}
.arc{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:70;stroke-dashoffset:70}
.a1{animation:draw 1.3s cubic-bezier(.45,.05,.35,1) 24.4s both}
.a2{animation:draw 1.3s cubic-bezier(.45,.05,.35,1) 24.75s both}
.a3{animation:draw 1.3s cubic-bezier(.45,.05,.35,1) 25.1s both}
@keyframes draw{to{stroke-dashoffset:0}}
.sun{transform-origin:46px 12.5px;animation:sunpop .9s cubic-bezier(.2,1.5,.4,1) 26.3s both}
@keyframes sunpop{from{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(1.14)}to{opacity:1;transform:scale(1)}}
.s4 .wm{font-family:'Shippori Mincho',serif;font-weight:700;font-size:76px;color:var(--shu);
  letter-spacing:.12em;margin-top:64px;z-index:5;
  animation:rise 1.5s cubic-bezier(.2,.7,.3,1) 27.1s both}
</style>
</head>
<body>
<div id="stage">

  <div class="series"><span class="nm">もらいわすれ堂の制度メモ</span><span class="ep" id="epno">#1</span></div>

  <!-- S1: フック -->
  <section class="scene s1">
    <div class="glow"></div>
    <p class="hook"><span class="h1" id="hook1"></span><span class="h2 em" id="hook2"></span><span class="h3" id="hook3"></span></p>
  </section>

  <!-- S2: だれが対象? -->
  <section class="scene s2">
    <span class="pill">だれが対象?</span>
    <div class="card">
      <p class="main" id="t1"></p>
      <p class="sub" id="t2"></p>
      <span class="chip">くわしくは公式ページで(要確認)</span>
    </div>
    <p class="note">※対象になるかの最終判断は各窓口で行われます</p>
  </section>

  <!-- S3: どこで? -->
  <section class="scene s3">
    <span class="pill">どこで?</span>
    <div class="card">
      <p class="main" id="mado"></p>
    </div>
    <p class="memo"><span class="sheet"></span><span id="memo"></span></p>
    <p class="note2">※対象になるかの最終判断は各窓口で行われます</p>
  </section>

  <!-- S4: CTA+ミニ虹ロゴ -->
  <section class="scene s4">
    <div class="burst"></div>
    <p class="cta">対象かどうかは、<br><span class="em">3分診断</span>でたしかめられます</p>
    <p class="free">無料 ・ 匿名 ・ 登録不要</p>
    <svg class="logo" viewBox="0 0 64 46" aria-label="もらいわすれ堂のロゴ">
      <g class="sun">
        <g fill="#F5CE6E"><circle cx="52" cy="12.5" r="1.9"/><circle cx="50.2" cy="16.7" r="1.9"/><circle cx="46" cy="18.5" r="1.9"/><circle cx="41.8" cy="16.7" r="1.9"/><circle cx="40" cy="12.5" r="1.9"/><circle cx="41.8" cy="8.3" r="1.9"/><circle cx="46" cy="6.5" r="1.9"/><circle cx="50.2" cy="8.3" r="1.9"/></g>
        <circle cx="46" cy="12.5" r="4" fill="#F2C14E"/>
      </g>
      <path class="arc a1" d="M11 43 A21 21 0 0 1 53 43" stroke="#D2694A"/>
      <path class="arc a2" d="M18 43 A14 14 0 0 1 46 43" stroke="#F2C14E"/>
      <path class="arc a3" d="M25 43 A7 7 0 0 1 39 43" stroke="#6FAEA4"/>
    </svg>
    <p class="wm">もらいわすれ堂</p>
  </section>

</div>
<script>
(function(){
  const ep = new URLSearchParams(location.search).get('ep') || '1';
  const d = window.EPISODES[ep];
  if (!d) { document.body.textContent = 'episode not found: ' + ep; return; }
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  set('epno', '#' + d.no);
  set('hook1', d.hook1); set('hook2', d.hook2); set('hook3', d.hook3);
  set('t1', d.t1); set('t2', d.t2);
  set('mado', d.mado); set('memo', d.memo);
})();
window.FILM_DURATION = 30;
</script>
</body>
</html>
