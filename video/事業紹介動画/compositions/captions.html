<template id="captions-template" data-composition-id="captions" data-width="1920" data-height="1080">
<script src="vendor/gsap.min.js"></script>


<style data-brand-tokens>
      :root {
      --bg: #FFFFFF;
      --primary: #F88800;
      --text: #00335C;
      --text-muted: #F88800;
      --text-light: #9A9A9A;
      --accent-light: rgba(248, 136, 0, 0.08);
      --accent-medium: rgba(248, 136, 0, 0.15);
      --border: rgba(248, 136, 0, 0.2);
      --card-bg: rgba(248, 136, 0, 0.04);
      --positive: #059669;
      --negative: #dc2626;
      --cap-ink: #00335C;
      --cap-canvas: #FFFFFF;
      --cap-accent: #F88800;
      --cap-accent-2: #F88800;
      --font-display: "Meiryo", system-ui, serif;
      --font-body: "Meiryo", system-ui, sans-serif;
      --cap-band-top: 900px;
      --cap-band-height: 180px;
      }
    </style>

<style>
  /* frame.md names "Meiryo" (Windows-only); this render machine has no such
     file but does have IPAGothic installed as a system font — alias it in so
     Japanese caption text renders correctly instead of falling back unstyled. */
  @font-face {
    font-family: "Meiryo";
    src: local("Meiryo"), local("IPAGothic"), local("IPAゴシック");
  }
</style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE tinted card — 4% cobalt fill, 1.5px 20%-cobalt border, soft 14px corners,
     NO shadow (the tinted card does the lift; cast depth is forbidden) */
  .caption-pill {
    max-width: 78%;
    padding: 20px 44px 24px;
    background: color-mix(in srgb, var(--cap-accent, #1e2bfa) 4%, var(--cap-canvas, #fdfae7));
    border: 1.5px solid color-mix(in srgb, var(--cap-accent, #1e2bfa) 20%, transparent);
    border-radius: 14px;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: "Meiryo", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.02em;
  }

  /* upcoming — muted gray, no chip */
  .caption-word {
    display: inline-block;
    padding: 0 0.18em;
    border-radius: 0.32em;
    color: color-mix(in srgb, var(--cap-ink, #111111) 80%, var(--cap-canvas, #fdfae7));
  }
  /* current word — THE solid cobalt chip (the single-accent gesture; pill-rounded
     fill, NO shadow), cream reading on top */
  .caption-word.is-active {
    /* white-on-accent measured 2.47:1 against this brand's orange accent (below
       the 3:1 large-text minimum) — ink-on-accent clears ~5:1 instead. */
    color: var(--cap-ink, #111111);
    background: var(--cap-accent, #1e2bfa);
    box-shadow: none;
  }
  /* already spoken — solid near-black ink, chip cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #111111);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — cobalt, the system's one accent on a key word */
  .caption-word.cap-brand {
    color: var(--cap-accent, #1e2bfa);
  }
  /* numerals / data — cobalt 700, the figure voice */
  .caption-word.cap-num {
    font-family: "Meiryo", system-ui, sans-serif;
    font-weight: 700;
    color: var(--cap-accent, #1e2bfa);
  }
  /* emphasis — a directional-red hairline underline (inline only, never a fill) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #dc2626);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="85.865"
  data-fps="30"
  data-width="1920"
  data-height="1080"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0,"end":12.352,"text":"補助金の締切を、知らずに逃した経験はありませんか？","words":[{"id":"caption-word-0-0","text":"補助金の締切を、知らずに逃した経験はありませんか？","start":0,"end":12.352}]},{"id":"caption-group-1","frame":2,"start":12.352,"end":29.205,"text":"沖縄企業のミカタが、補助金情報を毎日自動でお届けします。","words":[{"id":"caption-word-1-0","text":"沖縄企業のミカタが、補助金情報を毎日自動でお届けします。","start":12.352,"end":29.205}]},{"id":"caption-group-2","frame":3,"start":29.205,"end":44.266,"text":"掲載情報は原文を確認して公開しているので安心です。","words":[{"id":"caption-word-2-0","text":"掲載情報は原文を確認して公開しているので安心です。","start":29.205,"end":44.266}]},{"id":"caption-group-3","frame":4,"start":44.266,"end":57.919,"text":"LINE登録で、締切の約1か月前からお知らせが届きます。","words":[{"id":"caption-word-3-0","text":"LINE登録で、締切の約1か月前からお知らせが届きます。","start":44.266,"end":57.919}]},{"id":"caption-group-4","frame":5,"start":57.919,"end":72.852,"text":"『補助金・助成金の情報で、沖縄の企業にあかりを。』","words":[{"id":"caption-word-4-0","text":"『補助金・助成金の情報で、沖縄の企業にあかりを。』","start":57.919,"end":72.852}]},{"id":"caption-group-5","frame":6,"start":72.852,"end":85.985,"text":"今すぐLINE登録して、沖縄企業のミカタで検索を。","words":[{"id":"caption-word-5-0","text":"今すぐLINE登録して、沖縄企業のミカタで検索を。","start":72.852,"end":85.865}]}];
  var DURATION = 85.865;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.18, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
</template>
