<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>もらいわすれ堂 — あかりの島(60秒ブランドアニメ)</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
:root{
  --shu:#B9502F; --sango:#D2694A; --hi:#F2C14E; --umi:#6FAEA4; --hana:#F5CE6E;
  --shikkui:#FFFBF4; --sumi:#1F2A2E;
}
html,body{margin:0;padding:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--shikkui);
  font-family:'Shippori Mincho',serif;color:#FFFBF4}
#stage *{animation-play-state:paused!important}
#stage.live *{animation-play-state:running!important}

/* ---- 最終ロゴ(DOM・キャンバスの下に敷いて、夜明けと共に透けてくる) ---- */
.logo{position:absolute;left:156px;top:504px;width:768px;height:552px;opacity:0;
  animation:show .01s linear 49.9s forwards}
.logo .arc{fill:none;stroke-width:6;stroke-linecap:round}
.logo .sun{transform-box:fill-box;transform-origin:center;transform:scale(0);
  animation:pop 1.1s cubic-bezier(.34,1.56,.64,1) 51.4s forwards}
@keyframes show{to{opacity:1}}
@keyframes pop{to{transform:scale(1)}}

/* ---- キャンバス(夜の世界)。50秒から2.6秒で朝(漆喰)へ溶ける ---- */
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px;
  animation:cvout 2.6s cubic-bezier(.4,0,.6,1) 50s forwards}
@keyframes cvout{to{opacity:0}}

/* ---- テキスト(DOM) ---- */
.slot{position:absolute;left:40px;right:40px;text-align:center;z-index:5}
.top{top:190px}
.top2{top:240px}
.in{opacity:0;animation:in 1.5s cubic-bezier(.2,.7,.2,1) forwards}
.out{animation:out 1.1s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0}}
.line{display:block;font-weight:700;font-size:84px;line-height:1.5;letter-spacing:.04em;
  text-shadow:0 2px 30px rgba(0,0,0,.55),0 0 60px rgba(242,193,78,.18)}
.line.small{font-size:69px}
.line.big{font-size:150px;line-height:1.25;color:var(--hi);letter-spacing:.04em;
  text-shadow:0 0 50px rgba(242,193,78,.55),0 2px 30px rgba(0,0,0,.5)}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:0 30px;padding:0}
.words .line{font-size:90px}
.chip{display:inline-block;margin-top:24px;padding:14px 44px;border-radius:999px;
  font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:51px;letter-spacing:.06em;
  color:#FFFBF4;background:rgba(185,80,47,.85);text-shadow:none}

/* ---- 締めのロックアップ ---- */
.wm{position:absolute;left:0;right:0;top:1100px;text-align:center;font-weight:600;font-size:136px;
  letter-spacing:.04em;color:var(--shu);opacity:0;animation:in 1.6s cubic-bezier(.2,.7,.2,1) 52.6s forwards;z-index:4}
.tag{position:absolute;left:0;right:0;top:1310px;text-align:center;font-weight:600;font-size:54px;
  letter-spacing:.08em;color:var(--umi);opacity:0;animation:in 1.6s cubic-bezier(.2,.7,.2,1) 54.2s forwards;z-index:4}
.cta{position:absolute;left:0;right:0;top:1450px;text-align:center;font-family:'Noto Sans JP',sans-serif;
  font-weight:500;font-size:44px;letter-spacing:.08em;line-height:1.5;color:var(--sumi);opacity:0;
  animation:in 1.4s cubic-bezier(.2,.7,.2,1) 56.2s forwards;z-index:4}
.cta b{display:inline-block;margin-bottom:16px;padding:12px 40px;border-radius:999px;background:var(--shu);color:#FFFBF4;font-weight:500}
.corp{position:absolute;left:0;right:0;top:1790px;text-align:center;font-family:'Noto Sans JP',sans-serif;
  font-weight:500;font-size:32px;letter-spacing:.2em;color:#9A8F86;opacity:0;
  animation:in 1.4s ease 57s forwards;z-index:4}
</style>
</head>
<body>
<div id="stage">

  <!-- 最終ロゴ(キャンバスの虹と同じ座標・同じ半径) -->
  <svg class="logo" viewBox="0 0 64 46" aria-label="もらいわすれ堂のロゴ">
    <path class="arc" d="M11 43 A21 21 0 0 1 53 43" stroke="#D2694A"/>
    <path class="arc" d="M18 43 A14 14 0 0 1 46 43" stroke="#F2C14E"/>
    <path class="arc" d="M25 43 A7 7 0 0 1 39 43" stroke="#6FAEA4"/>
    <g class="sun">
      <g fill="#F5CE6E">
        <circle cx="52" cy="16.5" r="1.9"/><circle cx="50.2" cy="20.7" r="1.9"/>
        <circle cx="46" cy="22.5" r="1.9"/><circle cx="41.8" cy="20.7" r="1.9"/>
        <circle cx="40" cy="16.5" r="1.9"/><circle cx="41.8" cy="12.3" r="1.9"/>
        <circle cx="46" cy="10.5" r="1.9"/><circle cx="50.2" cy="12.3" r="1.9"/>
      </g>
      <circle cx="46" cy="16.5" r="4" fill="#F2C14E"/>
    </g>
  </svg>

  <canvas id="cv" width="1080" height="1920"></canvas>

  <!-- S1 よる -->
  <div class="slot top">
    <div class="out" style="animation-delay:6.3s">
      <span class="line in" style="animation-delay:1.2s">沖縄の夜に、</span>
      <span class="line in" style="animation-delay:3.2s">まだ受け取られていない<br>あかりが、あります。</span>
    </div>
  </div>

  <!-- S2 あかり -->
  <div class="slot top">
    <div class="out" style="animation-delay:12.4s">
      <div class="words">
        <span class="line in" style="animation-delay:8.3s">子育て。</span>
        <span class="line in" style="animation-delay:9.0s">医療。</span>
        <span class="line in" style="animation-delay:9.7s">教育。</span>
        <span class="line in" style="animation-delay:10.4s">住まい。</span>
        <span class="line in" style="animation-delay:11.1s">仕事。</span>
      </div>
    </div>
  </div>
  <div class="slot top">
    <div class="out" style="animation-delay:16.6s">
      <span class="line in" style="animation-delay:13.2s">県民のための制度は、</span>
      <span class="line big in" style="animation-delay:14.0s">200以上。</span>
    </div>
  </div>

  <!-- S3 まっくらな家 -->
  <div class="slot top">
    <div class="out" style="animation-delay:26.4s">
      <span class="line in" style="animation-delay:18.6s">でも、制度は<br>自分からは<br>来てくれません。</span>
      <span class="line in" style="animation-delay:22.6s">知らなければ、<br>あかりは届かない。</span>
    </div>
  </div>

  <!-- S4 いっしょに -->
  <div class="slot top">
    <div class="out" style="animation-delay:39.6s">
      <span class="line in" style="animation-delay:33.0s">もらいわすれ堂は、</span>
      <span class="line small in" style="animation-delay:34.6s">あなたが受け取れる<br>かもしれない制度を、<br>いっしょに、さがします。</span>
      <span class="chip in" style="animation-delay:37.2s">3分診断 ・ 無料 ・ 匿名</span>
    </div>
  </div>

  <!-- S5 にじ -->
  <div class="slot top2">
    <div class="out" style="animation-delay:49.6s">
      <span class="line in" style="animation-delay:44.4s">とどけ、</span>
      <span class="line in" style="animation-delay:46.2s">沖縄のみらいへ。</span>
    </div>
  </div>

  <!-- S6 ロゴ -->
  <div class="wm">もらいわすれ堂</div>
  <div class="tag">あなたが受け取るまで、いっしょに。</div>
  <div class="cta"><b>3分診断</b><br>無料・匿名・登録不要</div>
  <div class="corp">株式会社フクギイロ</div>
</div>

<script>
window.FILM_DURATION = 60;
(() => {
const W = 1080, H = 1920;
const cv = document.getElementById('cv');
const g = cv.getContext('2d');

// ---------- 乱数(決定的) ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20260929);
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,p)=>a+(b-a)*p;
const smooth=p=>{p=clamp(p);return p*p*(3-2*p)};
const smoother=p=>{p=clamp(p);return p*p*p*(p*(p*6-15)+10)};
const easeOut=p=>{p=clamp(p);return 1-Math.pow(1-p,3)};
const easeIn=p=>{p=clamp(p);return p*p*p};

// ---------- 世界:沖縄本島(様式化した輪郭。x右・y下、北が上) ----------
const ISLAND = [[330,40],[390,120],[420,230],[400,330],[430,420],[400,520],[385,640],[410,720],
  [395,830],[360,900],[370,960],[400,1020],[450,1060],[420,1110],[400,1200],[430,1280],[470,1330],
  [430,1400],[360,1450],[280,1460],[220,1420],[200,1340],[230,1250],[210,1160],[240,1060],[210,1000],
  [250,930],[270,860],[230,760],[215,660],[170,600],[120,560],[130,500],[200,470],[250,420],[260,330],
  [290,220],[300,120]];
// 実際の沖縄本島と同じく南西→北東へ斜めに置く(北端が右上)。中心(300,750)まわりに時計回り32°
const TILT=45*Math.PI/180, PIV={x:300,y:750};
function rot(x,y){const dx=x-PIV.x,dy=y-PIV.y,c=Math.cos(TILT),sn=Math.sin(TILT);return [PIV.x+dx*c-dy*sn, PIV.y+dx*sn+dy*c]}
for(let i=0;i<ISLAND.length;i++)ISLAND[i]=rot(ISLAND[i][0],ISLAND[i][1]);
const BB={x0:Math.min(...ISLAND.map(p=>p[0])),x1:Math.max(...ISLAND.map(p=>p[0])),y0:Math.min(...ISLAND.map(p=>p[1])),y1:Math.max(...ISLAND.map(p=>p[1]))};
function inPoly(x,y){let inside=false;for(let i=0,j=ISLAND.length-1;i<ISLAND.length;j=i++){
  const [xi,yi]=ISLAND[i],[xj,yj]=ISLAND[j];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside}return inside}
let ISLAND_LEN=0;for(let i=0;i<ISLAND.length;i++){const a=ISLAND[i],b=ISLAND[(i+1)%ISLAND.length];ISLAND_LEN+=Math.hypot(b[0]-a[0],b[1]-a[1])}

const HS = 1.7;                                     // 家の大きさ(世界単位の倍率)
const HOUSE = (()=>{const [x,y]=rot(300,1300);return {x,y}})();
const WINDOW = {x:HOUSE.x+14*HS,y:HOUSE.y+1*HS};
const KIDX = -5;                                    // 子どもの立ち位置(家の単位)

// ---------- カメラ ----------
// S1/S2: 島全体を、上の文字帯(〜560px)を避けて収める
const Z1=Math.min(880/(BB.x1-BB.x0), 1240/(BB.y1-BB.y0));
const CAM1={x:(BB.x0+BB.x1)/2, y:BB.y0+(400/Z1), z:Z1};
// S3/S4: 家に寄る(家は画面中央よりやや下)
const CAM3={x:HOUSE.x, y:HOUSE.y-64, z:6};
// S5/S6: 引き。家が画面下(y≒1500)、虹が上
const Z5=0.8;
const CAM5={x:(BB.x0+BB.x1)/2, y:HOUSE.y-540/Z5, z:Z5};
const CAM = [
  [0,   CAM1],
  [17,  CAM1],
  [21.8,CAM3],
  [40,  CAM3],
  [43.2,CAM5],
];
const CAM_FINAL = CAM[CAM.length-1][1];
function camAt(t){
  if(t<=CAM[0][0])return CAM[0][1];
  for(let i=0;i<CAM.length-1;i++){const [t0,a]=CAM[i],[t1,b]=CAM[i+1];
    if(t>=t0&&t<=t1){const p=smoother((t-t0)/(t1-t0));
      return {x:lerp(a.x,b.x,p),y:lerp(a.y,b.y,p),z:Math.exp(lerp(Math.log(a.z),Math.log(b.z),p))}}}
  return CAM_FINAL;
}
const toS=(p,c)=>({x:(p.x-c.x)*c.z+W/2,y:(p.y-c.y)*c.z+H/2});
const toW=(s,c)=>({x:(s.x-W/2)/c.z+c.x,y:(s.y-H/2)/c.z+c.y});

// ---------- 虹(最終カメラでの画面座標=DOMロゴと一致) ----------
const LOGO = {left:156, top:504, s:12};
const ARC_C = {x:LOGO.left+32*LOGO.s, y:LOGO.top+43*LOGO.s};   // (540,1020)
const ARC_R = [21*LOGO.s, 14*LOGO.s, 7*LOGO.s];                 // 252,168,84
const ARC_COL = ['#D2694A','#F2C14E','#6FAEA4'];
const ARC_STROKE = 6*LOGO.s;                                    // 72
function arcPointS(k,theta,off){const phi=Math.PI+theta*Math.PI;const r=ARC_R[k]+off;
  return {x:ARC_C.x+r*Math.cos(phi),y:ARC_C.y+r*Math.sin(phi)}}

// ---------- あかり(制度) ----------
const COLS = [
  {c:'#F5CE6E',w:.56},{c:'#F2C14E',w:.24},{c:'#E58A6E',w:.12},{c:'#8FD0C4',w:.08}];
function pickCol(u){let a=0;for(const c of COLS){a+=c.w;if(u<a)return c.c}return COLS[0].c}
const lights=[];
while(lights.length<470){
  const x=BB.x0+rnd()*(BB.x1-BB.x0),y=BB.y0+rnd()*(BB.y1-BB.y0);
  if(!inPoly(x,y))continue;
  const d=Math.hypot(x-HOUSE.x,y-HOUSE.y);
  if(d<28*HS)continue;
  lights.push({x,y,u:rnd(),v:rnd(),ph:rnd()*6.283,w:1.2+rnd()*2.2,col:pickCol(rnd()),near:d<100,type:'isl'});
}
// S4 流れ込む追加のあかり(画面外から家へ)
for(let i=0;i<70;i++){
  const a=rnd()*6.283,r=170+rnd()*60;
  lights.push({x:WINDOW.x+Math.cos(a)*r,y:WINDOW.y+Math.sin(a)*r,u:rnd(),v:rnd(),ph:rnd()*6.283,w:2,col:pickCol(rnd()),near:true,type:'ext'});
}
for(const l of lights){
  l.ig = l.type==='isl' ? 7.2+9.2*Math.pow(l.u,1.6) : 0;
  l.st = 33.2+l.v*4.2;                         // 家へ向かう開始
  l.pop = l.type==='isl' ? 0 : 0;
}
// 虹の座席:半径に比例して配分し、角度を均等に割り当てる(左端→右端の順に到着)
{
  const groups=[[],[],[]];
  for(const l of lights){const u=rnd();l.arc=u<.5?0:u<.833?1:2;groups[l.arc].push(l)}
  groups.forEach(gr=>{gr.sort((a,b)=>a.ph-b.ph);gr.forEach((l,i)=>{l.theta=(i+.5)/gr.length;l.off=(rnd()-.5)*44})});
}
for(const l of lights){
  l.arrive = 45.3+3.9*l.theta;
  l.rise = l.arrive-2.7;
  const ts=arcPointS(l.arc,l.theta,l.off);
  l.target = toW(ts,CAM_FINAL);
  const wob=(l.u-.5)*220, fz=CAM_FINAL.z;   // 画面px相当→世界単位
  l.c1 = {dx:wob*.3/fz, dy:-(260+280*l.v)/fz};
  l.c2 = {dx:wob/fz, dy:120/fz};
  l.absorbAt = l.near ? l.st+2.3 : Infinity;   // 家に吸い込まれる時刻
}

// ---------- 星(画面座標) ----------
const stars=[];for(let i=0;i<170;i++)stars.push({x:rnd()*W,y:rnd()*H*.9,r:.6+rnd()*1.4,ph:rnd()*6.283,w:.5+rnd()*1.5,a:.35+rnd()*.5});

// ---------- 光のスプライト ----------
const sprites={};
function sprite(col){if(sprites[col])return sprites[col];
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const rgb=hex2rgb(col);
  const gr2=x.createRadialGradient(32,32,0,32,32,32);
  gr2.addColorStop(0,'rgba(255,255,255,1)');gr2.addColorStop(.16,`rgba(${rgb},1)`);gr2.addColorStop(.42,`rgba(${rgb},.32)`);gr2.addColorStop(1,`rgba(${rgb},0)`);
  x.fillStyle=gr2;x.fillRect(0,0,64,64);return sprites[col]=c}
function hex2rgb(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}
function glow(sx,sy,size,col,alpha){if(alpha<=0.003||size<=0)return;g.globalAlpha=clamp(alpha);g.drawImage(sprite(col),sx-size/2,sy-size/2,size,size)}

// ---------- 曲線 ----------
function cubic(p0,p1,p2,p3,t){const u=1-t;return{
  x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
  y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}}

// ---------- 案内のあかり(画面座標・27〜31.9秒) ----------
function guidePos(t){
  const winS = toS(WINDOW,CAM3);
  if(t<29.6){const p=smooth((t-27)/2.6);return {x:W/2+150*Math.sin((t-27)*2.4)*(1-p*.3),y:lerp(-80,winS.y-330,easeOut(p))}}
  const p=clamp((t-29.6)/2.3);
  const ang=-Math.PI/2+p*Math.PI*2*1.15, r=lerp(330,0,easeIn(p)*.15+smooth(p)*.85);
  return {x:winS.x+Math.cos(ang)*r*1.15,y:winS.y+Math.sin(ang)*r*.8}
}

// ---------- 色 ----------
function mixHex(a,b,p){const A=a.match(/\w\w/g).map(h=>parseInt(h,16)),B=b.match(/\w\w/g).map(h=>parseInt(h,16));
  return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')+')'}

// ---------- 子どもの動き:4.5秒ごとに両親に「高い高い」されて、あいだはぴょんぴょん ----------
function kidPose(t){
  const T=(t-33.6);
  const ph=((T%4.5)+4.5)%4.5;
  const lift=ph<2.2?Math.sin(ph/2.2*Math.PI):0;              // 持ち上げ(0→1→0)
  const hop=(1-lift)*Math.abs(Math.sin(t*4.2))*2.2;
  const dy=-(lift*9+hop);
  const tilt=Math.sin(t*3)*.08*lift;
  const r=13*.27, hy=-(13-r);
  // 両手(上にあげる)の位置。家の単位・足元(−3,23)基準
  const sh={l:{x:-r*.8,y:hy+r*1.2},r:{x:r*.8,y:hy+r*1.2}};
  const al=-Math.PI*.72+Math.sin(t*5)*.12, ar=-Math.PI*.28-Math.sin(t*5)*.12;
  const lh={x:KIDX+sh.l.x+Math.cos(al)*r*1.5, y:23+dy+sh.l.y+Math.sin(al)*r*1.5};
  const rh={x:KIDX+sh.r.x+Math.cos(ar)*r*1.5, y:23+dy+sh.r.y+Math.sin(ar)*r*1.5};
  return {lift,dy,tilt,lh,rh,al,ar};
}
// ---------- 家族のキャラクター(家の単位。x:足元の中心, foot:足元y, h:身長) ----------
function drawPerson(x,foot,h,o,t,ph,pop,alpha){
  const kid=o.type==='kid';
  const bob=kid?kidPose(t).dy:Math.sin(t*2.8+ph)*.7;
  g.save();g.translate(x,foot);g.scale(pop,pop);g.translate(0,bob);if(kid)g.rotate(o.tilt||0);g.globalAlpha=alpha;
  const r=h*.27, hy=-(h-r);                      // 頭の半径・頭の中心y
  // 体
  g.fillStyle=o.cloth;g.beginPath();
  g.moveTo(-r*.95,0);g.lineTo(r*.95,0);g.lineTo(r*.8,hy+r*.7);g.quadraticCurveTo(0,hy+r*.3,-r*.8,hy+r*.7);g.closePath();g.fill();
  // 腕
  g.strokeStyle=o.cloth;g.lineWidth=r*.42;g.lineCap='round';
  const hand=(hx,hy2)=>{g.fillStyle='#F8D9B8';g.beginPath();g.arc(hx,hy2,r*.24,0,6.283);g.fill()};
  if(kid){const kp=kidPose(t);
    [[-1,kp.al],[1,kp.ar]].forEach(([sx,a])=>{const sxp=sx*r*.8,syp=hy+r*1.2;
      g.beginPath();g.moveTo(sxp,syp);g.lineTo(sxp+Math.cos(a)*r*1.5,syp+Math.sin(a)*r*1.5);g.stroke();
      hand(sxp+Math.cos(a)*r*1.5,syp+Math.sin(a)*r*1.5)});
  }else{
    const inner=o.type==='dad'?1:-1;                       // 子どもがいる側
    // 内側の手:子どもの手をつなぐ(相手の座標を自分の座標系へ)
    if(o.handTo){const tx=(o.handTo.x-x)/pop, ty=(o.handTo.y-foot)/pop-bob;
      g.beginPath();g.moveTo(inner*r*.8,hy+r*1.2);g.lineTo(tx,ty);g.stroke();hand(tx,ty)}
    // 外側の手:お母さんは手をふる、お父さんは下ろす
    const a=o.type==='mom'?(-Math.PI*.25-Math.sin(t*7+ph)*.35):(Math.PI*.65);
    const ox=-inner*r*.8, oy=hy+r*1.2;
    g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+Math.cos(a)*r*1.5,oy+Math.sin(a)*r*1.5);g.stroke();hand(ox+Math.cos(a)*r*1.5,oy+Math.sin(a)*r*1.5);
  }
  // 頭
  g.fillStyle='#F8D9B8';g.beginPath();g.arc(0,hy,r,0,6.283);g.fill();
  // 髪
  g.fillStyle=o.hair;g.beginPath();
  if(o.type==='mom'){g.arc(0,hy,r*1.04,Math.PI*1.02,Math.PI*1.98);g.closePath();g.fill();
    g.beginPath();g.arc(r*.75,hy-r*.85,r*.38,0,6.283);g.fill()}
  else if(kid){g.arc(0,hy,r*1.02,Math.PI*1.1,Math.PI*1.9);g.closePath();g.fill();
    g.beginPath();g.moveTo(-r*.1,hy-r);g.quadraticCurveTo(r*.15,hy-r*1.6,r*.45,hy-r*1.3);g.quadraticCurveTo(r*.2,hy-r*1.15,r*.1,hy-r*.95);g.fill()}
  else{g.arc(0,hy,r*1.02,Math.PI*1.05,Math.PI*1.95);g.closePath();g.fill()}
  // 目:ふだんは丸い目、ときどき「にこっ」と閉じる
  const giggle=((t*1+ph)%4.5)<1.1;
  g.strokeStyle='#2B1E1A';g.fillStyle='#2B1E1A';g.lineWidth=r*.13;
  [-1,1].forEach(sx=>{const ex=sx*r*.38,ey=hy-r*.1;
    if(giggle){g.beginPath();g.arc(ex,ey+r*.1,r*.2,Math.PI*1.05,Math.PI*1.95);g.stroke()}
    else{g.beginPath();g.arc(ex,ey,r*.11,0,6.283);g.fill()}});
  // ほっぺ・口
  g.fillStyle='rgba(235,120,110,.55)';[-1,1].forEach(sx=>{g.beginPath();g.arc(sx*r*.55,hy+r*.25,r*.17,0,6.283);g.fill()});
  g.strokeStyle='#B9502F';g.lineWidth=r*.12;g.beginPath();g.arc(0,hy+r*.25,r*.34,Math.PI*.15,Math.PI*.85);g.stroke();
  g.restore();
}

// ---------- 1フレーム描画 ----------
function draw(t){
  const cam=camAt(t);
  const dawn=smooth((t-44)/6);                  // 44→50 夜明け
  const litW=clamp((t-31.7)/0.7);              // 窓が灯る
  g.globalCompositeOperation='source-over';g.globalAlpha=1;

  // 背景
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,mixHex('#05081A','#2A2242',dawn));
  bg.addColorStop(.55,mixHex('#0A1630','#6B4658',dawn));
  bg.addColorStop(1,mixHex('#0F2A3F','#D9906C',dawn));
  g.fillStyle=bg;g.fillRect(0,0,W,H);

  // 星
  {const ap=smooth((t-.4)/3.5)*(1-dawn*.9);
   if(ap>0){g.fillStyle='#FFFBF4';for(const s of stars){
     g.globalAlpha=ap*s.a*(.7+.3*Math.sin(t*s.w+s.ph));
     g.beginPath();g.arc(s.x-(cam.x-CAM1.x)*.02,s.y-(cam.y-CAM1.y)*.02,s.r,0,6.283);g.fill()}}}

  // 島の輪郭(点線で自ら描かれる)
  {const prog=smooth((t-.8)/5.5), vis=clamp((2.6-cam.z)/1.6)*(1-smooth((t-43.5)/3));
   if(prog>0&&vis>0){g.save();g.translate(W/2,H/2);g.scale(cam.z,cam.z);g.translate(-cam.x,-cam.y);
     // 進行分の長さだけ線を引く(北端から時計回りに自ら描かれる)
     let left=prog*ISLAND_LEN;g.beginPath();g.moveTo(ISLAND[0][0],ISLAND[0][1]);
     for(let i=0;i<ISLAND.length&&left>0;i++){const a=ISLAND[i],b=ISLAND[(i+1)%ISLAND.length];
       const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
       if(len<=left){g.lineTo(b[0],b[1]);left-=len}else{const q=left/len;g.lineTo(lerp(a[0],b[0],q),lerp(a[1],b[1],q));left=0}}
     g.strokeStyle='#6FAEA4';g.lineWidth=1.6/cam.z;g.setLineDash([3/cam.z,5/cam.z]);g.lineCap='round';
     g.globalAlpha=.6*clamp(prog*4)*vis;g.stroke();g.setLineDash([]);
     // 島の内側をごく薄く(輪郭が閉じてから)
     if(prog>=1){g.beginPath();ISLAND.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
       g.globalAlpha=.10*smooth((t-6.3)/1.5)*vis;g.fillStyle='#6FAEA4';g.fill()}
     g.restore()}}

  // 家(ズームしたときだけ現れる)+ 家族
  {const ha=clamp((cam.z-2)/2.5);
   if(ha>0){g.save();g.translate(W/2,H/2);g.scale(cam.z,cam.z);g.translate(-cam.x,-cam.y);
     g.translate(HOUSE.x,HOUSE.y);g.scale(HS,HS);          // 以降は家の中心が原点・家の単位
     const out=smooth((t-33.6)/.9);                         // 家族が外に出てくる
     // 地面
     g.globalAlpha=ha;g.fillStyle=mixHex('#0B1522','#2B1E24',litW*.6);
     g.beginPath();g.ellipse(0,22,120,16,0,0,6.283);g.fill();
     // 本体
     g.fillStyle=mixHex('#111D2B','#4A3128',litW*.7);
     g.beginPath();g.rect(-24,-12,48,34);g.fill();
     // 屋根:沖縄の赤瓦(寄棟の低い勾配・漆喰の白い目地・軒丸瓦)
     g.fillStyle=mixHex('#1C1A26','#B9502F',litW*.85);
     g.beginPath();g.moveTo(-38,-12);g.lineTo(-16,-30);g.lineTo(16,-30);g.lineTo(38,-12);g.closePath();g.fill();
     g.save();g.beginPath();g.moveTo(-38,-12);g.lineTo(-16,-30);g.lineTo(16,-30);g.lineTo(38,-12);g.closePath();g.clip();
     g.strokeStyle='#FFFBF4';g.lineWidth=.55;g.globalAlpha=ha*(.14+.36*litW);
     for(let k=1;k<6;k++){const y=-30+k*3;g.beginPath();g.moveTo(-40,y);g.lineTo(40,y);g.stroke()}   // 瓦の段
     for(let k=-6;k<=6;k++){g.beginPath();g.moveTo(k*2.6,-30);g.lineTo(k*6,-12);g.stroke()}         // 丸瓦の筋
     g.restore();
     g.globalAlpha=ha;g.fillStyle=mixHex('#2A2530','#F1E9DC',litW*.9);
     g.beginPath();g.roundRect(-17,-31.4,34,2.6,1.3);g.fill();                                       // 漆喰の棟
     g.strokeStyle=mixHex('#2A2530','#F1E9DC',litW*.9);g.lineWidth=1.1;g.lineCap='round';
     g.beginPath();g.moveTo(-16,-30);g.lineTo(-38,-12);g.moveTo(16,-30);g.lineTo(38,-12);g.stroke();  // 隅棟の漆喰
     for(let x=-36;x<=36;x+=4){g.beginPath();g.arc(x,-11.6,1.35,0,6.283);g.fillStyle=mixHex('#2A2530','#F1E9DC',litW*.9);g.fill()} // 軒丸瓦
     // 戸(家族が出てくると開く)
     g.fillStyle=mixHex('#0B1522','#2E1D18',litW*.7);g.beginPath();g.rect(-5,4,10,18);g.fill();
     if(out>0){g.fillStyle='#FFE9A8';g.globalAlpha=ha*out*.9;g.beginPath();g.rect(-5,4,10,18);g.fill();g.globalAlpha=ha}
     // 窓
     g.fillStyle=mixHex('#0D1826','#FFE9A8',litW);g.beginPath();g.rect(8,-5,12,12);g.fill();
     g.strokeStyle=mixHex('#1E2B3A','#F2C14E',litW);g.lineWidth=1.2;g.strokeRect(8,-5,12,12);
     // 窓の中の家族の影(灯ってから、外に出るまで)
     {const a=litW*(1-out)*ha;if(a>0){g.globalAlpha=a*.85;g.fillStyle='#3A2A22';
       g.beginPath();g.arc(12+Math.sin(t*2.2)*.3,2.2,2.3,0,6.283);g.fill();
       g.beginPath();g.arc(16.6,3.6+Math.sin(t*3.1)*.3,1.7,0,6.283);g.fill();g.globalAlpha=ha}}
     // 家族(3人)。出てきたらずっと笑顔で、手をふったり、はねたりする
     g.restore();
     // 窓の光(画面座標のスプライト)
     if(litW>0){const ws=toS(WINDOW,cam);
       const pulse=1+.06*Math.sin(t*5);
       glow(ws.x,ws.y,(260+120*clamp((t-33)/6))*pulse,'#F5CE6E',(.55+.25*clamp((t-33)/6))*litW*ha);
       glow(ws.x,ws.y,120,'#FFFBF4',.7*litW*ha)}
     // 家族(3人)は光の上に描く。出てきたらずっと笑顔で、手をふったり、はねたりする
     if(out>0){g.save();g.translate(W/2,H/2);g.scale(cam.z,cam.z);g.translate(-cam.x,-cam.y);
       g.translate(HOUSE.x,HOUSE.y);g.scale(HS,HS);
       const pop=out<1?easeOut(out)*(1+.28*Math.sin(out*Math.PI)):1;
       const kid=kidPose(t);                                   // 子どもの動き(両親の手もこれに合わせる)
       drawPerson(KIDX-13,23, 21,{hair:'#3B2A22',cloth:'#6FAEA4',type:'dad',handTo:kid.lh}, t,0.0,pop,ha);
       drawPerson(KIDX+13,23, 19,{hair:'#4A2C24',cloth:'#D2694A',type:'mom',handTo:kid.rh}, t,1.3,pop,ha);
       drawPerson(KIDX,   23, 13,{hair:'#3B2A22',cloth:'#F2C14E',type:'kid',lift:kid.lift,tilt:kid.tilt}, t,2.1,pop,ha);
       g.restore()}}}

  // 波紋
  {g.globalCompositeOperation='lighter';
   [31.9,32.7,33.5].forEach(t0=>{const p=(t-t0)/2.2;if(p>0&&p<1){const ws=toS(WINDOW,cam);
     g.globalAlpha=.65*(1-p)*(1-p);g.strokeStyle='#F5CE6E';g.lineWidth=3;
     g.beginPath();g.arc(ws.x,ws.y,easeOut(p)*820,0,6.283);g.stroke()}})}

  // あかり(粒子)
  g.globalCompositeOperation='lighter';
  const sizeBase=lerp(20,34,clamp((cam.z-.8)/5.2));
  for(const l of lights){
    let pos=null,alpha=0,size=sizeBase,col=l.col;
    if(t>=l.rise){                                   // S5 虹へ
      const q=smoother((t-l.rise)/2.7);
      const absorbed=t>=l.absorbAt;
      const origin=absorbed?WINDOW:{x:l.x,y:l.y};
      const p1={x:origin.x+l.c1.dx,y:origin.y+l.c1.dy};
      const p2={x:l.target.x+l.c2.dx,y:l.target.y+l.c2.dy};
      pos=cubic(origin,p1,p2,l.target,q);
      const landed=t-l.arrive;
      alpha=.85;size=sizeBase*(q<1?1:1+1.6*Math.exp(-6*landed));
      if(landed>0){col=ARC_COL[l.arc];alpha=lerp(.95,.28,clamp(landed/1.2))}
      alpha*=1-smooth((t-49.3)/1.2);                  // 虹の線に溶ける
      if(l.type==='ext'&&!absorbed)alpha=0;
    }else if(l.near&&t>=l.st){                        // S4 家へ
      const p=smooth((t-l.st)/2.3);
      if(p>=1){pos=null}
      else{const o={x:l.x,y:l.y};const mid={x:(o.x+WINDOW.x)/2+(l.u-.5)*90,y:(o.y+WINDOW.y)/2+(l.v-.5)*90};
        pos=cubic(o,mid,mid,WINDOW,p);alpha=(l.type==='ext'?smooth(p/.25):1)*(1-easeIn(p)*.6);size=sizeBase*(1+.5*p)}
    }else if(l.type==='isl'&&t>=l.ig){                // 点灯して瞬く
      pos={x:l.x,y:l.y};const a=t-l.ig;
      const born=clamp(a/.9);const pop=1+1.8*Math.exp(-5*a);
      alpha=born*(.62+.38*Math.sin(t*l.w+l.ph));size=sizeBase*pop;
      alpha*=1-.35*dawn;
    }
    if(l.type==='ext'&&t<l.st)pos=null;
    if(pos){const s=toS(pos,cam);if(s.x>-60&&s.x<W+60&&s.y>-60&&s.y<H+60)glow(s.x,s.y,size,col,alpha)}
  }
  // 家に吸い込まれたあかりの余韻(S5で家から立ちのぼる源)
  if(t>=42&&t<50){const hs=toS(WINDOW,cam);glow(hs.x,hs.y,140,'#F5CE6E',.8*(1-smooth((t-47)/3)))}

  // 案内のあかり
  if(t>=27&&t<31.9){
    for(let k=14;k>=0;k--){const tt=t-k*.04;if(tt<27)continue;const p=guidePos(tt);
      glow(p.x,p.y,(k?26-k*1.2:48),'#F5CE6E',k?.35*(1-k/15):.95)}
    const p=guidePos(t);glow(p.x,p.y,110,'#FFFBF4',.35)}

  // 虹の線(粒子の到着に合わせ左から右へ)
  {const prog=clamp((t-45.3)/3.9);
   if(prog>0){g.lineCap='round';
     // 粒子の到着に少し遅れて、確かな線が左から右へ描かれる
     const lag=clamp((t-45.9)/3.9);
     g.globalCompositeOperation='source-over';
     for(let k=0;k<3;k++){const end=Math.PI+Math.min(1,lag*1.03)*Math.PI;
       g.strokeStyle=ARC_COL[k];g.lineWidth=ARC_STROKE;g.globalAlpha=smooth(lag/.15);
       g.beginPath();g.arc(ARC_C.x,ARC_C.y,ARC_R[k],Math.PI,end,false);g.stroke()}
     g.globalCompositeOperation='lighter';
     for(let k=0;k<3;k++){const end=Math.PI+Math.min(1,lag*1.03)*Math.PI;
       g.strokeStyle=ARC_COL[k];g.lineWidth=ARC_STROKE+30;g.globalAlpha=.07*smooth(lag/.3)*(1-dawn*.6);
       g.beginPath();g.arc(ARC_C.x,ARC_C.y,ARC_R[k],Math.PI,end,false);g.stroke()}}}

  // 夜明けの光(虹の中心から)
  if(dawn>0){g.globalCompositeOperation='lighter';
    const gr=g.createRadialGradient(ARC_C.x,ARC_C.y-20,0,ARC_C.x,ARC_C.y-20,900);
    gr.addColorStop(0,`rgba(255,236,190,${.5*dawn})`);gr.addColorStop(1,'rgba(255,236,190,0)');
    g.globalAlpha=1;g.fillStyle=gr;g.fillRect(0,0,W,H)}

  // ビネット
  g.globalCompositeOperation='source-over';
  {const vg=g.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);
   vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(0,0,0,${.42*(1-dawn*.8)})`);
   g.globalAlpha=1;g.fillStyle=vg;g.fillRect(0,0,W,H)}
  g.globalAlpha=1;
}

window.__seek = ms => draw(ms/1000);
window.__draw = draw;

// ブラウザで開いたときのプレビュー再生(?render=1 のときは動かさない)
if(!/render=1/.test(location.search)){
  document.getElementById('stage').classList.add('live');
  const t0=performance.now();
  (function loop(){const t=((performance.now()-t0)/1000)%window.FILM_DURATION;draw(t);requestAnimationFrame(loop)})();
}else{draw(0)}
})();
</script>
