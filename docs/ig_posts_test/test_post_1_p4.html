<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Post 1 - Page 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Meiryo', 'Noto Sans JP', sans-serif;
            width: 1080px;
            height: 1350px;
        }

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #FFFFFF;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title {
            color: #00335C;
            font-size: 48px;
            font-weight: bold;
            line-height: 1.2;
        }

        .table-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        table {
            width: 100%;
            max-width: 1000px;
            border-collapse: collapse;
            border: 1px solid #00335C;
        }

        thead tr {
            background-color: #F88800;
        }

        th {
            color: #FFFFFF;
            font-size: 26px;
            font-weight: bold;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid #00335C;
            height: 60px;
        }

        tbody tr:nth-child(odd) {
            background-color: #FFFFFF;
        }

        tbody tr:nth-child(even) {
            background-color: #F5F5F5;
        }

        td {
            color: #333333;
            font-size: 22px;
            font-weight: normal;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid #00335C;
            height: 50px;
            line-height: 1.5;
        }

        td:nth-child(2) {
            text-align: left;
        }

        .td-bold {
            font-weight: bold;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            color: #00335C;
            font-size: 20px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="header-title">補助率・対象条件・締切</div>
        </div>

        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>補助率</th>
                        <th>対象条件</th>
                        <th>締切</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="td-bold">最大3/4</td>
                        <td>中山間地域の農家・農業法人（経営改善計画申請者）</td>
                        <td class="td-bold">2026-12-01</td>
                    </tr>
                    <tr>
                        <td class="td-bold">最大2/3</td>
                        <td>小規模農家（従事者3名以下）</td>
                        <td class="td-bold">2027-03-31</td>
                    </tr>
                    <tr>
                        <td class="td-bold">最大3/4</td>
                        <td>農業法人・農業協同組合</td>
                        <td class="td-bold">2026-12-15</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer-note">
            詳細は公式ページで確認できます。<br>LINE無料相談で質問もOK!
        </div>
    </div>
</body>
</html>
