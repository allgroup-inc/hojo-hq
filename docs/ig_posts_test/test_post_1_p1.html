<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Post 1 - Page 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Meiryo', 'Noto Sans JP', sans-serif;
            width: 1080px;
            height: 1350px;
        }

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: #00335C;
            padding: 40px 40px;
        }

        .top-section {
            margin-top: 100px;
        }

        .subsidy-name {
            color: #FFFFFF;
            font-size: 40px;
            font-weight: normal;
            text-align: center;
            line-height: 1.2;
        }

        .middle-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .large-number {
            color: #F88800;
            font-size: 150px;
            font-weight: bold;
            text-align: center;
            line-height: 1.0;
        }

        .industry-label {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: normal;
            text-align: center;
        }

        .footer-section {
            margin-bottom: 40px;
            text-align: center;
        }

        .footer-text {
            color: #FFFFFF;
            font-size: 18px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="top-section">
            <div class="subsidy-name">中山間地域所得確保<br>推進事業</div>
        </div>

        <div class="middle-section">
            <div class="large-number">500万円</div>
            <div class="industry-label">農業向け</div>
        </div>

        <div class="footer-section">
            <div class="footer-text">沖縄企業のミカタ | 2026-09-28</div>
        </div>
    </div>
</body>
</html>
