# ブランド設定 — 自分のブランドに合わせて書き換えてください
brand_name: サンプル商店
audience: 30〜40代の子育て世帯
tone: 親しみやすく、でも誠実に。絵文字は1投稿2個まで
persona: 店主が自分の言葉で話している感じ
cta: プロフィールのリンクからどうぞ

# 使ってはいけない表現(景品表示法・薬機法対策にも。生成後にも自動チェックされます)
ng_words:
  - 日本一
  - 絶対
  - 必ず

# 毎回付ける固定ハッシュタグ
base_hashtags:
  - "#サンプル商店"

# 1回の実行で生成する投稿数の上限(API費用の暴走防止)
max_posts_per_run: 7
