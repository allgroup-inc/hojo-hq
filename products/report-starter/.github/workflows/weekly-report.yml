# 毎週月曜 07:00 JST(= 日曜 22:00 UTC)に週次レポートを自動生成してコミットする
name: weekly-report

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 費用を抑えたい場合は下のコメントを外す(所見の質は下がります)
          # ANTHROPIC_MODEL: claude-haiku-4-5
        run: python scripts/build_report.py

      - name: Commit & push report
        run: |
          git config user.name "report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "auto: weekly report $(date -u +%Y-%m-%d)"
          git push
