# 自動実行の設定
# - 1日2回(JST 06:00 / 18:00 = UTC 21:00 / 09:00)に収集→整形→検証→サイト生成
# - Actionsタブから手動実行(workflow_dispatch)も可能
name: pipeline

on:
  schedule:
    - cron: "0 21 * * *"   # JST 06:00
    - cron: "0 9 * * *"    # JST 18:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 1. Collect
        run: python scripts/collect.py

      - name: 2. Structure (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 費用を抑えたい場合は下のコメントを外す
          # ANTHROPIC_MODEL: claude-haiku-4-5
        run: python scripts/structure.py

      - name: 3. Validate
        run: python scripts/validate.py

      - name: 4. Build site
        run: python scripts/build_site.py

      - name: Commit & push updates
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "auto: update data & site ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
