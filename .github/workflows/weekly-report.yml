name: weekly-report

# 週次レポート(2026-07-30 小柳さん依頼)。
# 毎週月曜 8:00 JST に、サイト訪問・LINE導線・LINE友だち・IG・FBの数字を
# 小柳さんのLINEへ届ける。取得できない項目は「未接続/取得不可」と明記する。

on:
  schedule:
    # JST 月曜 8:00 = UTC 日曜 23:00
    - cron: "0 23 * * 0"
  push:
    branches: [main]  # 作業ブランチへのbot混入防止(resilient-agent-design監査 2026-08-07)
    paths:
      - "scripts/weekly_report.py"
      - ".github/workflows/weekly-report.yml"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 診断ファネル取得(キーが有れば)
        continue-on-error: true
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
        run: python scripts/fetch_hojo_funnel.py

      - name: 週次レポートを生成してLINEへ送信
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        # pushイベント(コード編集時)はdry-run=LINE送信なし・repo記録のみ。
        # 実弾のLINE配信は schedule(月曜8時) と workflow_dispatch(手動) のみ。
        # (2026-08-03: push毎に実配信され小柳さんへ重複LINEが10通飛んだ事故の再発防止)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/weekly_report.py --dry-run
          else
            python scripts/weekly_report.py
          fi

      - name: Commit report
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add reports/hojo-mikata
          [ -f data/hojo/funnel.json ] && git add data/hojo/funnel.json || true
          git diff --cached --quiet || git commit -m "auto: 沖縄企業のミカタ 週次レポート $(date '+%Y-%m-%d')"
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            echo "push retry $i"; sleep 5
            [ "$i" = "3" ] && { echo "::error::pushが3回とも失敗しました。データは保存されていません"; exit 1; }
          done
