name: Deploy PoC - Docker & Terraform

on:
  push:
    branches:
      - claude/sales-appointment-management-app-5fuo4y
    paths:
      - 'apps/kakehashi-apo-poc/**'
      - 'docker-compose.yml'
      - 'terraform/**'
      - '.github/workflows/deploy-poc.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: apps/kakehashi-apo-poc/backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: apps/kakehashi-apo-poc/backend
        run: npm run test

      - name: Build backend TypeScript
        working-directory: apps/kakehashi-apo-poc/backend
        run: npm run build

      - name: Run backend integration tests
        working-directory: apps/kakehashi-apo-poc/backend
        run: npm run test:integration
        env:
          NODE_ENV: test

      - name: Install frontend dependencies
        working-directory: apps/kakehashi-apo-poc/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/kakehashi-apo-poc/frontend
        run: npm run build
        env:
          CI: false

      - name: Run frontend tests
        working-directory: apps/kakehashi-apo-poc/frontend
        run: npm run test -- --coverage --watchAll=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: docker-compose build

  lint-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.0'

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform init -backend=false && terraform validate

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image for scanning
        run: docker-compose build backend
        continue-on-error: true

      - name: Run Trivy scan on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kakehashi-apo-backend:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [test, lint-terraform]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.lint-terraform.result }}" = "failure" ]; then
            echo "Build or lint failed"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Docker & Terraform deployment checks passed!\n\nTests: ✅\nLinting: ✅\nSecurity: ✅'
            })

  deploy-plan:
    runs-on: ubuntu-latest
    needs: [test, lint-terraform, security-scan]
    if: github.ref == 'refs/heads/claude/sales-appointment-management-app-5fuo4y'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file=terraform.tfvars.example -out=tfplan
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: terraform/tfplan
        if: always()

      - name: Post Terraform Plan to PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planFile = 'terraform/tfplan';
            if (fs.existsSync(planFile)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '📋 Terraform plan ready for review\n\nArtifact: tfplan'
              });
            }
        continue-on-error: true
