name: atokakunin-ci

# 後確認の判定ロジック(scripts/atokakunin_rules.py)のself-test。
# 出荷ゲート「evalなき自動化は出荷しない」(運用規程 1-3)の実装。
#
# このワークフローは何も書き込まない(読み取りと検証のみ)。
# 権限は最小(contents: read)、push retryも状態保存も持たない。

on:
  push:
    paths:
      - "scripts/atokakunin_rules.py"
      - "tests/golden_atokakunin.json"
      - ".github/workflows/atokakunin-ci.yml"
  pull_request:
    paths:
      - "scripts/atokakunin_rules.py"
      - "tests/golden_atokakunin.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: atokakunin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 判定ロジックのself-test(失敗すれば非ゼロで落ちる)
      - name: 後確認 判定ロジック self-test
        run: python scripts/atokakunin_rules.py --self-test

      # テストが「常に緑」になっていないことの確認(2026-08-17 FK-004の教訓)。
      # わざと壊して落ちなければ、そのテストは何も守っていない。
      - name: テスト自体が壊れていないかの確認(変異テスト)
        run: |
          set -e
          cp scripts/atokakunin_rules.py /tmp/orig.py
          python - <<'PY'
          import io
          p = "scripts/atokakunin_rules.py"
          s = io.open(p, encoding="utf-8").read()
          old = 'return "承認" if t in accept_words else "要確認"'
          assert old in s, "変異の適用先が見つかりません(実装が変わった可能性)"
          io.open(p, "w", encoding="utf-8").write(
              s.replace(old, 'return "承認" if any(w in t for w in accept_words) else "要確認"', 1))
          PY
          if python scripts/atokakunin_rules.py --self-test > /dev/null 2>&1; then
            cp /tmp/orig.py scripts/atokakunin_rules.py
            echo "::error::判定を部分一致に壊してもself-testが通りました。テストが何も守っていません"
            exit 1
          fi
          cp /tmp/orig.py scripts/atokakunin_rules.py
          python - <<'PY'
          import io
          p = "scripts/atokakunin_rules.py"
          s = io.open(p, encoding="utf-8").read()
          old = 'any(d in t for d in _HAS_DIGIT)'
          assert old in s, "変異の適用先が見つかりません(実装が変わった可能性)"
          io.open(p, "w", encoding="utf-8").write(s.replace(old, 'False', 1))
          PY
          if python scripts/atokakunin_rules.py --self-test > /dev/null 2>&1; then
            cp /tmp/orig.py scripts/atokakunin_rules.py
            echo "::error::承認語候補の数字フィルタを外してもself-testが通りました。PII混入を防げていません"
            exit 1
          fi
          cp /tmp/orig.py scripts/atokakunin_rules.py
          echo "変異テスト合格: 壊すと確かに落ちます"

      # 個人情報がゴールデンセットに混入していないかの確認
      - name: PII混入チェック
        run: |
          set -e
          if grep -nE "0[789]0[-]?[0-9]{4}[-]?[0-9]{4}" tests/golden_atokakunin.json; then
            echo "::error::ゴールデンセットに携帯番号らしき文字列があります。公開リポジトリに置けません"
            exit 1
          fi
          echo "PIIチェック合格"
