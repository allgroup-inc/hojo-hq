name: fukugiiro-weekly-report

on:
  schedule:
    # 毎週月曜 09:00 JST(= 日曜 00:00 UTC)。yui.md「週次レポートは毎週月曜」
    - cron: "0 0 * * 1"
  push:
    branches: [main]  # 作業ブランチへのbot混入防止(resilient-agent-design監査 2026-08-07)
    paths:
      - "scripts/weekly_report_fukugiiro.py"
      - "scripts/generate_ig_neta.py"
      - ".github/workflows/fukugiiro-weekly-report.yml"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: fukugiiro-weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # GA4優先(2026-08-24 Plausible契約終了。Secretsが無ければ従来どおりPlausible→未設定ならスキップ)
      - name: ファネル取得 GA4優先(キーが有れば)
        continue-on-error: true
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          if [ -n "$GA4_SA_JSON" ]; then pip install -q google-auth requests; fi
          python scripts/fetch_plausible_funnel.py

      - name: サイトのアクセス総量取得(訪問者数・PV / キーが有れば)
        continue-on-error: true
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
        run: python scripts/fetch_plausible_traffic.py

      # GA4版(2026-08-24 小柳さん決裁で切替。Secrets 2つが揃うまでは何もしない)
      - name: サイトのアクセス総量取得 GA4(Secretsが有れば)
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
        run: |
          if [ -n "$GA4_PROPERTY_ID" ] && [ -n "$GA4_SA_JSON" ]; then pip install -q google-auth requests; fi
          python scripts/fetch_ga4_traffic.py

      # もらいわすれ堂のLINE友だち数(読み取り専用。集計APIだけを呼び、送信はしない)。
      # トークン未登録でも失敗にせず「未接続」と記録する(2026-11-07 小柳さん承認)
      - name: もらいわすれ堂のLINE友だち数を記録(読み取りのみ)
        continue-on-error: true
        env:
          FUKUGIIRO_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.FUKUGIIRO_LINE_CHANNEL_ACCESS_TOKEN }}
        run: python scripts/record_moradou_line.py

      - name: 週次レポート生成(統括ユイさん)
        run: python scripts/weekly_report_fukugiiro.py

      - name: IG投稿画像の生成準備(pillow+フォント)
        continue-on-error: true
        run: |
          pip install pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/ShipporiMincho-SemiBold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/shipporimincho/ShipporiMincho-SemiBold.ttf || true

      - name: 遥さんボード生成(今週のIG投稿案・完成画像つき)
        # 照合済みの制度から今週の5案を作り直す → 画像5枚 → site/staff/haruka/
        # 2026-09-24: ig_neta.json は生成元が無い手置きファイルで、9月8日の内容が
        # 16日間そのままだった。未照合の締切が使い回され遥さんの指摘で発覚したため、
        # 毎週ここで作り直す。裏づけの検査に落ちたら止める(古い案は残る)。
        # main への push(このファイルや週次レポートの修正の統合)では作り直さない。
        # 統合のたびに今週の投稿案・ボード・公開ページのサムネイルが入れ替わるのを防ぐ
        # (2026-11-04 に PR の統合で投稿案が作り直された実例あり)。定時と手動実行では従来どおり
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python scripts/generate_ig_neta.py
          python scripts/check_ig_neta.py
          python scripts/generate_ig_images_fukugiiro.py || true
          python scripts/generate_haruka_board.py
          # LPのIG投稿プレビュー(軽量サムネ)を今週の投稿画像から再生成(2026-08-26 IG導線強化)
          python scripts/generate_ig_thumbs.py || true

      - name: Commit report
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add reports/fukugiiro
          [ -f data/fukugiiro/funnel.json ] && git add data/fukugiiro/funnel.json || true
          [ -f data/kpi/site_traffic.json ] && git add data/kpi/site_traffic.json || true
          [ -f data/kpi/moradou_line_followers.json ] && git add data/kpi/moradou_line_followers.json || true
          [ -f site/staff/haruka/index.html ] && git add site/staff/haruka || true
          # 生成ステップとaddリストは必ず対で更新する(CLAUDE.md 再発防止メモ)
          [ -f data/fukugiiro/ig_neta.json ] && git add data/fukugiiro/ig_neta.json || true
          [ -d site/fukugiiro/assets/ig ] && git add site/fukugiiro/assets/ig || true
          git diff --cached --quiet || git commit -m "auto: もらいわすれ堂 週次レポート $(date '+%Y-%m-%d')"
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i"; sleep 5
          done

      - name: 遥さんへのLINE通知の文面(表示のみ・送信しない)
        # 定期実行からは送らない(2026-11-07 小柳さん承認・3段階ルール「外部送信は事前承認」)。
        # トークンも宛先IDも渡さないので、この手順からは送信できない。文面と承認コードを表示するだけ。
        # 送る場合は、宛先・内容を明示した個別の承認を受けてから、別の手順で行う。ミカタOAは使わない。
        continue-on-error: true
        run: python scripts/notify_haruka.py
