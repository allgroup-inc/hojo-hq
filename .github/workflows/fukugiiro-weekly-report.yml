name: fukugiiro-weekly-report

on:
  schedule:
    # 毎週月曜 09:00 JST(= 日曜 00:00 UTC)。yui.md「週次レポートは毎週月曜」
    - cron: "0 0 * * 1"
  push:
    branches: [main]  # 作業ブランチへのbot混入防止(resilient-agent-design監査 2026-08-07)
    paths:
      - "scripts/weekly_report_fukugiiro.py"
      - ".github/workflows/fukugiiro-weekly-report.yml"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: fukugiiro-weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Plausibleファネル取得(キーが有れば)
        continue-on-error: true
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
        run: python scripts/fetch_plausible_funnel.py

      - name: サイトのアクセス総量取得(訪問者数・PV / キーが有れば)
        continue-on-error: true
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
        run: python scripts/fetch_plausible_traffic.py

      - name: 週次レポート生成(統括ユイさん)
        run: python scripts/weekly_report_fukugiiro.py

      - name: 遥さんボード生成(今週のIG投稿案)
        # data/fukugiiro/ig_neta.json(拡充ループが更新)→ site/staff/haruka/(robots除外の内部ページ)
        continue-on-error: true
        run: python scripts/generate_haruka_board.py

      - name: Commit report
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add reports/fukugiiro
          [ -f data/fukugiiro/funnel.json ] && git add data/fukugiiro/funnel.json || true
          [ -f data/kpi/site_traffic.json ] && git add data/kpi/site_traffic.json || true
          [ -f site/staff/haruka/index.html ] && git add site/staff/haruka || true
          git diff --cached --quiet || git commit -m "auto: もらいわすれ堂 週次レポート $(date '+%Y-%m-%d')"
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i"; sleep 5
            [ "$i" = "3" ] && { echo "::error::pushが3回とも失敗しました。データは保存されていません"; exit 1; }
          done

      - name: 遥さんへLINE通知(投稿案が届いた合図)
        # もらいわすれ堂OAの直送Secretsがある場合のみ送信。ミカタOAは使わない
        # (2026-08-11 小柳さん指摘: フクギイロとGLOWは別会社・別ブランドのため)。
        continue-on-error: true
        env:
          FUKUGIIRO_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.FUKUGIIRO_LINE_CHANNEL_ACCESS_TOKEN }}
          HARUKA_LINE_USER_ID: ${{ secrets.HARUKA_LINE_USER_ID }}
        run: python scripts/notify_haruka.py
