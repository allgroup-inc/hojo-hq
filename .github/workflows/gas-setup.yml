name: gas-setup

# GASボットのスクリプトプロパティを、Secretsの値をチャットに出さずに遠隔設定する。
# v1.4(相談一次受付)の ADMIN_USER_ID 設定に使用(2026-08-04 相談転換③)。
# 実行タイミング: 小柳さんがv1.4を貼り替えた後に、技術部が手動で1回起動する。

on:
  workflow_dispatch: {}

jobs:
  set-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Set ADMIN_USER_ID on GAS
        env:
          GAS_LEDGER_ENDPOINT: ${{ secrets.GAS_LEDGER_ENDPOINT }}
          GAS_LEDGER_TOKEN: ${{ secrets.GAS_LEDGER_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          if [ -z "$GAS_LEDGER_ENDPOINT" ] || [ -z "$GAS_LEDGER_TOKEN" ] || [ -z "$LINE_ADMIN_USER_ID" ]; then
            echo "必要なSecretsが未設定です"; exit 1
          fi
          res=$(curl -sL -X POST "$GAS_LEDGER_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d "{\"diag\":\"setprop\",\"token\":\"$GAS_LEDGER_TOKEN\",\"key\":\"ADMIN_USER_ID\",\"value\":\"$LINE_ADMIN_USER_ID\"}")
          echo "response: $res"
          echo "$res" | grep -q '"ok":true' || { echo "設定失敗(v1.4が未デプロイの可能性)"; exit 1; }
