name: gas-setup

# GASボットのスクリプトプロパティを、Secretsの値をチャットに出さずに遠隔設定する。
# v1.4(相談一次受付)の ADMIN_USER_ID 設定に使用(2026-08-04 相談転換③)。
# 実行タイミング: 小柳さんがv1.4を貼り替えた後に、技術部が手動で1回起動する。

on:
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: gas-setup
  cancel-in-progress: false

jobs:
  set-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Set ADMIN_USER_ID on GAS
        # curlはGASの302リダイレクトでPOSTが化けるため、healthcheckと同じurllib方式を使う
        env:
          GAS_LEDGER_ENDPOINT: ${{ secrets.GAS_LEDGER_ENDPOINT }}
          GAS_LEDGER_TOKEN: ${{ secrets.GAS_LEDGER_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request
          ep = os.environ.get("GAS_LEDGER_ENDPOINT", "")
          tk = os.environ.get("GAS_LEDGER_TOKEN", "")
          ad = os.environ.get("LINE_ADMIN_USER_ID", "")
          if not (ep and tk and ad):
              sys.exit("必要なSecretsが未設定です")
          payload = json.dumps({"diag": "setprop", "token": tk,
                                "key": "ADMIN_USER_ID", "value": ad}).encode("utf-8")
          req = urllib.request.Request(ep, data=payload, method="POST",
                                       headers={"Content-Type": "application/json"})
          body = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
          print("response:", body[:200])
          if '"ok":true' not in body.replace(" ", ""):
              sys.exit("設定失敗(v1.4が未デプロイの可能性)")
          print("ADMIN_USER_ID 設定完了")
          EOF
