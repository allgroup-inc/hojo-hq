name: ig-story

# ミカタ公式Instagramへ「ストーリーズ投稿」を行うユーティリティ(手動実行専用)。
# 2026-11-03 GLOW Instagram 安全対策(M8・M1)で、承認を必ず通る形に作り直した:
#   1) preview: 承認対象(画像の指紋・コミットに固定した画像URL・本文なし・期限)を作り、LINEへ送る。
#      このジョブには Meta の鍵を渡さない(LINE の鍵だけ)
#   2) post: GitHub の承認(environment: sns-approval)が下りた時だけ動く。
#      同じコミットで承認対象を作り直して照らし合わせ、画像を固定URLから取り直して確かめてから投稿する
# 鍵を含む処理では set -x を使わない(scripts/check_workflow_secret_hygiene.py が検査する)。

on:
  workflow_dispatch:
    inputs:
      image:
        description: "投稿する画像のリポジトリ内パス(1080x1920推奨)"
        required: true
        default: "posts/tv/tv_shutsuen_story.png"

permissions:
  contents: read

concurrency:
  group: ig-story
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.pkg.outputs.pkg_digest }}
      created: ${{ steps.pkg.outputs.pkg_created }}
      image: ${{ steps.pkg.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 承認対象を作る(投稿はしない)
        id: pkg
        env:
          IMG_PATH: ${{ inputs.image }}
        run: |
          python scripts/ig_manual_post.py --kind story --image "$IMG_PATH" --preview \
            --preview-file "$RUNNER_TEMP/preview.txt" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/preview.txt"
          {
            d="EOF_$(python3 -c 'import secrets;print(secrets.token_hex(16))')"
            echo "text<<$d"
            cat "$RUNNER_TEMP/preview.txt"
            echo "$d"
          } >> "$GITHUB_OUTPUT"

      - name: LINEで見本を送る(小柳さんへ)
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.LINE_ADMIN_USER_ID }}
          message: |
            🖼【ミカタ】手動のストーリーズ投稿の確認
            ${{ steps.pkg.outputs.text }}
            画像: ${{ steps.pkg.outputs.image }}
            投稿してよければ、次の画面で承認してください:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            見送るなら何もしなくてOK。投稿されません。

  post:
    needs: preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 承認(Required reviewers)が下りるまでここで待機する。Meta の鍵はこのジョブにだけ渡す
    environment: sns-approval
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 照らし合わせてから投稿
        env:
          IMG_PATH: ${{ inputs.image }}
          DIGEST: ${{ needs.preview.outputs.digest }}
          CREATED: ${{ needs.preview.outputs.created }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SNS_DEST_FP_MIKATA: ${{ vars.SNS_DEST_FP_MIKATA }}
        run: |
          python scripts/ig_manual_post.py --kind story --image "$IMG_PATH" --post \
            --approved-digest "$DIGEST" --approved-created "$CREATED"

      - name: LINE通知(失敗時)
        if: failure()
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.LINE_ADMIN_USER_ID }}
          message: |
            🚨【ミカタ】手動のストーリーズ投稿が止まりました(投稿していません)
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
