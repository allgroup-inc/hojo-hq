name: workflow-secret-hygiene

# ワークフローの鍵の扱いの検査(2026-11-03 GLOW Instagram 安全対策・鍵漏えい防止)。
# set -x などの実行の書き出し・run への secrets の直書き・承認を通らない Meta への投稿を止める。
# 一致した値は出力しない(規則・ファイル・ジョブ名・行番号のみ)。secrets は使わない。
# PyYAML は GitHub の Ubuntu ランナーのシステムの Python に入っているものを使う
# (無ければ検査できないとして失敗する=黙って通さない)。

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_secret_hygiene.py"
      - "scripts/sns_safety.py"
      - "scripts/post_social.py"
      - "scripts/ig_manual_post.py"
      - "scripts/generate_sns.py"
      - "scripts/weekly_report.py"
      - "scripts/funnel_deep_dive.py"
      - "scripts/shipping_gate.py"
      - "tests/scripts/test_sns_ig_safety.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_secret_hygiene.py"
      - "scripts/sns_safety.py"
      - "scripts/post_social.py"
      - "scripts/ig_manual_post.py"
      - "scripts/generate_sns.py"
      - "scripts/weekly_report.py"
      - "scripts/funnel_deep_dive.py"
      - "scripts/shipping_gate.py"
      - "tests/scripts/test_sns_ig_safety.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 自己テスト(正例・負例)
        run: /usr/bin/python3 scripts/check_workflow_secret_hygiene.py --selftest
      - name: 検査
        run: /usr/bin/python3 scripts/check_workflow_secret_hygiene.py

  # SNS投稿の安全対策のテスト(合成データのみ。Meta への通信・secrets は使わない)。
  # 飛ばされたテストがあっても成功にしない(件数0・スキップありは失敗)。
  sns-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pytest を入れる
        run: pip install pytest pyyaml
      - name: テスト
        run: python -m pytest tests/scripts/test_sns_ig_safety.py -v -p no:cacheprovider --junitxml="$RUNNER_TEMP/sns.xml"
      - name: 件数の確認(0件・スキップ・失敗があれば失敗)
        run: |
          python3 - "$RUNNER_TEMP/sns.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          n, sk, f, e = (int(s.get(k, 0)) for k in ("tests", "skipped", "failures", "errors"))
          print(f"実行 {n} 件 / スキップ {sk} / 失敗 {f} / エラー {e}")
          sys.exit(0 if n > 0 and sk == 0 and f == 0 and e == 0 else 1)
          PY
