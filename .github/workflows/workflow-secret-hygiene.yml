name: workflow-secret-hygiene

# ワークフローの鍵の扱いの検査(2026-11-03 GLOW Instagram 安全対策・鍵漏えい防止)。
# set -x などの実行の書き出し・run への secrets の直書き・承認を通らない Meta への投稿を止める。
# 一致した値は出力しない(規則・ファイル・ジョブ名・行番号のみ)。secrets は使わない。
# PyYAML は GitHub の Ubuntu ランナーのシステムの Python に入っているものを使う
# (無ければ検査できないとして失敗する=黙って通さない)。

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_secret_hygiene.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_secret_hygiene.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 自己テスト(正例・負例)
        run: /usr/bin/python3 scripts/check_workflow_secret_hygiene.py --selftest
      - name: 検査
        run: /usr/bin/python3 scripts/check_workflow_secret_hygiene.py
