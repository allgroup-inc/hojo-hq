name: Diagnose Daily Sync Health

on:
  schedule:
    - cron: '30 7 * * *'   # 毎日 7:30 UTC (16:30 JST) — 最初の sync (6:00 UTC) の30分後にチェック
    - cron: '30 13 * * *'  # 毎日 13:30 UTC (22:30 JST) — 2番目の sync (12:00 UTC) の30分後にチェック
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check generated files existence & freshness
        id: file_check
        run: |
          echo "=== Diagnosis Page Health Check ==="

          HEALTH_STATUS="HEALTHY"
          ISSUES_FOUND=""

          # 必須ファイルのチェック
          FILES_TO_CHECK=(
            "site/fukugiiro/index.html"
            "site/fukugiiro/shindan/index.html"
            "site/fukugiiro/area"
            "site/fukugiiro/kit"
            "site/fukugiiro/life"
          )

          for file in "${FILES_TO_CHECK[@]}"; do
            if [ ! -e "$file" ]; then
              echo "❌ MISSING: $file"
              HEALTH_STATUS="UNHEALTHY"
              ISSUES_FOUND="${ISSUES_FOUND}❌ Missing: $file\n"
            else
              if [ -f "$file" ]; then
                SIZE=$(wc -c < "$file")
                MODIFIED=$(stat -c %y "$file" | cut -d' ' -f1,2)
                echo "✅ File: $file (${SIZE} bytes, modified: $MODIFIED)"
              elif [ -d "$file" ]; then
                COUNT=$(find "$file" -name "index.html" 2>/dev/null | wc -l)
                echo "✅ Dir: $file (contains $COUNT index.html files)"
              fi
            fi
          done

          # ブランチと main の差分をチェック
          git fetch origin main > /dev/null 2>&1
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          COMMITS_BEHIND=$(git rev-list --count HEAD..origin/main 2>/dev/null || echo "0")

          if [ "$COMMITS_BEHIND" -gt 3 ]; then
            echo "⚠️  WARNING: Branch is $COMMITS_BEHIND commits behind main"
            HEALTH_STATUS="DEGRADED"
            ISSUES_FOUND="${ISSUES_FOUND}⚠️  Branch is $COMMITS_BEHIND commits behind main\n"
          else
            echo "✅ Branch is up-to-date or only $COMMITS_BEHIND commits behind"
          fi

          # 最後の sync ワークフロー実行を確認
          LAST_SYNC_TIME=$(git log --oneline --all -1 --grep="Branch synced\|synced with main" 2>/dev/null || git log --oneline -1)
          echo "Last sync-related commit: $LAST_SYNC_TIME"

          echo "health_status=$HEALTH_STATUS" >> $GITHUB_OUTPUT
          echo "commits_behind=$COMMITS_BEHIND" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "issues_found=$ISSUES_FOUND" >> $GITHUB_OUTPUT

      - name: Create issue if health check fails
        if: steps.file_check.outputs.health_status != 'HEALTHY'
        uses: actions/github-script@v7
        with:
          script: |
            const healthStatus = '${{ steps.file_check.outputs.health_status }}';
            const commitsBehind = '${{ steps.file_check.outputs.commits_behind }}';
            const branch = '${{ steps.file_check.outputs.branch }}';
            const issuesFound = '${{ steps.file_check.outputs.issues_found }}';

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Health Check Failed: ' + healthStatus + ' - ' + branch,
              body: 'Health Status: ' + healthStatus + '\nBranch: ' + branch + '\nCommits Behind: ' + commitsBehind + '\n\nIssues:\n' + issuesFound + '\n\nCheck workflow logs and verify files exist in site/fukugiiro/.',
              labels: ['diagnosis-page', 'health-check', 'automated']
            });

            console.log('Created health check issue #' + issue.data.number);

      - name: Summary
        run: |
          echo "## Health Check Summary"
          echo "- Status: ${{ steps.file_check.outputs.health_status }}"
          echo "- Branch: ${{ steps.file_check.outputs.branch }}"
          echo "- Commits Behind: ${{ steps.file_check.outputs.commits_behind }}"
