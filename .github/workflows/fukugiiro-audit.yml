name: fukugiiro-audit

on:
  push:
    branches: [main]  # 作業ブランチへのbot混入防止(resilient-agent-design監査 2026-08-07)
    paths:
      - "scripts/audit_sources_fukugiiro.py"
      - "scripts/audit_terms_fukugiiro.py"
      - ".github/workflows/fukugiiro-audit.yml"
  schedule:
    # 週次(月曜 06:00 JST = 日曜 21:00 UTC)— 収集対象ソースのrobots方針変更を検知
    - cron: "0 21 * * 0"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: fukugiiro-audit
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: robots.txt 自動監査(マモリさんの事実確認)
        run: python scripts/audit_sources_fukugiiro.py

      - name: 利用規約 自動監査(規約本文の抜粋収集)
        run: python scripts/audit_terms_fukugiiro.py

      - name: Commit audit reports
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add docs/フクギイロ_robots監査結果.md docs/フクギイロ_利用規約監査結果.md data/fukugiiro
          git diff --cached --quiet || git commit -m "auto: fukugiiro source audit $(date '+%Y-%m-%d %H:%M')"
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i"; sleep 5
            [ "$i" = "3" ] && { echo "::error::pushが3回とも失敗しました。データは保存されていません"; exit 1; }
          done

      # ── 失敗時: 黙って止まらないようIssueを起票(resilient-agent-design ⑦ 静かな脱落の防止)
      #    2026-08-17点検で追加。この3本だけ失敗通知が無く、止まっても誰も気づかない状態だった。
      - name: Open or update issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh label create automation-failure --color B60205 \
            --description "定期実行ワークフローの失敗(自動起票)" 2>/dev/null || true
          title="⚠️ fukugiiro-audit が失敗しました"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "定期実行ワークフロー \`fukugiiro-audit\` が失敗しました。"
            echo ""
            echo "**止まると何が起きるか**: フクギイロ側の収集対象のrobots.txt・利用規約の再監査が止まる(同 絶対ルール2)"
            echo ""
            echo "- 実行ログ: $run_url"
            echo "- 日時(UTC): $(date -u '+%Y-%m-%d %H:%M')"
          } > issue_body.md
          existing=$(gh issue list --state open --label automation-failure \
            --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue_body.md
          else
            gh issue create --label automation-failure --title "$title" --body-file issue_body.md
          fi
