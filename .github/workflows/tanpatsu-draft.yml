name: tanpatsu-draft

# 多ジャンル単発記事(実例研究シリーズ)の自動下書き(docs/note収益化_運営計画v3_月30万.md)。
# 毎月8日・22日 09:35 JST にお題キュー(data/tanpatsu_topics.json)から1本生成してコミットし、
# たかしくん・小柳さんへLINE通知する。noteへの「公開」は人間がコピペで行う
# (noteに投稿公式APIがなく、非公式手段は絶対ルール2により使わない)。

on:
  schedule:
    # JST 8日・22日 09:35(= UTC 0:35)
    - cron: "35 0 8,22 * *"
    # リトライ枠 10:35 JST(GitHubのcronは混雑時に飛ぶことがある。2026-08-08に9:35分が
    # 発火せず初回通知が届かなかった実績あり。同日重複ガードがあるため二重生成はしない)
    - cron: "35 1 8,22 * *"
  workflow_dispatch:
    inputs:
      topic_id:
        description: "お題ID(省略時はキュー先頭のpending)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tanpatsu-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install anthropic pillow
          sudo apt-get install -y -q fonts-ipafont-gothic > /dev/null || true

      # 同日重複ガード: スケジュール実行(本枠+リトライ枠)では、今日すでに生成済みなら
      # 何もしない(べき等性。手動実行 workflow_dispatch は常に生成する)
      - name: 同日重複ガード
        id: guard
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          if python3 -c "import json,sys; d=json.load(open('data/tanpatsu_topics.json')); sys.exit(0 if any(t.get('drafted_at')=='$today' for t in d.get('queue',[])) else 1)"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "本日分($today)は生成済みのためスキップします(リトライ枠の空振り)"
          fi

      - name: Generate tanpatsu draft
        if: steps.guard.outputs.skip != '1'
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic_id }}" ]; then
            python scripts/generate_tanpatsu_draft.py --preview --id "${{ github.event.inputs.topic_id }}" >> "$GITHUB_OUTPUT"
          else
            python scripts/generate_tanpatsu_draft.py --preview >> "$GITHUB_OUTPUT"
          fi

      - name: Commit draft & topic queue
        if: steps.gen.outputs.stem != ''
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add posts/note data/tanpatsu_topics.json assets/kekka
          git diff --cached --quiet || git commit -m "auto: 単発記事(実例研究)下書き ${{ steps.gen.outputs.stem }}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push retry $i"; sleep 5
            [ "$i" = "3" ] && { echo "::error::pushが3回とも失敗しました。データは保存されていません"; exit 1; }
          done

      - name: LINE通知(下書き完成)
        if: steps.gen.outputs.stem != ''
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.KEKKA_LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.KEKKA_LINE_ADMIN_USER_ID }}
          message: |
            📝【結果マガ】記事の下書きができました

            ${{ steps.gen.outputs.title }}

            ━━━ 公開手順(約10分) ━━━
            ①元記事で内容と出典を一読(出典URLを2件開いて確認)
            https://github.com/${{ github.repository }}/blob/main/posts/note/tanpatsu/${{ steps.gen.outputs.stem }}.md
            ②貼るだけ版を開き「Raw」→全文コピー
            https://github.com/${{ github.repository }}/blob/main/posts/note/paste/${{ steps.gen.outputs.topic_id }}_hariduke_you.md
            ③noteの新規記事へ Ctrl+Shift+V で貼り付け(タイトルは上の1行目)
            ④見出し画像を設定: 下のURLを開き画像を保存→エディタ上部の「見出し画像を設定」へ
            https://github.com/${{ github.repository }}/raw/main/assets/kekka/eyecatch_${{ steps.gen.outputs.topic_id }}.png
            ⑤有料 ${{ steps.gen.outputs.price }}円/有料ラインは見出し「${{ steps.gen.outputs.paywall }}」の直前/マガジンに追加→公開
            ⑥公開したらActionsの「publish-record」に ID=${{ steps.gen.outputs.topic_id }} と公開URLを入力して実行
            → X告知と記録は自動で完了します

            気になる点があれば公開せず、そのままご相談ください。

      - name: LINE通知(お題切れ・スキップ)
        if: steps.gen.outputs.skipped != ''
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.KEKKA_LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.KEKKA_LINE_ADMIN_USER_ID }}
          message: |
            ℹ️【結果マガ】記事の自動下書きはお休みしました(理由: ${{ steps.gen.outputs.skipped }})
            お題キュー: data/tanpatsu_topics.json(リサーチ済みお題の補充が必要です)

      - name: LINE通知(失敗時)
        if: failure()
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.KEKKA_LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.KEKKA_LINE_ADMIN_USER_ID }}
          message: |
            🚨【結果マガ】記事の自動下書きが失敗しました
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
