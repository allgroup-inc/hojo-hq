name: repo-scope

# 公開リポジトリに家計の見直しやさん(enLife)のシステムが混入していないか検査する。
# 経緯: docs/移設済み_アポ管理と営業指名_2026-08-22.md
#
# 2026-10-08 決裁 #26 S2(PR-A1): 2 ジョブに分割。
# - repo-scope-check: 置き場所の検査(Baseline Debt 9 件 = #22 が是正されるまで赤のまま。必須 check にしない)
# - repo-scope-guard: Experience 公開可否・Wiki・議事の検査 + Baseline 比較(新しい赤が増えたら REGRESSION で失敗)
#   → 常に走って常に緑であるべきジョブ。S7a の branch ruleset で必須 check にする候補。
# 名前(name:)は check-run 名として一意にする(他 workflow の `check` と区別するため)。

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: repo-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: repo-scope-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 検査ロジックの自己点検
        run: python3 scripts/check_repo_scope.py --selftest

      # 既知の赤(Baseline Debt 9 件・docs/wikiskill/baseline-debt.json)。是正は #22。
      # 新しい違反は repo-scope-guard の「Baseline 比較」で止める。
      - name: 置き場所の検査
        run: python3 scripts/check_repo_scope.py

  guard:
    name: repo-scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Baseline 比較は skill_validation と固定 2 本の scripts テストを pytest で走らせる
      - name: pytest を入れる
        run: pip install pytest

      # 各検査は独立に赤にする(先行が赤でも後続を必ず走らせ、検査の素通りを防ぐ)
      - name: Experience記録の公開可否 自己点検
        if: ${{ !cancelled() }}
        run: python3 scripts/check_experience_privacy.py --selftest

      - name: Experience記録の公開可否
        if: ${{ !cancelled() }}
        run: python3 scripts/check_experience_privacy.py

      # Knowledge Wiki(docs/wiki/)の候補・正式の検査。根拠の解決・逐語引用・公開可否・置き場所(WikiSkill Phase 2)
      - name: Wiki(候補・正式)の自己点検
        if: ${{ !cancelled() }}
        run: python3 scripts/wiki_validate.py --selftest
      - name: Wiki(候補・正式)の検査
        if: ${{ !cancelled() }}
        run: python3 scripts/wiki_validate.py

      # frontmatter の無い既存の議事は対象外として通る。日本語・空白を含むパスを壊さないよう -z と quotePath=false で渡す
      - name: 議事(Decision)の必須項目検査
        if: ${{ !cancelled() }}
        run: git -c core.quotePath=false ls-files -z 'docs/議事_*.md' 'docs/議事/*.md' | xargs -0 python3 scripts/decision_memory.py --check

      # 置き場所・skill_validation・固定 scripts テストの「既知の赤」が増えていないこと(SAME / IMPROVED)。
      # 1 件でも新しい赤があれば REGRESSION で exit 1 = このジョブが赤になる(repo-scope-check の赤に埋もれない)。
      - name: Baseline 比較(新しい赤を増やさない)
        if: ${{ !cancelled() }}
        run: python3 scripts/baseline_debt.py --compare

      # 決裁 #26 S2 PR-B: wiki-guard。正式な Wiki(docs/wiki/*.md 直下)を変える PR の作者が Claude 用アカウント
      # (repository variable HOJO_CLAUDE_LOGIN)なら赤にする。S7b(アカウント分離)で小柳さんが variable を登録するまで
      # は休眠: ①この `if:` で step ごと skipped ②本文の先頭でも空なら exit 0 ③scripts/wiki_guard.py も login 空なら違反なし。
      # pull_request イベントだけ(push・dispatch では走らない)。ruleset・必須 check・CODEOWNERS・variable は触らない。
      # 変更ファイルはページネーションで全件取り、PR の changed_files 件数と一致しなければ検査不完全として失敗(fail-closed)。
      - name: wiki-guard(正式 Wiki を変える PR の作者が Claude 用アカウントなら赤。S7b まで休眠)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && vars.HOJO_CLAUDE_LOGIN != '' }}
        env:
          CLAUDE_LOGIN: ${{ vars.HOJO_CLAUDE_LOGIN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if [ -z "$CLAUDE_LOGIN" ]; then
            echo "休眠: HOJO_CLAUDE_LOGIN が未登録のため wiki-guard は検査しません"
            exit 0
          fi
          python3 scripts/wiki_guard.py --selftest
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed.txt; then
            echo "::error::wiki-guard: PR #$PR_NUMBER の変更ファイル一覧を取得できません(検査不完全のため失敗)"
            exit 1
          fi
          got=$(wc -l < changed.txt)
          case "$PR_CHANGED_FILES" in ''|*[!0-9]*)
            echo "::error::wiki-guard: PR の changed_files が取れません('$PR_CHANGED_FILES')。検査不完全のため失敗"; exit 1 ;;
          esac
          if [ "$got" -ne "$PR_CHANGED_FILES" ]; then
            echo "::error::wiki-guard: 変更ファイル $PR_CHANGED_FILES 件のうち $got 件しか取得できません(検査不完全のため失敗)"
            exit 1
          fi
          rc=0
          python3 scripts/wiki_guard.py --files-from changed.txt --author "$PR_AUTHOR" --claude-login "$CLAUDE_LOGIN" > hits.txt || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::wiki-guard: 正式 Wiki(docs/wiki/*.md)を変える PR の作者が Claude 用アカウントです: $(tr '\n' ' ' < hits.txt)"
            {
              echo "## ❌ wiki-guard: 正式 Wiki の変更は小柳さんのアカウントで PR を開いてください(docs/wikiskill/Wiki昇格手順.md)"
              sed 's/^/- /' hits.txt
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::wiki-guard: 判定に失敗(exit $rc)"
            exit "$rc"
          fi
          echo "wiki-guard: 違反なし($got ファイルを検査・作者 $PR_AUTHOR)"
