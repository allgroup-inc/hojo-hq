name: repo-scope

# 公開リポジトリに家計の見直しやさん(enLife)のシステムが混入していないか検査する。
# 経緯: docs/移設済み_アポ管理と営業指名_2026-08-22.md

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: repo-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 検査ロジックの自己点検
        run: python3 scripts/check_repo_scope.py --selftest

      - name: 置き場所の検査
        run: python3 scripts/check_repo_scope.py
