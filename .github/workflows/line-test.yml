name: line-test

# 結果マガ専用LINE(KEKKA_LINE_*シークレット)の連携テスト。
# シークレット登録後に手動実行し、専用LINEに着信すれば連携OK。
# ミカタのLINEシークレットは一切参照しない。

on:
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: line-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 登録されているトークンが「どのLINE公式アカウントのものか」をログに出す
      # (誤って別チャネルのトークンを登録した事故の検出用。トークン自体は出力しない)
      - name: トークンのアカウント識別チェック
        env:
          TOKEN: ${{ secrets.KEKKA_LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::KEKKA_LINE_CHANNEL_ACCESS_TOKEN が未設定です"
            exit 0
          fi
          info=$(curl -sS https://api.line.me/v2/bot/info -H "Authorization: Bearer $TOKEN")
          echo "このトークンのアカウント: $(echo "$info" | jq -r '"\(.displayName) (\(.basicId))"')"
          basic=$(echo "$info" | jq -r '.basicId')
          if [ "$basic" = "@473btavk" ]; then
            echo "✅ 結果マガ専用アカウント(@473btavk)のトークンです"
          else
            echo "::error::登録トークンが結果マガ(@473btavk)ではなく $basic のものです。LINE Developersのプロバイダー kekka_mag → チャネルID 2011004310 からトークンを再発行して上書きしてください"
            exit 1
          fi

      - name: テスト通知
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.KEKKA_LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.KEKKA_LINE_ADMIN_USER_ID }}
          message: |
            ✅【結果マガ】LINE連携テスト成功

            この通知が届いていれば、結果マガ専用LINEの設定は完了です。
            以後、自動下書き(毎月8日・22日)と公開記録の完了通知がここに届きます。
