name: note マガジン完全自動化

on:
  schedule:
    # 毎日朝6:30(JST) に記事生成・投稿
    - cron: '30 21 * * *'  # UTC 21:30 = JST 06:30
    # 毎週日曜夜18:00(JST) に分析
    - cron: '0 9 * * 0'    # UTC 09:00 = JST 18:00
  workflow_dispatch:  # 手動トリガー

jobs:
  generate-and-publish:
    name: 記事生成・投稿
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: ソースコード取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install anthropic playwright
          playwright install chromium

      - name: 記事を自動生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_note_magazine_daily.py

      - name: 生成記事をコミット
        run: |
          git config user.name "Claude Bot"
          git config user.email "noreply@anthropic.com"
          git add posts/note_magazine/
          git commit -m "chore: note magazine article generated $(date +'%Y-%m-%d')" || echo "Nothing to commit"

      - name: note へ自動投稿
        env:
          NOTE_USER_EMAIL: ${{ secrets.NOTE_USER_EMAIL }}
          NOTE_USER_PASSWORD: ${{ secrets.NOTE_USER_PASSWORD }}
          NOTE_MAGAZINE_ID: ${{ secrets.NOTE_MAGAZINE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LATEST_ARTICLE=$(find posts/note_magazine -name "*.md" -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -n "$LATEST_ARTICLE" ]; then
            echo "投稿対象: $LATEST_ARTICLE"
            python scripts/publish_note_article.py "$LATEST_ARTICLE"
          fi

      - name: Git push
        run: |
          git push origin claude/note-ai-automation-revenue-apb22t || echo "Push failed or nothing to push"

  analyze-performance:
    name: 週次分析・最適化提案
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * 0' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.mode, 'analyze'))

    steps:
      - name: ソースコード取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: パフォーマンス分析を実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/analyze_note_performance.py --claude

      - name: 分析レポートをコミット
        run: |
          git config user.name "Claude Bot"
          git config user.email "noreply@anthropic.com"
          git add docs/note_analytics/
          git commit -m "docs: note analytics report generated $(date +'%Y-%m-%d')" || echo "Nothing to commit"

      - name: Git push
        run: |
          git push origin claude/note-ai-automation-revenue-apb22t || echo "Push failed or nothing to push"

      - name: Slack 通知
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "📊 note マガジン週次分析が完了しました",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*note マガジン完全自動化*\n週次分析レポートを生成・保存しました。\n詳細は docs/note_analytics/ をご確認ください。"
                  }
                }
              ]
            }
