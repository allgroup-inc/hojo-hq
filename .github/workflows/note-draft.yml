name: note-draft

# 週刊「沖縄補助金 定点観測」note下書きの自動生成(docs/note自動化設計.md)。
# 毎週月曜 09:35 JST(09:00 JSTのデータ更新の後)に記事Markdownを生成してコミットし、
# たかしくん・小柳さんへLINE通知する。noteへの「公開」は人間がコピペで行う
# (noteに投稿公式APIがなく、非公式手段は絶対ルール2により使わない)。

on:
  schedule:
    # JST 月 09:35(= UTC 月 0:35)
    - cron: "35 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: note-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps(AI編集後記用)
        run: pip install anthropic

      - name: Generate note draft
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_note.py --preview >> "$GITHUB_OUTPUT"

      - name: Commit draft & snapshot
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add posts/note data/note_snapshot.json data/gone_archive.json
          git diff --cached --quiet || git commit -m "auto: note週刊定点観測 下書き ${{ steps.gen.outputs.stem }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i"; sleep 5
          done

      - name: LINE通知(下書き完成)
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.KEKKA_LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.KEKKA_LINE_ADMIN_USER_ID }}
          message: |
            📝【ミカタ】noteの週刊記事下書きができました

            ${{ steps.gen.outputs.title }}

            ━━━ 公開手順(約5分) ━━━
            ①下のリンクを開いて内容を一読
            https://github.com/${{ github.repository }}/blob/main/posts/note/${{ steps.gen.outputs.stem }}.md
            ②「Raw」表示で全文コピー
            ③noteの新規記事に貼り付けて公開

            気になる点があれば公開せず、そのままご相談ください。

            📣 公開後のX告知文(コピーして記事URLを足すだけ):
            ${{ steps.gen.outputs.xpost }}

      - name: LINE通知(失敗時)
        if: failure()
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.KEKKA_LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.KEKKA_LINE_ADMIN_USER_ID }}
          message: |
            🚨【ミカタ】note下書きの自動生成が失敗しました
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
