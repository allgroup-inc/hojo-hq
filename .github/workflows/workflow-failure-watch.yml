# 定時実行が失敗し続けているワークフローを、1つの Issue にまとめて知らせる(2026-11-24 新設)。
#
# 2026-11-24 の点検で、結果マガの週次集計(7週)・単発記事の下書き(1か月)・Lighthouse(51日)・
# 制度収集の出荷ゲート(9日)の失敗が、それぞれ気づかれないまま続いていた。
# 毎日、main の定時実行をワークフローごとにたどり、連続で失敗しているものを一覧にする。
# - Issue の本文は毎日いまの一覧に書き換える(コメントは増やさない)
# - 新しく止まったワークフローが出た日だけコメントする(通知が届く)
# - 一覧が空になったら閉じる
# 直すのは人・各担当(このジョブは知らせるだけで、再実行も変更もしない)。
name: workflow-failure-watch

on:
  schedule:
    - cron: "47 23 * * *"   # 毎日 08:47 JST(正時は GitHub の混雑で遅れやすいので外す)
  workflow_dispatch: {}
  pull_request:   # PR では自己テストだけ(Issue は触らない)
    paths:
      - "scripts/workflow_failure_watch.py"
      - ".github/workflows/workflow-failure-watch.yml"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: workflow-failure-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 自己テスト
        run: python scripts/workflow_failure_watch.py --self-test

      - name: 連続で失敗している定時実行を一覧にする
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/workflow_failure_watch.py > body.md
          cat body.md

      - name: Issue を更新する(作る・書き換える・新しく止まった日だけコメント・空なら閉じる)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "定時実行の連続失敗(毎日自動更新)"
        run: |
          num=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -s body.md ]; then
            if [ -n "$num" ]; then
              gh issue view "$num" --json body --jq .body > prev.md
              newly=$(python scripts/workflow_failure_watch.py --new-since prev.md < body.md)
              gh issue edit "$num" --body-file body.md
              if [ -n "$newly" ]; then
                gh issue comment "$num" --body "新しく止まった定時実行: $(echo "$newly" | paste -sd ',' - | sed 's/,/、/g')(一覧は本文)"
              fi
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "連続で失敗している定時実行はなくなりました($(TZ=Asia/Tokyo date '+%Y-%m-%d') 時点)。"
          else
            echo "連続で失敗している定時実行はありません"
          fi
