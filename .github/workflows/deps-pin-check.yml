# 依存固定(ハッシュ)の PR 上検証。決裁 #26 S4 の事前条件(設計 v2.2)。
# PR から持ち込まれたコードが動くため、secrets は一切参照せず、GITHUB_TOKEN は読み取りのみ。push・コメント・Issue 操作はしない。
name: deps-pin-check
on:
  pull_request:
    paths:
      - ".github/requirements/**"
      - ".github/workflows/verify-sources.yml"
      - ".github/workflows/deps-pin-check.yml"
      - "scripts/check_pins.py"
permissions:
  contents: read
concurrency:
  group: deps-pin-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-sources-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: L2' 列挙ハッシュと PyPI メタデータの完全照合(期待 15 件は本ファイルが正本)
        run: >-
          python3 -I scripts/check_pins.py .github/requirements/verify-sources.txt --expect
          anthropic==1.13.0 anyio==4.15.1 docstring-parser==0.18.0 httpx2==2.13.1 httpcore2==2.13.1
          jiter==0.17.0 pydantic==2.14.0 pydantic-core==2.50.0 sniffio==1.3.1 typing-extensions==4.16.0
          idna==3.20 truststore==0.10.4 h11==0.16.0 annotated-types==0.8.0 typing-inspection==0.4.4
      - name: L1 本番相当(3.12 runner)で --require-hashes 導入
        run: python -m pip install --require-hashes --no-cache-dir -r .github/requirements/verify-sources.txt
      - name: import 確認
        run: python -c "import anthropic; print(anthropic.__version__)"
