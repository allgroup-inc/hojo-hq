name: fukugiiro-fetch

on:
  schedule:
    # 朝夕2回まで(守り部審査・第1次ウタガイ採用事項): 06:00 / 18:00 JST
    - cron: "0 21,9 * * *"
  push:
    branches: [main]  # 作業ブランチへのbot混入防止(resilient-agent-design監査 2026-08-07)
    paths:
      - "scripts/fetch_fukugiiro.py"
      - "scripts/kensho_fukugiiro.py"
      - "scripts/generate_area_pages.py"
      - "scripts/generate_kit_pages.py"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/fukugiiro-fetch.yml"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: fukugiiro-fetch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 個人向け制度の収集(承認済みソースのみ・書込前に検証)
        run: python scripts/fetch_fukugiiro.py

      - name: 検証(ゴールデンセット+DB)
        run: python scripts/validate_fukugiiro.py --self-test

      - name: 一次ソース突合レポート(ケンショウ支援)
        run: python scripts/kensho_fukugiiro.py

      - name: 市町村別ページ+申請準備シート再生成(programmatic SEO)
        run: |
          python scripts/generate_area_pages.py
          python scripts/generate_kit_pages.py
          python scripts/generate_sitemap.py
          python scripts/check_lp_fukugiiro.py

      - name: Commit data
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add data/fukugiiro/seido.json docs/フクギイロ_突合レポート.md site/fukugiiro/area site/fukugiiro/kit site/sitemap.xml site/robots.txt
          git diff --cached --quiet || git commit -m "auto: fukugiiro seido update $(date '+%Y-%m-%d %H:%M')"
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && break
            git rebase --abort 2>/dev/null || true
            echo "push retry $i"; sleep 5
            [ "$i" = "3" ] && { echo "::error::pushが3回とも失敗しました。データは保存されていません"; exit 1; }
          done

      # ── 失敗時: 黙って止まらないようIssueを起票(resilient-agent-design ⑦ 静かな脱落の防止)
      #    2026-08-17点検で追加。この3本だけ失敗通知が無く、止まっても誰も気づかない状態だった。
      - name: Open or update issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh label create automation-failure --color B60205 \
            --description "定期実行ワークフローの失敗(自動起票)" 2>/dev/null || true
          title="⚠️ fukugiiro-fetch が失敗しました"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "定期実行ワークフロー \`fukugiiro-fetch\` が失敗しました。"
            echo ""
            echo "**止まると何が起きるか**: 個人向け制度データの更新が止まる(支持KPI「データ鮮度 更新遅延24時間以内」に直撃)"
            echo ""
            echo "- 実行ログ: $run_url"
            echo "- 日時(UTC): $(date -u '+%Y-%m-%d %H:%M')"
          } > issue_body.md
          existing=$(gh issue list --state open --label automation-failure \
            --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue_body.md
          else
            gh issue create --label automation-failure --title "$title" --body-file issue_body.md
          fi
