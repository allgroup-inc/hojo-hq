name: fukugiiro-fetch

on:
  schedule:
    # 朝夕2回まで(守り部審査・第1次ウタガイ採用事項): 06:00 / 18:00 JST
    - cron: "0 21,9 * * *"
  push:
    branches: [main]  # 作業ブランチへのbot混入防止(resilient-agent-design監査 2026-08-07)
    paths:
      - "scripts/fetch_fukugiiro.py"
      - "scripts/kensho_fukugiiro.py"
      - "scripts/generate_area_pages.py"
      - "scripts/generate_kit_pages.py"
      - "scripts/generate_life_pages.py"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/fukugiiro-fetch.yml"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: fukugiiro-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 個人向け制度の収集(承認済みソースのみ・書込前に検証)
        run: python scripts/fetch_fukugiiro.py

      - name: 検証(ゴールデンセット+DB)
        run: python scripts/validate_fukugiiro.py --self-test

      - name: 一次ソース突合レポート(ケンショウ支援)
        run: python scripts/kensho_fukugiiro.py

      - name: 市町村別ページ+申請準備シート再生成(programmatic SEO)
        run: |
          python scripts/generate_area_pages.py
          python scripts/generate_kit_pages.py
          python scripts/generate_life_pages.py
          python scripts/generate_sitemap.py
          python scripts/check_lp_fukugiiro.py

      # 山梨版は data/fukugiiro/seido.json から生成される派生サイト。
      # どのCIからも実行されておらず沖縄版と同期しなくなっていたため追加
      # (2026-09-20: 削除済み制度が31ファイル残り、逆に欠落中の制度が表示され続けていた)。
      # sitemap は山梨のページも拾うため、ビルド後に再生成する。
      - name: 山梨版を沖縄版から再生成
        run: |
          python scripts/yamanashi/build_yamanashi.py
          python scripts/generate_sitemap.py

      - name: Commit data
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          # 山梨版(site/yamanashi・data/yamanashi)もaddリストに入れる。addし忘れると直後の
          # git checkout/clean で生成物が消え、ビルドステップが無駄になる(2026-08-17 life追加漏れと同型)
          git add data/fukugiiro/seido.json data/fukugiiro/kensho_summary.json docs/フクギイロ_突合レポート.md site/fukugiiro/area site/fukugiiro/kit site/fukugiiro/life site/yamanashi data/yamanashi site/sitemap.xml site/robots.txt
          git diff --cached --quiet || git commit -m "auto: fukugiiro seido update $(date '+%Y-%m-%d %H:%M')"
          # addリスト外の生成残骸が pull --rebase を妨げないよう作業ツリーを掃除
          # (2026-08-17: life追加漏れ+未ステージ残骸でpullが3回失敗→無言でコミット消失した事故の再発防止)
          git checkout -- . 2>/dev/null || true
          git clean -fd site 2>/dev/null || true
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)
          pushed=0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && pushed=1 && break
            git rebase --abort 2>/dev/null || true
            echo "push retry $i"; sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::再構築結果のpushに失敗(無言のコミット消失を防ぐため失敗扱い)"
            exit 1
          fi
