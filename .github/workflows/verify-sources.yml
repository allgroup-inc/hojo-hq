name: verify-sources

# 100点基準❹: 掲載データと原文の照合を毎日5件自動サンプリング。
# jGrants由来はAPI再取得で厳密照合(キー不要)、県・公社由来はClaude(Haiku)で照合
# (Secrets: ANTHROPIC_API_KEY。未設定の間は該当分のみ自動スキップ)。
# マルチAIダブルチェック(2026-08-06 小柳さん決裁): Secrets に GEMINI_API_KEY を
# 設定すると、同じ原文を Gemini でも独立照合し、どちらかが矛盾を検知したら NG。
# 未設定の間は従来の Claude 単独照合のまま動く。
#
# 2026-11-27 改修: 11/5〜11/26 に Claude の鍵の失効(401)で11回失敗したのに、
# 「掲載データと原文に不一致」の Issue として知らせ、国のAPIだけの日の成功で
# 「解消しました」と閉じていた。失敗した日は照合履歴にも残っていなかった。
# いまは Issue を原因ごとに2つに分ける。
#   - 内容(label: verify-sources): 原文と食い違う/出典を開けない掲載。同じ制度を照合し直して
#     問題が無くなる(または掲載が終わる)まで閉じない
#   - 照合の障害(label: verify-sources-outage): AIの鍵の失効・上限・未登録、処理の異常終了。
#     そのAIが実際に照合できた回に閉じる(国のAPIだけの回の成功では閉じない)
# 状態は scripts/verify_sources.py が verify_status.json に書き出す。

on:
  schedule:
    # JST 10:15(= UTC 01:15)。データ更新(09:00 JST)の後に照合。
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Sample size (default: 5, Phase 2: 20)"
        required: false
        default: "5"
  pull_request:   # PR では自己テストだけ(下の selftest ジョブ)
    paths:
      - "scripts/verify_sources.py"
      - "tests/test_verify_sources_status.py"
      - ".github/workflows/verify-sources.yml"

permissions:
  contents: read

concurrency:
  # PR の実行が、待っている定時の照合を取り消さないよう、PR は別のグループにする
  group: verify-sources-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # PR では自己テストだけ(書き込みの権限なし・照合・Issue・コミットはしない)
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 自己テスト(外部に接続しない合成データ)
        run: python -m unittest tests/test_verify_sources_status.py

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 照合履歴(data/kpi/verify_history.json)と未解決の状態のコミットに必要
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deps  # ハッシュ固定(決裁 #26 S4 事前条件)。版の正本は .github/requirements/verify-sources.txt
        run: python -m pip install --require-hashes -r .github/requirements/verify-sources.txt

      - name: 自己テスト(外部に接続しない合成データ)
        run: python -m unittest tests/test_verify_sources_status.py

      - name: Run source verification
        id: verify
        continue-on-error: true   # 結果の判定は最後の手順で行う(履歴の保存と Issue の更新を先に済ませる)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERIFY_SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '5' }}
        run: python scripts/verify_sources.py

      # ── 照合履歴と未解決の状態を台帳へ(失敗・未実施の回も必ず残す)──
      - name: Commit verify history
        if: always()
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add data/kpi/verify_history.json
          [ -f data/kpi/verify_open.json ] && git add data/kpi/verify_open.json
          git diff --cached --quiet && exit 0
          git commit -m "auto: verify history $(date -u '+%Y-%m-%d')"
          d=2
          for a in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || git rebase --abort
            sleep $d; d=$((d*2))
          done
          echo "::warning::照合履歴のpushに失敗(照合自体は完了)"

      # ── 内容の Issue: 新しく見つかった日だけ追記。未解決が0件になったら閉じる ──
      - name: Content issue (mismatch / source not reachable)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f verify_status.json ] || [ "$(jq -r .status verify_status.json)" = crash ]; then
            echo "異常終了の回は、内容の Issue を触らない(閉じない)"; exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -r '.content_issue // ""' verify_status.json > content.md
          new=$(jq -r '(.changes.new_items // []) | length' verify_status.json)
          existing=$(gh issue list --state open --label verify-sources --json number --jq '.[0].number // empty')
          if [ -s content.md ] && [ "$(wc -c < content.md)" -gt 1 ]; then
            printf '\n\n- 実行: %s\n' "$run_url" >> content.md
            if [ -z "$existing" ]; then
              gh label create verify-sources --color FBCA04 \
                --description "原文照合で、原文と食い違う・出典を開けない掲載を検知" 2>/dev/null || true
              gh issue create --label verify-sources --title "⚠️ 原文照合: 確かめが必要な掲載があります" --body-file content.md
            else
              gh issue edit "$existing" --body-file content.md   # 本文は毎回いまの一覧に差し替える
              if [ "$new" -gt 0 ]; then
                gh issue comment "$existing" --body "新しく見つかった掲載が ${new}件 あります(一覧は本文)。$run_url"
              fi
            fi
          elif [ -n "$existing" ]; then
            resolved=$(jq -r '(.changes.resolved // []) | length' verify_status.json)
            if [ "$resolved" -gt 0 ]; then
              gh issue comment "$existing" --body "✅ 未解決だった掲載を照合し直し、問題が無くなったことを確かめました(掲載が終わった制度を含む)。自動で閉じます。$run_url"
              gh issue close "$existing"
            else
              echo "::warning::未解決の一覧は空だが、この回で照合し直して解決した制度は無い。Issue #$existing は閉じない(人が確かめて閉じる)"
            fi
          fi

      # ── 照合の障害の Issue: 状態が変わった日だけ追記。全AIが照合できたら閉じる ──
      - name: Outage issue (AI keys / quota / crash)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -f verify_status.json ]; then
            jq -r '.outage_issue // ""' verify_status.json > outage.md
            changed=$(jq -r '(.changes.judge_changed // []) | length' verify_status.json)
          else
            printf '**照合が実行されませんでした(自己テスト・準備の失敗、または処理の異常終了)。掲載データの誤りではありません。**\n\n```\n' > outage.md
            cat verify_report.txt >> outage.md 2>/dev/null || echo "レポートなし" >> outage.md
            printf '\n```\n' >> outage.md
            changed=1
          fi
          existing=$(gh issue list --state open --label verify-sources-outage --json number --jq '.[0].number // empty')
          if [ -s outage.md ] && [ "$(wc -c < outage.md)" -gt 1 ]; then
            printf '\n\n- 実行: %s\n' "$run_url" >> outage.md
            if [ -z "$existing" ]; then
              gh label create verify-sources-outage --color D93F0B \
                --description "原文照合が実施できない(鍵・上限・異常終了)。掲載データの誤りではない" 2>/dev/null || true
              gh issue create --label verify-sources-outage \
                --title "⚠️ 原文照合の障害: AIによる照合が実施できていません(掲載データの誤りではありません)" \
                --body-file outage.md
            else
              gh issue edit "$existing" --body-file outage.md
              if [ "$changed" -gt 0 ]; then
                gh issue comment "$existing" --body "障害の状態が変わりました(いまの状態は本文)。$run_url"
              fi
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "✅ Claude・Gemini とも、実際に照合できたことを確かめました。自動で閉じます。$run_url"
            gh issue close "$existing"
          fi

      # ── この回の結果: 正常(国のAPIだけの回を含む)以外は失敗にする(連続失敗の見張りが拾う)──
      - name: Result
        if: always()
        run: |
          status=$(jq -r '.status // "crash"' verify_status.json 2>/dev/null || echo crash)
          echo "照合の結果: $status"
          case "$status" in
            ok|ok_api_only) exit 0 ;;
            degraded) echo "::error::AIによる照合が欠けています(鍵・上限・未登録)。掲載データの誤りではありません"; exit 1 ;;
            mismatch) echo "::error::原文と食い違う掲載があります"; exit 1 ;;
            fetch_error) echo "::error::出典を開けない掲載があります(内容の誤りとは限らない)"; exit 1 ;;
            *) echo "::error::照合処理が異常終了しました"; exit 1 ;;
          esac
