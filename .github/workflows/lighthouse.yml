name: lighthouse

# 100点基準❷: Lighthouse4項目(Performance/Accessibility/Best Practices/SEO)を毎日自動計測。
# 閾値割れは Issue を自動起票し、回復したら自動クローズする。
# 閾値設定: .github/lighthouserc.json
# ── 閾値の経緯(2026-08-17 小柳さん決裁・Issue #10 の3択でb案採用)──
# Performanceのみ 0.85(計測対象=トップLP。映画風ワンページ構造の初回レイアウト
# コスト930msが残り、CSS最適化(PR#205)後もローカル0.97/本番CI0.86で乖離するため。
# 毎日の赤CI=オオカミ少年化を止める)。他3カテゴリは 0.95 を維持。
# LPを深く軽量化リファクタした場合は 0.95 へ戻すことを再検討する(見直し期限 2027-02-17)。

on:
  schedule:
    # JST 10:30(= UTC 01:30)。ヘルスチェック(10:00 JST)の後に計測。
    - cron: "30 1 * * *"
  workflow_dispatch: {}
  # トップLPを変えるPRでは、統合前に手元のファイルを計測する(2026-11-24 追加)。
  # 2026-10-03 に見やすさ(Accessibility)が 0.92 へ下がったまま、毎日の本番計測で
  # 51日間 Issue に追記され続けた(文字色のコントラスト不足・地域選択の名前なし)。
  # 下がる変更は PR の段階で止める
  pull_request:
    paths:
      - "site/index.html"
      - ".github/lighthouserc.pr.json"
      - ".github/workflows/lighthouse.yml"

permissions:
  contents: read
  issues: write

concurrency:
  # PR の計測と毎日の本番計測を別の列にする(同じ列だと、待っている側が後から来た実行に取り消される)
  group: lighthouse-${{ github.event_name == 'pull_request' && github.ref || 'prod' }}
  cancel-in-progress: false

jobs:
  # PR: 手元の site/index.html を計測。CI 機の性能で揺れる Performance は見ず、
  # 揺れない見やすさ・SEO・Best Practices だけを本番と同じ基準(0.95)で止める
  pr-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 手元のサイトを配信
        run: |
          nohup python3 -m http.server 8931 --directory site > /tmp/httpd.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8931/index.html
      - name: Run Lighthouse(PRのトップLP・3回計測)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:8931/index.html
          runs: 3
          configPath: .github/lighthouserc.pr.json

  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse(本番サイト・3回計測の中央値)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://allgroup-inc.github.io/hojo-hq/
          runs: 3
          uploadArtifacts: true
          configPath: .github/lighthouserc.json

      # ── 閾値割れ: Issue を起票 / 既存の未解決Issueに追記 ──
      - name: Open or update issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh label create lighthouse --color D93F0B \
            --description "Lighthouseスコアが基準(95)未達" 2>/dev/null || true
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "自動検知: Lighthouseスコアが基準(閾値: .github/lighthouserc.json)を下回りました。"
            echo ""
            echo "- 実行(スコア詳細とレポートはArtifacts参照): $run_url"
            echo "- 日時(UTC): $(date -u '+%Y-%m-%d %H:%M')"
            echo "- 閾値設定: .github/lighthouserc.json"
            echo ""
            echo "## 対応する人へ(AIエージェント含む)"
            echo ""
            echo "**まず \`hojo-lighthouse-triage\` スキルを読んでから着手すること。**"
            echo "Claude Code 環境からは本番URLにも上のArtifactsにも直接アクセスできないことが多い。"
            echo "上のリンクを開こうとして詰まるのが定番の時間の溶かし方なので、"
            echo "スキルの手順に従って**ローカルでスコアを実測してから**原因を特定する。"
          } > issue_body.md
          existing=$(gh issue list --state open --label lighthouse \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue_body.md
            echo "既存Issue #$existing に追記しました"
          else
            gh issue create --label lighthouse \
              --title "📉 Lighthouse基準未達: 閾値を下回りました" \
              --body-file issue_body.md
          fi

      # ── 回復時: 未解決の lighthouse Issue を自動クローズ ──
      - name: Auto-close issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --label lighthouse \
            --json number --jq '.[].number' 2>/dev/null || true)
          for n in $open; do
            gh issue comment "$n" --body "✅ 直近の計測で基準(閾値: .github/lighthouserc.json)に回復しました。自動クローズします。"
            gh issue close "$n"
          done
