# もらいわすれ堂の独自ドメイン(moradou.jp)— 配信ツリーの検査
# 議事: docs/議事_20260828_独自ドメインmoradou.md / docs/議事_20260923_独自ドメイン配信範囲.md
#
# **このworkflowは配信しない。** 配信は allgroup-inc/moradou 側の build.yml が
# 自分で hojo-hq(Public)を読んで行う。そのため hojo-hq には moradou への
# 書き込みトークンを置かない(Publicリポジトリに長期の越境トークンを置かない)。
#
# ここでやるのは「いつでも正しく組み立てられる状態か」の検査だけ。
# 旧URLの書き換え漏れ・別ブランドの混入・未知のURL基底があれば赤で止まり、
# 壊れた状態が main に入らない。
name: moradou-deploy
on:
  push:
    branches: [main]
    paths:
      - "site/fukugiiro/**"
      - "site/yamanashi/**"
      - "site/go/**"
      - "site/sitemap.xml"
      - "scripts/deploy_moradou.py"
      - "deploy/moradou/**"
      - ".github/workflows/moradou-deploy.yml"
  pull_request:
    paths:
      - "scripts/deploy_moradou.py"
      - "deploy/moradou/**"
      - ".github/workflows/moradou-deploy.yml"
  workflow_dispatch:
concurrency:
  group: moradou-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 検査そのものが正しく落ちるかを毎回確かめる(壊して落ちることまで見る)
      - name: 組み立てスクリプトの自己テスト
        run: python scripts/deploy_moradou.py --self-test

      # 配信先リポジトリ上で動くのと同じ状態(.github がある)を作って再現する
      - name: 配信ツリーの組み立てと検査
        run: |
          mkdir -p /tmp/moradou-build/.github/workflows
          cp deploy/moradou/.github/workflows/build.yml /tmp/moradou-build/.github/workflows/
          python scripts/deploy_moradou.py --out /tmp/moradou-build
          test -f /tmp/moradou-build/.github/workflows/build.yml \
            || { echo "::error::配信で自分のworkflowを消している"; exit 1; }
          echo "ページ $(find /tmp/moradou-build -name index.html | wc -l) 枚 / workflow 保持OK"

      - name: 配信先workflowの構文検査
        run: python -c "import yaml,sys; yaml.safe_load(open('deploy/moradou/.github/workflows/build.yml')); print('OK')"

      - name: 現状の案内
        run: |
          echo "::notice::配信先 allgroup-inc/moradou が未作成の間、公開は始まりません。"
          echo "::notice::残りの手順は docs/決裁キュー.md の #5 を参照してください。"
