name: funnel-deep-dive

# ファネル深掘りレポート(手動実行)。サイト(Plausible)・LINE・Instagramの
# 「何人がどこまで来て、どこで離脱しているか」を一括で引き、reports/へコミットする。

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: funnel-deep-dive
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: レポート生成
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          GA4_MIKATA_PROPERTY_ID: ${{ secrets.GA4_MIKATA_PROPERTY_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -n "$GA4_SA_JSON" ]; then pip install -q google-auth requests; fi
          python scripts/funnel_deep_dive.py

      - name: コミット
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add reports/hojo-mikata/funnel_deep_dive_*.md
          git diff --cached --quiet || git commit -m "auto: ファネル深掘りレポート $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i"; sleep 5
          done
