name: glow-ma-ci

on:
  push:
    paths:
      - "glow-ma/**"
      - "tests/glow_ma_*.test.mjs"
  pull_request:
    paths:
      - "glow-ma/**"
      - "tests/glow_ma_*.test.mjs"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-07 CI総点検): 並走によるrebase衝突・重複送信の予防。後続は待機。
concurrency:
  group: glow-ma-ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: GLOW M&A台帳 ロジック単体テスト
        run: node --test tests/glow_ma_*.test.mjs
