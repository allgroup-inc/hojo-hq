name: docs-governance

# 三名体制の議事がgitに保存されているかを検査する(失敗台帳 FK-003 の対策)。
# 「議事詳細は会話記録を参照」型で議事が揮発する事故を、マージ前に止めるのが目的。

on:
  push:
    paths:
      - "docs/superpowers/specs/**"
      - "scripts/check_triangle_review.py"
      - ".github/workflows/docs-governance.yml"
  pull_request:
    paths:
      - "docs/superpowers/specs/**"
      - "scripts/check_triangle_review.py"
      - ".github/workflows/docs-governance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triangle-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 三名体制の議事が保存されているか検査
        run: python3 scripts/check_triangle_review.py
