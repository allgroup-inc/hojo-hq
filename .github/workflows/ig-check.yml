name: ig-check

# もらいわすれ堂Instagramの常時チェック(毎朝06:00 JST = 21:00 UTC)。
# Graph APIで投稿・プロフィールを取得し、出荷ゲート相当の禁止表現・タグ数・
# 投稿停滞・トークン失効を検査。違反時は Issue(label: ig-check)で通知する。
# Secrets(IG_ACCESS_TOKEN / IG_USER_ID)未設定の間は「設定待ち」で正常終了する。
# 議事: docs/議事_20260906_IG常時チェック体制.md

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ig-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run IG check
        id: check
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -o pipefail
          python3 scripts/ig_check.py | tee ig_check_output.txt
        continue-on-error: true

      - name: Commit report
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add data/fukugiiro/ig_check_report.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: IG常時チェックレポート更新 $(date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done

      - name: Open or update issue on failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ig-check --color B9502F \
            --description "IG常時チェックの検知" 2>/dev/null || true
          {
            echo "IG常時チェック(ig-check)が違反または取得エラーを検知しました。"
            echo ""
            echo '```'
            tail -60 ig_check_output.txt
            echo '```'
            echo ""
            echo "- キャプションの違反 → Instagramアプリでキャプションを編集して修正"
            echo "- トークンエラー → docs/人間タスク_IG常時チェック_トークン設定.md の再発行手順"
            echo "- 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue_body.md
          existing=$(gh issue list --state open --label ig-check \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue_body.md
          else
            gh issue create --label ig-check \
              --title "IG常時チェック: 違反または取得エラーを検知" \
              --body-file issue_body.md
          fi

      - name: Fail job if check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
