name: PII Guard (誤コミット検知)
on:
  pull_request:
  push:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 変更ファイルにPIIパターン(パス・中身)が無いか検査
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
            files=$(git diff --name-only "$base" "$head")
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || git show --name-only --pretty=format: "${{ github.sha }}")
          fi
          echo "変更ファイル:"; echo "$files"
          [ -z "$files" ] && { echo "変更なし"; exit 0; }
          python -m scripts.churn.precommit_pii_guard $files
