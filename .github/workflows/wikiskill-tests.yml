name: wikiskill-tests

# WikiSkill Phase 1(記憶の仕組み)のテスト。詳細: docs/wikiskill/README.md
# 時間計測のテスト(500ms 以内)は実行環境に左右されるため CI では飛ばし、ローカルで測る(WIKISKILL_SKIP_TIMING=1)。
#
# 2026-10-08 決裁 #26 S2(PR-A2): pull_request は paths フィルタ無しで**全 PR** で起動する
# (S7a で必須 status check にするため。paths で起動しない PR は「Expected」のまま詰まる)。
# 代わりに「対象判定」step が PR の変更ファイルを scripts/wikiskill_scope.py の PATTERNS
# (= 下の push 側 paths と同じ 26 件)と突き合わせ、当たらなければテストを省略して緑で終わる。
# 差分の取得や判定に失敗した場合は安全側に倒して全テストを実行する。push 起動は従来どおり paths で絞る。

on:
  pull_request:
  push:
    paths:
      - 'scripts/wikiskill_common.py'
      - 'scripts/experience_log.py'
      - 'scripts/decision_memory.py'
      - 'scripts/memory_bootstrap.py'
      - 'scripts/check_experience_privacy.py'
      - 'scripts/experience_archive.py'
      - 'scripts/baseline_debt.py'
      - '.claude/hooks/wikiskill-hook.sh'
      - 'tests/scripts/test_*.py'
      - 'tests/integration/test_wikiskill_memory_e2e.py'
      - 'tests/integration/test_wikiskill_wiki_e2e.py'
      - '.github/workflows/wikiskill-tests.yml'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.claude/skills/**'
      - '.claude/settings.json'
      - '.gitignore'
      - 'scripts/check_repo_scope.py'
      - 'scripts/wiki_schema.py'
      - 'scripts/wiki_validate.py'
      - 'docs/wiki/**'
      - 'scripts/wikiskill_lock.py'
      - 'scripts/knowledge_extract.py'
      - '.github/workflows/knowledge-extract.yml'
      - '.github/workflows/repo-scope.yml'
      - '.github/CODEOWNERS'
  workflow_dispatch: {}

concurrency:
  group: wikiskill-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: wikiskill-tests-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 対象判定そのものが壊れていたら、省略せず赤にする(黙って素通りさせない)
      - name: 対象判定の自己点検(push 側 paths と PATTERNS の一致を含む)
        run: |
          python3 scripts/wikiskill_scope.py --selftest
          python3 scripts/wikiskill_scope.py --check-workflow .github/workflows/wikiskill-tests.yml

      # PR の変更ファイル(追加・削除・変更。リネームは --no-renames で削除+追加として両方のパスを見る)を
      # PATTERNS と突き合わせる。差分が取れない・判定に失敗 → 安全側(skip=false = 全テスト実行)。
      - name: 対象判定(PR の変更ファイルが対象パターンに当たるか)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -u
          skip=false
          reason=""
          if [ "$EVENT" = "pull_request" ]; then
            if git fetch -q origin "$BASE_REF" \
               && git diff --name-only --no-renames "origin/$BASE_REF...HEAD" > changed.txt; then
              rc=0
              python3 scripts/wikiskill_scope.py --files-from changed.txt > matched.txt || rc=$?
              if [ "$rc" -eq 0 ]; then
                skip=true
                reason="変更 $(wc -l < changed.txt) ファイルに対象パターン無し → テスト省略(緑)"
              elif [ "$rc" -eq 3 ]; then
                reason="対象 $(wc -l < matched.txt) ファイル: $(head -5 matched.txt | tr '\n' ' ')"
              else
                echo "::warning::対象判定に失敗(exit $rc)→ 安全側: 全テストを実行します"
                reason="対象判定に失敗(exit $rc)→ 安全側で全テスト実行"
              fi
            else
              echo "::warning::差分の取得に失敗(base=$BASE_REF)→ 安全側: 全テストを実行します"
              reason="差分の取得に失敗 → 安全側で全テスト実行"
            fi
          else
            reason="$EVENT 起動のため全テスト実行"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "## wikiskill-tests-all: $reason" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason"

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: pytest を入れる
        if: steps.scope.outputs.skip != 'true'
        run: pip install pytest

      - name: git の作者を設定(テストが一時リポジトリでコミットする)
        if: steps.scope.outputs.skip != 'true'
        run: git config --global user.email ci@example.com && git config --global user.name ci

      - name: WikiSkill のテスト
        if: steps.scope.outputs.skip != 'true'
        env:
          WIKISKILL_SKIP_TIMING: "1"
        run: >-
          python3 -m pytest
          tests/scripts/test_wikiskill_common.py
          tests/scripts/test_experience_log.py
          tests/scripts/test_wikiskill_hook_sh.py
          tests/scripts/test_decision_memory.py
          tests/scripts/test_memory_bootstrap.py
          tests/scripts/test_check_experience_privacy.py
          tests/scripts/test_experience_archive.py
          tests/scripts/test_baseline_debt.py
          tests/scripts/test_wiki_schema.py
          tests/scripts/test_wiki_validate.py
          tests/scripts/test_wikiskill_lock.py
          tests/scripts/test_knowledge_extract.py
          tests/scripts/test_wikiskill_workflows.py
          tests/scripts/test_direct_push_watch.py
          tests/scripts/test_direct_push_watch_steps.py
          tests/scripts/test_wikiskill_scope.py
          tests/integration/test_wikiskill_memory_e2e.py
          tests/integration/test_wikiskill_wiki_e2e.py
          -q
