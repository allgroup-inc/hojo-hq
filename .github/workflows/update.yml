name: update-subsidies

on:
  schedule:
    # JSTで 03:00 / 09:00 / 15:00 / 21:00 の1日4回(cronはUTC)
    - cron: "0 18,0,6,12 * * *"
  workflow_dispatch: {}

# 同時実行禁止(2026-08-04): 2本並走→rebaseコンフリクト→マーカー入りJSONが
# そのままデプロイされ診断が全停止した事故の再発防止。後続は待機して順番に実行する。
concurrency:
  group: update-subsidies
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch jGrants data
        run: python scripts/fetch_jgrants.py

      - name: Fetch local (自治体) data
        # 守り部審査済み(docs/守り部審査記録.md)。沖縄県・産業振興公社・那覇市を追加収集しマージ
        run: python scripts/fetch_local.py

      - name: Generate LINE deadline alerts
        # 締切7日以内の制度からLINE配信下書きを自動生成(配信は人が実行)
        run: python scripts/generate_line_alerts.py

      - name: Install image deps (Noto CJK fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          pip install pillow

      - name: Generate SNS posts
        # posts/launch/*.md を再生成。画像のCTA件数(ライブ取得)と大見出し件数(md由来)を
        # 常に同一データで揃えるため、必ず画像生成の直前に実行する。
        run: python scripts/generate_sns.py

      - name: Generate post images
        # posts/launch/*.md の文言をブランド画像(posts/images/*.png)に焼き込み
        run: python scripts/generate_images.py

      - name: Generate story image (縦型1080x1920)
        # 締切アラート(line_alerts.json)から毎日のストーリーズ画像を生成
        run: python scripts/generate_story.py

      - name: Generate weekly carousel (金曜投稿用Top5・毎日更新して鮮度維持)
        # carousel-writerスキル準拠の7枚組。金曜のsocial-postがこの素材を使う。
        run: python scripts/generate_carousel.py

      - name: Generate topic pages (目的別pSEO・議事20260809)
        # 設備投資/IT/省エネ/雇用/創業/承継の6ページを最新データで再生成
        run: python scripts/generate_topic_pages.py

      - name: Record KGI (LINE友だち数の日次記録)
        # KGI実測値をリポジトリに蓄積(未接続・集計待ちも状態を明記)。
        # readyが3日途切れたら管理者LINEへ警報1回(計測の無言停止対策)。
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: python scripts/record_kgi.py

      - name: Record もらいわすれ堂 IGフォロワー数(❸)
        # トークン未登録でも graceful に終了0(状態を明記)。--set で手動記録も可。
        env:
          MORADOU_IG_USER_ID: ${{ secrets.MORADOU_IG_USER_ID }}
          MORADOU_IG_TOKEN: ${{ secrets.MORADOU_IG_TOKEN }}
        run: python scripts/record_ig_followers.py

      - name: Commit updated data
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add data/subsidies.json data/line_alerts.json data/kpi posts/launch posts/images posts/line posts/carousel site/themes
          git diff --cached --quiet || git commit -m "auto: update subsidies & images $(date '+%Y-%m-%d %H:%M')"
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)。
          # -X theirs: 自動生成ファイル同士のコンフリクトは自分の新しい生成分で解決し、
          # マーカーを作業ツリーに残さない。失敗したらrebaseを必ずabortして原状回復する。
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            echo "push retry $i"; sleep 5
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Copy data into site
        run: cp -r data site/data

      - name: Validate data before deploy (壊れたJSONを公開しないゲート)
        # 2026-08-04: マーカー入りJSONが公開され診断が全停止した事故の再発防止。
        # ここで落ちればデプロイされず、公開中の正常なサイトがそのまま残る。
        run: |
          python - <<'EOF'
          import json, sys
          for p in ["site/data/subsidies.json", "site/data/line_alerts.json"]:
              d = json.load(open(p, encoding="utf-8"))
              print(p, "ok")
          n = len(json.load(open("site/data/subsidies.json", encoding="utf-8")).get("items", []))
          if n < 10:
              sys.exit(f"subsidies items={n} — 少なすぎるため公開を中止")
          print("items:", n)
          EOF

      - name: Inject ledger config (基準❺)
        # 企業台帳の送信先URL・トークンはGitHub Secretsのみが持つ(公開リポジトリに置かない)。
        # commitステップの後に注入するため、リポジトリ上のファイルは常に空設定のまま。
        # Secrets未登録の間は空のままデプロイされ、台帳送信は無効(サイトは通常動作)。
        env:
          GAS_LEDGER_ENDPOINT: ${{ secrets.GAS_LEDGER_ENDPOINT }}
          GAS_LEDGER_TOKEN: ${{ secrets.GAS_LEDGER_TOKEN }}
        run: |
          if [ -n "$GAS_LEDGER_ENDPOINT" ] && [ -n "$GAS_LEDGER_TOKEN" ]; then
            printf 'window.MIKATA_LEDGER={endpoint:"%s",token:"%s"};\n' \
              "$GAS_LEDGER_ENDPOINT" "$GAS_LEDGER_TOKEN" > site/assets/ledger-config.js
            echo "ledger config injected"
          else
            echo "GAS ledger secrets not set; ledger disabled"
          fi

      - name: Prepare Pages artifact(ノビシロは掲載未承認のため除外)
        # 配色・連絡先が未確定、小柳さんの掲載決裁前(絶対ルール5)。
        # 詳細: docs/superpowers/plans/2026-07-25-gajumaru-site-skeleton.md
        # 掲載承認が出たらこのステップを削除するだけで公開対象に戻る。
        run: |
          rm -rf /tmp/pages-deploy
          cp -r site /tmp/pages-deploy
          rm -rf /tmp/pages-deploy/nobishiro

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages-deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 出荷ゲート(運用規程1-3)。LINE配信の下書きは人がコピペして配信するため、
  # 生成器が下書きの先頭に警告を入れる(人向け)のに加えて、ここでCIを赤くする(気づき用)。
  # 別ジョブにしているのは、文面の違反でデータ取得・サイト公開まで巻き添えにしないため。
  shipping-gate:
    needs: fetch-and-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # 上のジョブがコミットした最新の下書きを見る

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: LINE配信下書きの出荷ゲート検査
        run: |
          python scripts/shipping_gate.py --self-test
          python scripts/shipping_gate.py --check-group line
