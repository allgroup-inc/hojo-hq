name: update-subsidies

on:
  schedule:
    # JSTで 03:00 / 09:00 / 15:00 / 21:00 の1日4回(cronはUTC)
    - cron: "0 18,0,6,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch jGrants data
        run: python scripts/fetch_jgrants.py

      - name: Fetch local (自治体) data
        # 守り部審査済み(docs/守り部審査記録.md)。沖縄県・産業振興公社・那覇市を追加収集しマージ
        run: python scripts/fetch_local.py

      - name: Generate LINE deadline alerts
        # 締切7日以内の制度からLINE配信下書きを自動生成(配信は人が実行)
        run: python scripts/generate_line_alerts.py

      - name: Install image deps (Noto CJK fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          pip install pillow

      - name: Generate SNS posts
        # posts/launch/*.md を再生成。画像のCTA件数(ライブ取得)と大見出し件数(md由来)を
        # 常に同一データで揃えるため、必ず画像生成の直前に実行する。
        run: python scripts/generate_sns.py

      - name: Generate post images
        # posts/launch/*.md の文言をブランド画像(posts/images/*.png)に焼き込み
        run: python scripts/generate_images.py

      - name: Generate story image (縦型1080x1920)
        # 締切アラート(line_alerts.json)から毎日のストーリーズ画像を生成
        run: python scripts/generate_story.py

      - name: Record KGI (LINE友だち数の日次記録)
        # KGI実測値をリポジトリに蓄積(未接続・集計待ちも状態を明記)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python scripts/record_kgi.py

      - name: Record もらいわすれ堂 IGフォロワー数(❸)
        # トークン未登録でも graceful に終了0(状態を明記)。--set で手動記録も可。
        env:
          MORADOU_IG_USER_ID: ${{ secrets.MORADOU_IG_USER_ID }}
          MORADOU_IG_TOKEN: ${{ secrets.MORADOU_IG_TOKEN }}
        run: python scripts/record_ig_followers.py

      - name: Commit updated data
        run: |
          git config user.name "hojo-hq-bot"
          git config user.email "bot@en-life.co.jp"
          git add data/subsidies.json data/line_alerts.json data/kpi posts/launch posts/images posts/line
          git diff --cached --quiet || git commit -m "auto: update subsidies & images $(date '+%Y-%m-%d %H:%M')"
          # 実行中に他のpushが入っても落ちないようrebaseしてからpush(最大3回)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i"; sleep 5
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Copy data into site
        run: cp -r data site/data

      - name: Inject ledger config (基準❺)
        # 企業台帳の送信先URL・トークンはGitHub Secretsのみが持つ(公開リポジトリに置かない)。
        # commitステップの後に注入するため、リポジトリ上のファイルは常に空設定のまま。
        # Secrets未登録の間は空のままデプロイされ、台帳送信は無効(サイトは通常動作)。
        env:
          GAS_LEDGER_ENDPOINT: ${{ secrets.GAS_LEDGER_ENDPOINT }}
          GAS_LEDGER_TOKEN: ${{ secrets.GAS_LEDGER_TOKEN }}
        run: |
          if [ -n "$GAS_LEDGER_ENDPOINT" ] && [ -n "$GAS_LEDGER_TOKEN" ]; then
            printf 'window.MIKATA_LEDGER={endpoint:"%s",token:"%s"};\n' \
              "$GAS_LEDGER_ENDPOINT" "$GAS_LEDGER_TOKEN" > site/assets/ledger-config.js
            echo "ledger config injected"
          else
            echo "GAS ledger secrets not set; ledger disabled"
          fi

      - name: Prepare Pages artifact(ノビシロは掲載未承認のため除外)
        # 配色・連絡先が未確定、小柳さんの掲載決裁前(絶対ルール5)。
        # 詳細: docs/superpowers/plans/2026-07-25-gajumaru-site-skeleton.md
        # 掲載承認が出たらこのステップを削除するだけで公開対象に戻る。
        run: |
          rm -rf /tmp/pages-deploy
          cp -r site /tmp/pages-deploy
          rm -rf /tmp/pages-deploy/nobishiro

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages-deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
