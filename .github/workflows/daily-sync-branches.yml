name: Daily Sync Feature Branches with Main

on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 UTC (15時 JST)
    - cron: '0 12 * * *'  # 12:00 UTC (21時 JST) — 冗長性のため1日2回
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Claude Automation"
          git config user.email "noreply@anthropic.com"

      - name: Sync feature branch with main
        id: sync_check
        run: |
          git fetch origin main

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          IS_FEATURE_BRANCH=false

          # Claude feature branches detection (improved pattern matching)
          if [[ "$BRANCH" =~ ^claude/ ]] || [[ "$BRANCH" == *"-axxs6v" ]]; then
            IS_FEATURE_BRANCH=true
          fi

          if [ "$IS_FEATURE_BRANCH" = true ]; then
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "Syncing $BRANCH with main..."

            # main との差分をチェック
            COMMITS_BEHIND=$(git rev-list --count HEAD..origin/main)
            echo "commits_behind=$COMMITS_BEHIND" >> $GITHUB_OUTPUT

            if [ "$COMMITS_BEHIND" -gt 0 ]; then
              echo "Branch is $COMMITS_BEHIND commits behind main. Syncing..."

              # 全コンフリクトを main の版で上書き
              git merge origin/main --no-edit -X theirs

              # 生成ファイルの必須チェック（複数層の検証）
              VALIDATION_FAILED=0

              if [[ -d "site/fukugiiro" ]]; then
                # 基盤ページの検証
                for file in "site/fukugiiro/index.html" "site/fukugiiro/shindan/index.html"; do
                  if [ ! -f "$file" ]; then
                    echo "❌ ERROR: $file is missing after merge!"
                    VALIDATION_FAILED=1
                  elif [ ! -s "$file" ]; then
                    echo "❌ ERROR: $file is empty!"
                    VALIDATION_FAILED=1
                  else
                    SIZE=$(wc -c < "$file")
                    echo "✅ $file exists (${SIZE} bytes)"
                  fi
                done

                # カテゴリページの検証（各ディレクトリに最低1つのindex.htmlがあることを確認）
                for category in area kit life; do
                  if [ -d "site/fukugiiro/$category" ]; then
                    COUNT=$(find site/fukugiiro/$category -name "index.html" | wc -l)
                    if [ "$COUNT" -eq 0 ]; then
                      echo "❌ ERROR: No index.html files in $category/"
                      VALIDATION_FAILED=1
                    else
                      echo "✅ $category/ has $COUNT index.html files"
                    fi
                  fi
                done

                if [ "$VALIDATION_FAILED" -eq 1 ]; then
                  echo "validation_status=FAILED" >> $GITHUB_OUTPUT
                  echo "❌ Generated file validation FAILED"
                  exit 1
                fi
              fi

              # コミット・プッシュ
              git commit --amend --no-edit
              git push -u origin "$BRANCH"

              echo "validation_status=SUCCESS" >> $GITHUB_OUTPUT
              echo "✅ Branch synced with main successfully"
            else
              echo "commits_behind=0" >> $GITHUB_OUTPUT
              echo "validation_status=ALREADY_SYNCED" >> $GITHUB_OUTPUT
              echo "✅ Branch is already up to date with main"
            fi
          else
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "is_feature_branch=false" >> $GITHUB_OUTPUT
            echo "Skipping: not a feature branch (current: $BRANCH)"
          fi

      - name: Notify Slack on failure (if configured)
        if: failure()
        continue-on-error: true
        run: |
          BRANCH="${{ steps.sync_check.outputs.branch }}"
          COMMITS_BEHIND="${{ steps.sync_check.outputs.commits_behind }}"
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "⚠️  SLACK_WEBHOOK_URL not configured - skipping Slack notification"
            echo "Fallback: GitHub Issue will be created instead"
          else
            curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-Type: application/json' \
              -d "{
                \"text\": \"🚨 Daily Sync Workflow Failed\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*🚨 Daily Sync Workflow Failed*\n\n*Branch:* \`$BRANCH\`\n*Commits Behind:* $COMMITS_BEHIND\n*Repository:* ${{ github.repository }}\n*Action:* <$WORKFLOW_URL|View Details>\"
                    }
                  }
                ]
              }"
          fi

      - name: Create GitHub Issue as fallback (if Slack not configured)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.sync_check.outputs.branch }}';
            const commitsBehind = '${{ steps.sync_check.outputs.commits_behind }}';
            const validationStatus = '${{ steps.sync_check.outputs.validation_status }}';
            const workflowUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Daily Sync Failed: ' + branch,
              body: 'Branch: ' + branch + '\nCommits Behind: ' + (commitsBehind || 'unknown') + '\nValidation: ' + (validationStatus || 'unknown') + '\n\nWorkflow Run: ' + workflowUrl + '\n\nThis issue was auto-created because Slack webhook is not configured.',
              labels: ['diagnosis-page', 'automated', 'sync-failure']
            });

            console.log('Created issue #' + issue.data.number)
