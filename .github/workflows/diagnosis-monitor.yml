name: diagnosis-monitor

# もらいわすれ堂の診断ページ(moradou.jp/shindan/)を15分ごとに実ブラウザで検査する。
# 議事: docs/議事_20261103_診断ページ15分監視.md / 検査本体: scripts/diagnosis_monitor.mjs
#
# 通知(Issue を状態の正本にする。LINEは状態が変わったときだけ送る):
#   初めて異常 → Issue起票+LINE / 同じ症状が続く → 何もしない / 症状が変わった → 追記+LINE
#   4時間以上続く → 追記+LINE(1回だけ) / 正常に戻った → 追記してクローズ+LINE
# 監視そのものの停止は diagnosis-monitor-watchdog.yml が見る。

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  # 検査本体・診断ページを変えたら、ローカル配信で自己テストする(本番には触れない)
  pull_request:
    paths:
      - "scripts/diagnosis_monitor.mjs"
      - "tests/diagnosis_monitor.test.mjs"
      - ".github/workflows/diagnosis-monitor.yml"
      - "site/fukugiiro/shindan/**"
  push:
    branches: [main]
    paths:
      - "scripts/diagnosis_monitor.mjs"
      - "tests/diagnosis_monitor.test.mjs"
      - ".github/workflows/diagnosis-monitor.yml"
      - "site/fukugiiro/shindan/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnosis-monitor-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'live' || github.ref }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: "1.56.1"

jobs:
  selftest:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: 自己テスト(正常系が通り、異常系がそれぞれ固有の理由で落ちること)
        run: node --test tests/diagnosis_monitor.test.mjs

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Check diagnosis page
        env:
          DIAG_URL: "https://moradou.jp/shindan/"
        run: node scripts/diagnosis_monitor.mjs

      - name: Update incident issue
        id: state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # LINE公式アカウントの無料枠(月200通)は顧客向けの締切アラートと共用。異常と復旧を
          # 繰り返す(フラッピング)ときに枠を食い尽くさないよう、この監視からは24時間で6通まで
          LINE_DAILY_CAP: "6"
        run: |
          set -euo pipefail
          label=diagnosis-monitor
          gh label create "$label" --color B60205 \
            --description "もらいわすれ堂 診断ページの15分監視" 2>/dev/null || true
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issues_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues"
          now=$(date -u +%s)

          if [ -f diagnosis_monitor_result.json ]; then
            ok=$(jq -r '.ok' diagnosis_monitor_result.json)
            sig=$(jq -r '.signature' diagnosis_monitor_result.json)
          else
            # 検査を始める前に落ちた(Playwright導入失敗など)。診断ページの状態は不明
            ok=false
            sig=MONITOR_SETUP
            echo "監視の準備で失敗し、診断ページを検査できませんでした。Actionsログを確認してください。" > diagnosis_monitor_report.txt
          fi

          # 直近24時間に送った通数(Issue本文・コメントの <!-- notified: 秒 --> を数える)
          sent=$(gh issue list --label "$label" --state all --limit 30 --json body,comments \
            | jq --argjson since "$((now - 86400))" \
              '[.[] | (.body, .comments[].body) | scan("<!-- notified: ([0-9]+) -->") | .[0] | tonumber | select(. >= $since)] | length')
          if [ "$sent" -lt "$LINE_DAILY_CAP" ]; then
            mark="<!-- notified: ${now} -->"
          else
            mark="📵 LINE通知は24時間で${LINE_DAILY_CAP}通の上限に達したため、この変化はLINEで送っていません(Issueのみ)。"
          fi
          can_notify() { [ "$sent" -lt "$LINE_DAILY_CAP" ]; }

          issue=$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')
          notify=""
          summary=$(grep -m1 '^ERROR' diagnosis_monitor_report.txt | cut -c1-120 || true)

          if [ "$ok" = "true" ]; then
            if [ -n "$issue" ]; then
              created=$(gh issue view "$issue" --json createdAt --jq .createdAt)
              mins=$(( (now - $(date -u -d "$created" +%s)) / 60 ))
              printf '%s\n✅ 復旧: 診断ページが正常に戻りました(障害の継続 約%s分)。自動クローズします。 %s\n' "$mark" "$mins" "$run_url" > recover.md
              gh issue comment "$issue" --body-file recover.md
              gh issue close "$issue"
              can_notify && notify=$(printf '✅【もらいわすれ堂】診断ページが復旧しました\n障害の継続: 約%s分\n%s/%s' "$mins" "$issues_url" "$issue")
            fi
          else
            {
              echo "<!-- sig: ${sig} -->"
              echo "$mark"
              echo "- 実行: ${run_url}"
              echo ""
              echo '```'
              cat diagnosis_monitor_report.txt
              echo '```'
            } > body.md
            if [ -z "$issue" ]; then
              { echo "自動検知: もらいわすれ堂の診断ページで、利用者が制度を検索できない可能性があります。"; echo ""; cat body.md; } > first.md
              url=$(gh issue create --label "$label" --title "🚨 診断ページ異常: ${sig}" --body-file first.md)
              issue="${url##*/}"
              can_notify && notify=$(printf '🚨【もらいわすれ堂】診断ページ異常\n%s\n%s' "${summary:-$sig}" "$url")
            else
              thread=$(gh issue view "$issue" --json body,comments,createdAt)
              prev=$(echo "$thread" | jq -r '[.body] + [.comments[].body] | map(capture("<!-- sig: (?<s>[^ ]*) -->").s? // empty) | last // ""')
              last_notice=$(echo "$thread" | jq -r '[.body] + [.comments[].body] | map(capture("<!-- (?<m>notified|notify-failed)").m? // empty) | last // ""')
              escalated=$(echo "$thread" | jq '[.comments[].body | select(contains("<!-- escalated -->"))] | length')
              mins=$(( (now - $(date -u -d "$(echo "$thread" | jq -r .createdAt)" +%s)) / 60 ))
              if [ "$sig" != "$prev" ]; then
                { echo "⚠️ 症状が変わりました(${prev} → ${sig})"; echo ""; cat body.md; } > change.md
                gh issue comment "$issue" --body-file change.md
                can_notify && notify=$(printf '⚠️【もらいわすれ堂】診断ページの症状が変わりました\n%s\n%s/%s' "${summary:-$sig}" "$issues_url" "$issue")
              elif [ "$mins" -ge 240 ] && [ "$escalated" = "0" ]; then
                { echo "<!-- escalated -->"; echo "⏰ 異常が4時間以上つづいています(約${mins}分)。"; echo ""; cat body.md; } > esc.md
                gh issue comment "$issue" --body-file esc.md
                can_notify && notify=$(printf '⏰【もらいわすれ堂】診断ページの異常が4時間以上つづいています\n%s\n%s/%s' "${summary:-$sig}" "$issues_url" "$issue")
              elif [ "$last_notice" = "notify-failed" ] && can_notify; then
                # 前回のLINE送信が失敗したまま。届いていない可能性があるので一度だけ送り直す
                printf '%s\n🔁 前回のLINE通知が失敗していたため再送します。 %s\n' "$mark" "$run_url" > resend.md
                gh issue comment "$issue" --body-file resend.md
                notify=$(printf '🔁【もらいわすれ堂】(再送)診断ページの異常がつづいています\n%s\n%s/%s' "${summary:-$sig}" "$issues_url" "$issue")
              else
                echo "同じ症状(${sig})が継続中。Issue #${issue} への追記・通知はしません"
              fi
            fi
          fi

          echo "issue=${issue}" >> "$GITHUB_OUTPUT"
          {
            echo "notify<<__NOTIFY__"
            echo "$notify"
            echo "__NOTIFY__"
          } >> "$GITHUB_OUTPUT"

      # Secrets(LINE_CHANNEL_ACCESS_TOKEN / LINE_ADMIN_USER_ID)未設定の間は自動でスキップされる。
      # 送信に失敗しても後続の記録まで進める(失敗を記録しないと、次回「同じ症状」として再送されない)
      - name: LINE通知(小柳さんへ)
        id: line
        if: always() && steps.state.outputs.notify != ''
        continue-on-error: true
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.LINE_ADMIN_USER_ID }}
          message: ${{ steps.state.outputs.notify }}

      - name: LINE送信の失敗を記録
        if: always() && steps.line.outcome == 'failure' && steps.state.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.state.outputs.issue }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE" --body "<!-- notify-failed -->
          ⚠️ LINE通知の送信に失敗しました(通数の上限・トークン失効など)。異常が続いていれば次回の監視で再送します。 ${run_url}"
          echo "::error::LINE通知の送信に失敗しました"
          exit 1
