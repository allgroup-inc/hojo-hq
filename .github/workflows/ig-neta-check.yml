# IG投稿案が「断定してよいことだけを断定しているか」を検査する。
#
# 2026-09-24 遥さんの指摘で新設。9月8日に作った案「奨学給付金の申請は9月30日まで」を
# 9月21日に渡したが、沖縄県の公式ページでは9月17日に期限が10月30日へ延長されていた。
# 調べると、その日付は照合済みDB由来ですらなく、一度も照合を通っていなかった。
# さらに ig_neta.json は生成元スクリプトが無い手置きファイルで、原文が変わっても
# 永久に気づけない状態だった。
name: ig-neta-check
on:
  push:
    branches: [main]
    paths:
      - "data/fukugiiro/ig_neta.json"
      - "data/fukugiiro/seido.json"
      - "scripts/check_ig_neta.py"
      - ".github/workflows/ig-neta-check.yml"
  pull_request:
    paths:
      - "data/fukugiiro/ig_neta.json"
      - "scripts/check_ig_neta.py"
      - ".github/workflows/ig-neta-check.yml"
  schedule:
    # 月曜の投稿案を送る前に、出典ページと突き合わせる(月曜 7:00 JST = 日曜 22:00 UTC)
    - cron: "0 22 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-neta-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 履歴監査が git log をさかのぼるので、浅いクローンにしない。
      # 既定(depth=1)だと最新1件だけを全履歴として報告してしまう(2026-09-24 実際に発生)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 検査そのものの自己テスト
        run: python scripts/check_ig_neta.py --self-test

      # 断定された日付・金額に照合の裏づけがあるか(通信なし)
      - name: 裏づけの検査
        run: python scripts/check_ig_neta.py

      # 出典ページを実際に取得して、断定した日付がいまもそこに書いてあるか。
      # 取得失敗は誤りとみなさない(通信失敗は掲載が誤っている証拠ではない)。
      - name: 投稿実績台帳の自己テスト
        run: python scripts/record_ig_post.py --self-test

      - name: 過去に渡した案の照合状況(履歴監査)の自己テスト
        run: python scripts/audit_ig_history.py --self-test

      # 出典ページを実際に取得して確かめる。取得失敗は誤りとみなさない。
      - name: 出典ページとの突き合わせ
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_ig_neta.py --online

      # 過去に渡した案が、いまの公式情報と食い違っていないかを調べて記録に残す。
      # 遥さんの指摘「すでに公開されている投稿に古い情報が残っていないか」への回答。
      - name: 過去に渡した案を出典と突き合わせて記録
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/audit_ig_history.py --online \
            --md docs/点検_IG投稿済みの照合状況.md
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "hojo-hq-bot"
            git config user.email "bot@users.noreply.github.com"
            git add docs/点検_IG投稿済みの照合状況.md
            git diff --cached --quiet && { echo "[info] 差分なし"; exit 0; }
            git commit -m "auto: 過去に渡したIG投稿案の照合状況を更新 $(date -u '+%Y-%m-%d')"
            git push || echo "::warning::pushできませんでした(記録はログに残っています)"
          fi
