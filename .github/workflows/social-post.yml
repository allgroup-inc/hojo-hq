name: social-post

# SNS自動投稿(議事_20260730 議題2)。月・水・金 10:05 JST に1本投稿。
# 素材は update.yml が毎日再生成する posts/(締切3層ルール準拠)をそのまま使う。
# Meta Secrets未設定の間は「未接続」と明記してスキップ(グリーンのまま)。
# 運用ルール: 週1回、直近投稿3本を人が抜き取り点検(三名体制ルール5)。

on:
  schedule:
    # JST 月水金 10:05(= UTC 1:05)。09:00 JSTのデータ更新・画像再生成の後。
    - cron: "5 1 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Post to Facebook / Instagram
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/post_social.py

      - name: LINE通知(失敗時・小柳さんへ)
        if: failure()
        uses: ./.github/actions/line-notify
        with:
          channel-access-token: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          to-user-id: ${{ secrets.LINE_ADMIN_USER_ID }}
          message: |
            🚨【ミカタ】SNS自動投稿が失敗しました
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
