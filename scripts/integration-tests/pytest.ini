[pytest]
# Pytest configuration for Block 2 integration tests

minversion = 7.0
python_files = test_*.py *_test.py *_tests.py
testpaths = .
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Marker definitions
markers =
    integration: integration test
    performance: performance test (requires load simulation)
    business_axis: business axis connectivity test (❶❂❸)
    smoke: smoke test (basic functionality)
    slow: slow test
    requires_server: requires running API server

# Test discovery
python_classes = Test*
python_functions = test_*

# Coverage
# Generate coverage report: pytest --cov=scripts/integration-tests --cov-report=html
[coverage:run]
source = scripts/integration-tests
omit =
    */conftest.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
