<meta name="apple-mobile-web-app-title" content="家計のポっ">
<style>
/* v2.0 設計方針(2026-08-14 小柳さん): 白基調・余白8/16/32/64・ブランド色#F6C83Eは
   送信ボタン/フォーカス枠/現在地メニューの3箇所のみ・グラデーション禁止 */
:root{--brand:#F6C83E;--ink:#1A1A1A;--sub:#6B6B6B;--line:#E8E8E8;--bad:#D64533}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#FFFFFF}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;background:#FFFFFF;color:var(--ink);font-size:14px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);background:#FFFFFF;position:sticky;top:0;z-index:20}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logoimg{flex:none;width:32px;height:32px;border-radius:999px;object-fit:contain}
.logomark{flex:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
header h1{font-size:15px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:4px}
header h1 span{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#B23C06;font-size:15px;font-weight:700;letter-spacing:-.06em}
.brandsub{font-size:10px;color:var(--sub);letter-spacing:.06em}
.seg{display:flex;gap:8px}
.seg button{border:0;background:none;color:var(--sub);padding:10px 8px 8px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;min-height:44px}
.seg button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--brand)}
.toolbar{display:flex;align-items:center;gap:8px;margin-top:16px}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1}
.chip{flex:none;border:1px solid var(--line);background:#FFFFFF;color:var(--ink);border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.btn-new{flex:none;margin-left:auto;border:1px solid var(--ink);background:#FFFFFF;color:var(--ink);border-radius:6px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px}
.summary{margin-top:16px;color:var(--sub);font-size:12px}
.summary b{color:var(--ink);font-size:14px}
.summary .unconf b{color:var(--bad)}
main{margin-top:16px;padding-bottom:64px}
main.dim{opacity:.45;pointer-events:none}
.daylabel{margin-top:32px;margin-bottom:8px;font-size:12px;color:var(--sub);font-weight:700}
.row{display:flex;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#FAFAFA}
.row .time{flex:none;width:52px;font-weight:700;font-variant-numeric:tabular-nums}
.row .time small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.row .main{flex:1;min-width:0}
.row .cust{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .owner{flex:none;width:72px;font-size:12px;color:var(--sub);text-align:left}
.row .meta .t{display:inline-block;min-width:14px}
.row .meta .t.hot{color:var(--ink);font-weight:700}
.row .st{flex:none;width:112px;font-size:12px;text-align:right;color:var(--sub)}
.row .st small{display:block;font-size:11px;opacity:.75}
.row .st.signed{color:var(--ink);font-weight:700}
.row .st.cancel{color:var(--bad)}
.row.done{opacity:.55}
.empty{color:var(--sub);padding:32px 0;font-size:13px}
/* 今日やること(要対応)・空き枠 */
.attn{margin-top:16px;border:1px solid var(--line);border-radius:6px;padding:16px}
.attn h3{font-size:13px;font-weight:700;margin-bottom:8px}
.attn h3 span{color:var(--bad)}
.attn .none{color:var(--sub);font-size:12px}
.arow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.arow:hover{background:#FAFAFA}
.arow .tag{flex:none;font-size:11px;font-weight:700;color:var(--bad)}
.arow .when{flex:none;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

.sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.sheet button.strong{font-weight:700;border-color:var(--ink)}

.sheet .footrow{margin-top:32px;display:flex;gap:16px}

<script>
/* アポ管理台帳 シート構成の定義(スキーマ)
 * ブラウザ相当のGAS(global.ApoSchema)とNode(module.exports)の両方で動くUMD形式。
 * Node側は tests/apo_kanri_schema.test.mjs で検証される。
 *
 * glow-ma(M&A台帳)とは完全に別のシステム。glow-ma のシート・コードを参照してはならない
 * (設計書 2026-08-14 三名体制裁定②)。
 */
(function (global) {
  "use strict";

  var STAFF_SHEET_NAME = "スタッフ";
  // Slack User ID の調べ方: Slackで対象社員のプロフィールを開き「その他」→
  // 「メンバーIDをコピー」(U から始まる文字列)。メールアドレスではない。
  var STAFF_HEADERS = ["氏名", "Slack User ID", "有効", "メールアドレス", "役割"];
  var STAFF_ROLES = ["アポ入れ", "営業", "両方"];

  var APPOINTMENT_SHEET_NAME = "アポ予定";
  // 列を追加する場合は必ず配列の末尾に追加すること(既存データの列位置がズレて破損するため、
  // 途中への挿入は禁止)。読み書きはヘッダー名ではなく配列の並び順(位置)に依存する。
  var APPOINTMENT_HEADERS = [
    "アポID", "日付", "開始時刻", "所要分", "顧客名", "形式", "場所またはURL",
    "担当営業", "アポ入れ担当", "温度感", "ステータス", "メモ",
    "登録日時", "最終更新日時",
    // 名寄せキー。**当面の保存はアセンドの顧客id**(2026-08-21 軸の裁定①)。
    // KM-000001 は名寄せの親統合で採番が動くため、確定前に焼き付けると全部ずれる。
    // KM- は読み取り時に resolve API で引き、カットオーバーで焼き付けてから不変にする。
    // **フォームには出さない**(営業に手入力させない=タップを増やさない)。
    // 自動連携(❶または❸からの登録)が通るまでは空のまま。
    "顧客ID",
    // 差し戻しの理由(顧客都合/自社都合)。ステータスは共通語彙のまま、理由は属性で持つ
    // (2026-08-21 軸の裁定③)。自社都合は「他の見込み客に使えたはずの訪問枠を捨てた」
    // 最も高くつく損失であり、顧客都合と混ぜると見えなくなるため必ず分ける。
    // **人事評価に使わないこと**(使われると全部「顧客都合」になり項目が嘘になる)。
    "差し戻し理由"
  ];
  // ※アポ種別(再訪/新規紹介/新規ご家族)と紹介元は、リードがどこから来たかの属性であり
  //   「対面営業マン物件管理システム」の領分。本システムは予定を回すことに専念する
  //   (2026-08-19 小柳さん指摘で撤去。引き渡し: docs/連携メモ_20260819_対面営業マン物件管理システム.md)
  var APPOINTMENT_FORMATS = ["訪問", "来店", "オンライン"];
  var TEMPERATURES = ["高", "中", "低"];

  /* ステータスは5システム共通語彙。言い換え禁止(共通の約束【4】)。
   * 旧語彙からの読み替え(2026-08-21 軸の裁定②③で移行。本番未投入のためデータ移行は不要):
   *   予定 / 再調整中          → スケジュール調整中
   *   確定                     → アポ確定
   *   実施済                   → 訪問済(❸が持つ。❷は読むだけ)
   *   申込み                   → 申込(❹が持つ。❷は読むだけ)
   *   キャンセル(顧客都合)   → 差し戻し + 差し戻し理由「顧客都合」
   *   キャンセル(自社都合)   → 差し戻し + 差し戻し理由「自社都合」
   */

  // ❷(このシステム)が書き換えてよいステータス。
  // 差し戻し=訪問に至らず❶へ返却。対象外=架電禁止・アポ禁(持ち場と無関係に最優先)。
  var OWNED_STATUSES = ["スケジュール調整中", "アポ確定", "差し戻し", "対象外"];
  // ❸❹が持つステータス。❷は**読むだけ**(2026-08-21 軸の裁定②:
  // 「持つ(書き換える)」と「見る(読む)」は別物。共通仕様が禁じているのは書き換え)。
  var HANDED_OFF_STATUSES = ["訪問済", "追客中", "申込", "成立", "保全中"];
  var APPOINTMENT_STATUSES = [
    "スケジュール調整中", "アポ確定",
    "訪問済", "追客中", "申込", "成立", "保全中",
    "差し戻し", "対象外"
  ];
  var RETURN_REASONS = ["顧客都合", "自社都合"];
  /* 訪問枠が空くステータス。差し戻し=❶へ返却、対象外=架電禁止/アポ禁。
   * これ以外(調整中を含む)は枠を押さえている扱い。調整の途中で他アポに枠を取られると
   * 調整そのものが破綻するため、流れたら差し戻しにして明示的に空ける。 */
  var SLOT_FREED_STATUSES = ["差し戻し", "対象外"];

  /* ❷から訪問結果(訪問済/申込 等)を書き換えられるかの切替。
   * 軸の裁定②は「編集不可にする」。ただし**❸からの結果連携が通るまで禁止にすると、
   * 誰も結果を入れられずファネルが真っ暗になる**ため、連携が通るまでは "許可"。
   * ❸連携の実装と同じリリースで "禁止" に倒す(それが裁定の完成形)。
   */
  var RESULT_INPUT_MODE = "許可";

  var HISTORY_SHEET_NAME = "変更履歴";
  var HISTORY_HEADERS = ["履歴ID", "アポID", "日時", "操作者", "操作", "変更内容"];

        var start = timeToMinutes_(record["開始時刻"]);
        if (start === null) return false;
        var end = start + (Number(record["所要分"]) || 60);
        return start < windowEnd && windowStart < end;
      });
      if (isBusy) return;
      var before = null;
      var after = null;
      mine.forEach(function (record) {
        var start = timeToMinutes_(record["開始時刻"]);
        if (start === null) return;
        if (start < windowStart) {
          if (!before || start > timeToMinutes_(before["開始時刻"])) before = record;
        } else {
          if (!after || start < timeToMinutes_(after["開始時刻"])) after = record;
        }
      });
      candidates.push({ owner: owner, before: before, after: after });
    });

    return candidates.sort(function (a, b) {
      var aField = (a.before || a.after) ? 0 : 1;

  var IMMINENT_DAYS = 2;

  /**
   * 「今日やること」= 手当てが要るアポの一覧(2026-08-21 追加)。

   * 頼らず浮上させることが目的(共通の前提【4】)。
   * options: { today: "yyyy-MM-dd", now: "HH:mm", owner: 絞り込む担当営業名 }
   *
   * 種別と並び順(緊急な順):
   *   result  結果が入っていない(訪問したのか差し戻しか分からない = 最も埋もれる)
   *   overlap 同じ営業の時間が重なっている
   *   unconfirmed 訪問日が迫っているのにスケジュール調整中のまま
   *   place   訪問・来店なのに行き先が空のまま訪問日が迫っている

  function buildAttentionList(appointments, options) {
    var opts = options || {};
    var today = opts.today || "";
    var nowMinutes = timeToMinutes_(opts.now || "23:59");
    /* シート全体ではなく、手当てが要りうる期間だけを見る。台帳は日々増え続けるので、
       全行を毎回走査すると画面を開くたびに遅くなる(共通の前提【6】待たせない)。 */
    var live = validAppointments_(appointments).filter(function (record) {
      if (slotFreed_(record["ステータス"])) return false;
      if (opts.owner && record["担当営業"] !== opts.owner) return false;
      if (!today) return true;
      var days = diffDays_(today, normalizeDateString(record["日付"]));
      return days >= -RESULT_LOOKBACK_DAYS;
    });
    // 重なりの照合は総当たりになるため、まだ手当てできる未来分だけに絞ってから行う
    var upcoming = live.filter(function (record) {
      return !today || diffDays_(today, normalizeDateString(record["日付"])) >= 0;
    });

    var items = [];
    var seenOverlap = {};
    live.forEach(function (record) {
      var date = normalizeDateString(record["日付"]);
      var days = today ? diffDays_(today, date) : 0;
      var status = record["ステータス"];
      var start = timeToMinutes_(record["開始時刻"]);
      var end = start === null ? null : start + (Number(record["所要分"]) || 60);

      // 1. 結果が入っていない(訪問時間が終わって猶予も過ぎたのに、まだ❷の持ち場のまま)
      var isPending = ["スケジュール調整中", "アポ確定"].indexOf(status) !== -1;

        nowMinutes >= end + RESULT_GRACE_MINUTES);

          reason: days === 0 ? "本日の訪問時間が終わっています"

      }
      if (days < 0) return; // 過去のアポで結果待ち以外は手当てのしようがない

      // 2. 担当営業が空(通知先が決まらない。フォームでは必須だがシート直接編集で起きうる)
      if (!record["担当営業"]) {
        items.push({ kind: "owner", apo: record, reason: "通知が誰にも届きません" });
        return;
      }
      // 3. 訪問日が迫っているのに未確定
      if (status === "スケジュール調整中" && days <= IMMINENT_DAYS) {
        items.push({ kind: "unconfirmed", apo: record,
          reason: days === 0 ? "本日です" : days + "日後です" });
        return;
      }
      // 4. 行き先が空(オンラインは場所が要らないので対象外)
      if (record["形式"] !== "オンライン" && !record["場所またはURL"] && days <= IMMINENT_DAYS) {
        items.push({ kind: "place", apo: record,
          reason: days === 0 ? "本日なのに行き先が空です" : "行き先が空です" });
      }
    });

    // 5. 時間の重なり(両方のアポを1組として1回だけ出す)。
    // すでに始まってしまった重なりは手当てのしようがないので出さない
    // (出すと「もう終わったこと」で一覧が埋まり、直せるものが埋もれる)
    upcoming.forEach(function (record) {
      var recordDays = today ? diffDays_(today, normalizeDateString(record["日付"])) : 0;
      var recordStart = timeToMinutes_(record["開始時刻"]);
      if (recordDays === 0 && recordStart !== null && recordStart <= nowMinutes) return;
      detectOverlap(upcoming, record).forEach(function (other) {
        var pair = [record["アポID"], other["アポID"]].sort().join("|");
        if (seenOverlap[pair]) return;
        seenOverlap[pair] = true;
        items.push({ kind: "overlap", apo: record,
          reason: other["開始時刻"] + " " + other["顧客名"] + " と重なっています" });
      });
    });

    var order = { result: 0, overlap: 1, unconfirmed: 2, place: 3, owner: 4 };
    return items.sort(function (a, b) {
      if (order[a.kind] !== order[b.kind]) return order[a.kind] - order[b.kind];
      var da = normalizeDateString(a.apo["日付"]);
      var db = normalizeDateString(b.apo["日付"]);
      if (da !== db) return da < db ? -1 : 1;
      return normalizeTimeString(a.apo["開始時刻"]) < normalizeTimeString(b.apo["開始時刻"]) ? -1 : 1;
    });
  }

  /**
   * 埋まっていない訪問枠(2026-08-21 追加)。営業ごとに、営業時間の中で
   * minGapMinutes 以上つながっている空き時間を返す。アポ入れ担当が
   * 「誰の・いつなら入れられるか」を探さずに見られるようにするためのもの。
   * options: { days: 何日分, minGapMinutes: 何分以上を空きとみなすか }
   */
  function buildOpenSlots(appointments, startDateString, salesStaffNames, options) {
    var opts = options || {};
    var days = opts.days || 7;
    var minGap = opts.minGapMinutes || 90;
    var dayStart = timeToMinutes_(WORKDAY_START);
    var dayEnd = timeToMinutes_(WORKDAY_END);
    var booked = validAppointments_(appointments).filter(function (record) {
      return BOOKED_STATUSES.indexOf(record["ステータス"]) !== -1;
    });

    var result = [];
    for (var d = 0; d < days; d++) {
      var date = addDays_(startDateString, d);
      var slots = [];
      (salesStaffNames || []).forEach(function (owner) {
        var spans = booked.filter(function (record) {
          return record["担当営業"] === owner && normalizeDateString(record["日付"]) === date;
        }).map(function (record) {
          var start = timeToMinutes_(record["開始時刻"]);
          return start === null ? null
            : { start: start, end: start + (Number(record["所要分"]) || 60) };
        }).filter(Boolean).sort(function (a, b) { return a.start - b.start; });

        var cursor = dayStart;
        spans.forEach(function (span) {
          if (span.start - cursor >= minGap) {
            slots.push({ owner: owner, from: minutesToTime_(cursor), to: minutesToTime_(span.start),
              minutes: span.start - cursor, allDay: false });
          }
          cursor = Math.max(cursor, span.end);

        if (dayEnd - cursor >= minGap) {
          slots.push({ owner: owner, from: minutesToTime_(cursor), to: minutesToTime_(dayEnd),
            minutes: dayEnd - cursor, allDay: cursor === dayStart });

      });
      // 全員が終日空いている日は、人数分のチップを並べても情報が増えない。
      // 1行にたたむ(見るものが多い日とそうでない日に差が付かないと、読み飛ばされる)
      var names = (salesStaffNames || []);
      var allOpen = names.length > 0 && names.every(function (owner) {
        return slots.some(function (slot) { return slot.owner === owner && slot.allDay; });
      });
      result.push({ date: date, slots: slots, allOpen: allOpen });
    }
    return result;
  }

  function minutesToTime_(minutes) {
    return pad2_(Math.floor(minutes / 60)) + ":" + pad2_(minutes % 60);
  }

  var api = {
    generateApoId: generateApoId,
    buildAttentionList: buildAttentionList,
    buildOpenSlots: buildOpenSlots,
    normalizeDateString: normalizeDateString,
    normalizeTimeString: normalizeTimeString,
    sortAppointments: sortAppointments,
    buildDayView: buildDayView,
    buildWeekView: buildWeekView,
    detectOverlap: detectOverlap,
    buildDelayTargets: buildDelayTargets,
    buildChangeDiff: buildChangeDiff,
    buildFillStats: buildFillStats,
    buildConversionStats: buildConversionStats,
    buildTemperatureStats: buildTemperatureStats,
    buildSubstituteCandidates: buildSubstituteCandidates
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  } else {
    global.ApoCore = api;
  }
})(typeof window !== "undefined" ? window : globalThis);

/* アポ管理台帳 Slack通知文面ビルダー
 * ブラウザ相当のGAS(global.ApoNotify)とNode(module.exports)の両方で動くUMD形式。
 * Node側は tests/apo_kanri_notify.test.mjs で検証される。
 *
 * 顧客名には敬称を足さない。現場は「サンプル商店 田中様」のように敬称込みで入力するため、
 * こちらで「様」を付けると「田中様様」になる(2026-08-19 リハーサルで検出)。
 * 通知は5種限定(新規・変更・差し戻し・申込・遅れそう)。リマインダー等は作らない
 * (設計書 三名体制裁定④: 通知過多で肝心の遅延通知が埋もれるのを防ぐ)。
 * 文面は通知一覧のプレビューで読み切れるよう、1行目に結論を置く。
 */
(function (global) {
  "use strict";

  function formatMention(slackUserId, fallbackName) {
    if (slackUserId) return "<@" + slackUserId + ">";
    return String(fallbackName || "担当者") + "さん";
  }

  function describeSlot_(apo) {
    return apo["日付"] + " " + apo["開始時刻"] + "〜(" + (apo["所要分"] || 60) + "分)";
  }

  function describePlace_(apo) {
    var place = apo["場所またはURL"] ? " @" + apo["場所またはURL"] : "";
    return apo["形式"] + place;
  }

  function buildNewAppointmentMessage(apo, mention) {
    return "📅 新規アポ " + describeSlot_(apo) + " " + apo["顧客名"] + "\n" +
      "・" + describePlace_(apo) + " / 温度感: " + apo["温度感"] + "\n" +
      "・担当営業: " + mention + "(アポ入れ: " + apo["アポ入れ担当"] + ")";
  }

  function buildChangeMessage(apo, diff, mention) {
    return "🔁 アポ変更 " + apo["顧客名"] + "(" + describeSlot_(apo) + ")\n" +
      "・変更: " + diff + "\n" +
      "・担当営業: " + mention;
  }

  /**
   * 差し戻し(訪問に至らず❶へ返却)の通知。理由(顧客都合/自社都合)を必ず本文に出す。
   * 自社都合は「他の見込み客に使えたはずの訪問枠を捨てた」最も高くつく損失のため、
   * 顧客都合と一目で見分けがつく必要がある(2026-08-21 軸の裁定③)。
   */
  function buildReturnMessage(apo, mention) {
    var reason = apo["差し戻し理由"] ? "(" + apo["差し戻し理由"] + ")" : "(理由未記入)";
    return "❌ 差し戻し" + reason + " " + apo["顧客名"] + "(" + describeSlot_(apo) + ")\n" +
      "・担当営業: " + mention + "(アポ入れ: " + apo["アポ入れ担当"] + ")\n" +
      "・この枠は空きました。❶で組み直しになります";
  }

  function buildSignupMessage(apo, mention) {
    return "🎉 申込 " + apo["顧客名"] + "!\n" +
      "・" + describeSlot_(apo) + " / 担当営業: " + mention;
  }

  /**
   * 遅れそう通知。targets は ApoCore.buildDelayTargets の戻り値(時刻順)。
   * mentionResolver(アポ入れ担当名) → メンション文字列。
   * 後続アポの時刻は変更しない(通知のみ・判断は人間)。
   */
  function buildDelayMessage(salesName, minutes, targets, mentionResolver) {
    var head = "⏰ " + salesName + "さん +" + minutes + "分遅れ見込み";
    if (!targets || targets.length === 0) {
      return head + "\n・本日このあとに影響するアポはありません";
    }
    var lines = targets.map(function (apo) {
      return "・" + apo["開始時刻"] + " " + apo["顧客名"] + " → " +
        mentionResolver(apo["アポ入れ担当"]) + " 調整要否の確認をお願いします";
    });
    return head + "(影響しうる後続アポ " + targets.length + "件)\n" + lines.join("\n");
  }

  var MAX_SUBSTITUTE_LINES = 5;

  function mapsSearchUrl_(place) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(place);
  }

  // Slackのリンク記法 <URL|表示名> は & < > がメタ文字、| はラベル区切り。
  // 自由入力の場所名をそのまま入れると記法が壊れるためエスケープする(2026-08-17レビュー指摘#9)
  function escSlackLabel_(text) {
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/\|/g, "¦");
  }

  function describeAdjacent_(label, record) {
    if (!record) return null;
    var place = record["場所またはURL"] || "";
    var placeText;
    if (record["形式"] === "オンライン" || /^https?:\/\//.test(place)) {
      placeText = "オンライン";
    } else if (place) {
      // 地図はリンクを開くだけで、位置情報は取得しない
      placeText = "<" + mapsSearchUrl_(place) + "|" + escSlackLabel_(place) + ">";
    } else {
      placeText = "場所未記入";
    }
    return label + " " + record["開始時刻"] + " " + placeText;
  }

  /**
   * 差し戻し通知に付ける代打候補セクション(GPSレス版)。
   * candidates は ApoCore.buildSubstituteCandidates の戻り値。表示は最大5名。
   * どの候補に行ってもらうかの判断・連絡は人間が行う(自動アサインはしない)。
   */
  function buildSubstituteSection(candidates) {
    var head = "🧭 代打候補(この時間が空いている営業・前後の場所つき):";
    if (!candidates || candidates.length === 0) {
      return head + "\n・この時間が空いている営業がいません";
    }
    var lines = candidates.slice(0, MAX_SUBSTITUTE_LINES).map(function (candidate) {
      var parts = [
        describeAdjacent_("直前", candidate.before),
        describeAdjacent_("直後", candidate.after)
      ].filter(Boolean);
      var context = parts.length ? parts.join(" / ") : "この日の他アポなし";
      return "・" + candidate.owner + ": " + context;
    });
    return head + "\n" + lines.join("\n");
  }

  var api = {
    formatMention: formatMention,
    buildSubstituteSection: buildSubstituteSection,
    buildNewAppointmentMessage: buildNewAppointmentMessage,
    buildChangeMessage: buildChangeMessage,
    buildReturnMessage: buildReturnMessage,
    buildSignupMessage: buildSignupMessage,
    buildDelayMessage: buildDelayMessage
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  } else {
    global.ApoNotify = api;
  }
})(typeof window !== "undefined" ? window : globalThis);

  };
  window.LockService = {
    getScriptLock: function () { return { tryLock: function () { return true; }, releaseLock: function () {} }; }
  };
  window.Utilities = {
    sleep: function () {},
    formatDate: function (date, tz, pattern) {
      return pattern
        .replace("yyyy", date.getFullYear()).replace("MM", pad2(date.getMonth() + 1))
        .replace("dd", pad2(date.getDate())).replace("HH", pad2(date.getHours()))
        .replace("mm", pad2(date.getMinutes())).replace("ss", pad2(date.getSeconds()));
    }
  };
  window.UrlFetchApp = {
    fetch: function (url, opts) {
      var text = JSON.parse(opts.payload).text;
      window.__demoNotifications.unshift({ at: new Date(), text: text });
      window.__renderDemoNotifications && window.__renderDemoNotifications();
      return { getResponseCode: function () { return 200; } };
    }
  };
  window.Logger = { log: function () {} };
  window.HtmlService = {
    createHtmlOutput: function (html) {
      return { setTitle: function () { return this; }, addMetaTag: function () { return this; } };
    }
  };
  window.ApoPage = { buildApoAppHtml: function () { return ""; } };
})();

</script>
<script>
/**
 * アポ管理コンソール: Web Appランナー(ルーティング・シートI/O・Slack送信)
 *
 * ロジックは持たず、UMDモジュール(ApoSchema / ApoAccess / ApoCore / ApoNotify /
 * ApoPage / ApoResilience)へ委譲する薄い層。Nodeテストの対象外。
 *
 * セットアップ(人間が一度だけ行う):
 * 1. SheetSetup.gs の手順で ensureApoTabs 実行済みであること
 * 2. 「スタッフ」タブに全利用者の 氏名 / Slack User ID / 有効✔ / メールアドレス / 役割 を登録する
 * 3. Slackで通知チャンネル用の Incoming Webhook を発行し、Apps Scriptエディタの
 *    「プロジェクトの設定」→「スクリプト プロパティ」で SLACK_WEBHOOK_URL に設定する
 *    (コードにWebhook URLを直接書かない。未設定時は通知をスキップしログのみ)
 * 4. 「デプロイ」→「新しいデプロイ」→種類「ウェブアプリ」。
 *    次のユーザーとして実行: **「ウェブアプリケーションにアクセスしているユーザー」**
 *    (「自分」にすると Session.getActiveUser().getEmail() が空になり、所有者以外が
 *     全員締め出される。個人Gmail運用での必須設定。2026-08-17 レビュー#1)
 *    アクセスできるユーザー: 「Googleアカウントを持つ全員」
 * 5. デプロイURLをスタッフタブに登録した人へ共有する(スマホのホーム画面に追加推奨)
 *
 * 認証: 個人Gmail運用のためWeb Appのアクセス設定では利用者を限定できない。
 * Session.getActiveUser().getEmail() をスタッフタブと照合する許可リスト方式が唯一の
 * 防御線のため、doGet だけでなく公開関数(末尾 `_` なし)それぞれの冒頭でも
 * requireApoAccess_ を呼ぶ(多層防御。glow-ma 三名体制レビュー2026-08-09と同方式)。
 */

function doGet() {
  if (!isApoStaff_()) {
    return HtmlService.createHtmlOutput(ApoAccess.buildAccessDeniedHtml());
  }
  return HtmlService.createHtmlOutput(ApoPage.buildApoAppHtml())
    .setTitle("家計のポっ")
    .addMetaTag("viewport", "width=device-width, initial-scale=1");
}

function isApoStaff_() {
  var email = Session.getActiveUser().getEmail();
  return ApoAccess.isAllowedEmail(email, readStaffRows_());
}

function requireApoAccess_() {
  if (!isApoStaff_()) {
    throw new Error("この操作を行う権限がありません。");
  }
}

function readStaffRows_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(ApoSchema.STAFF_SHEET_NAME);
  if (!sheet) return [];
  var lastRow = sheet.getLastRow();
  if (lastRow < 2) return [];
  var headers = ApoSchema.STAFF_HEADERS;
  var values = sheet.getRange(2, 1, lastRow - 1, headers.length).getValues();
  var nameIndex = headers.indexOf("氏名");
  var slackIndex = headers.indexOf("Slack User ID");
  var activeIndex = headers.indexOf("有効");
  var emailIndex = headers.indexOf("メールアドレス");
  var roleIndex = headers.indexOf("役割");
  return values
    .filter(function (row) { return row[activeIndex] === true && row[emailIndex]; })
    .map(function (row) {
      return {
        name: row[nameIndex],
        slackUserId: row[slackIndex],
        email: row[emailIndex],
        role: row[roleIndex]
      };
    });
}

/**
 * アポ予定タブの全行をレコード配列で返す。日付・時刻は文字列に正規化する
 * (google.script.run はDateの受け渡しで事故りやすいため、サーバ側で常に文字列化)。
 */
function readAppointments_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(ApoSchema.APPOINTMENT_SHEET_NAME);
  if (!sheet) return [];
  var lastRow = sheet.getLastRow();
  if (lastRow < 2) return [];
  var headers = ApoSchema.APPOINTMENT_HEADERS;
  var values = sheet.getRange(2, 1, lastRow - 1, headers.length).getValues();
  return values.map(function (row) {
    var record = {};
    headers.forEach(function (header, index) { record[header] = row[index]; });
    record["日付"] = ApoCore.normalizeDateString(record["日付"]);
    record["開始時刻"] = ApoCore.normalizeTimeString(record["開始時刻"]);
    record["登録日時"] = String(record["登録日時"] || "");
    record["最終更新日時"] = String(record["最終更新日時"] || "");
    return record;
  });
}

function nowStamp_() {
  return Utilities.formatDate(new Date(), "Asia/Tokyo", "yyyy-MM-dd HH:mm:ss");
}

/**
 * 本日ビュー・週ビュー・スタッフ選択肢をまとめて返す。
 * params: { view: "day"|"week", date: "yyyy-MM-dd", owner: 担当営業名 or "" }
 */
function getBoard(params) {
  requireApoAccess_();
  var options = params || {};
  var date = options.date || ApoCore.normalizeDateString(new Date());
  var owner = options.owner || null;
  var appointments = readAppointments_();
  var staffRows = readStaffRows_();
  var meName = ApoAccess.resolveStaffName(Session.getActiveUser().getEmail(), staffRows);
  var salesStaff = ApoAccess.listSalesStaff(staffRows);
  var today = ApoCore.normalizeDateString(new Date());
  return {
    date: date,
    dayView: ApoCore.buildDayView(appointments, date, owner),
    week: ApoCore.buildWeekView(
      owner
        ? appointments.filter(function (a) { return a["担当営業"] === owner; })
        : appointments,
      date
    ),
    // 「今日やること」。開いた時点で手当てが要るものが出ている状態にする(探させない)
    attention: ApoCore.buildAttentionList(appointments, {
      today: today,
      now: Utilities.formatDate(new Date(), "Asia/Tokyo", "HH:mm"),
      owner: owner
    }),
    // 埋まっていない訪問枠。明日から数えるのは、今日の空きはもう埋められないため
    openSlots: ApoCore.buildOpenSlots(appointments, addDaysString_(today, 1),
      owner ? [owner] : salesStaff, { days: 7, minGapMinutes: 90 }),
    salesStaff: salesStaff,
    meName: meName
  };
}

function addDaysString_(dateString, days) {
  var parts = dateString.split("-").map(Number);
  return ApoCore.normalizeDateString(new Date(parts[0], parts[1] - 1, parts[2] + days));
}

/**
 * 分析タブ用の集計: 本日の埋まり状況(営業別)+過去30日の転換ファネル(チーム全体のみ)。
 * 営業マン別の転換率は評価誤用リスクのため返さない(v1.1三名体制裁定)。
 */
function getStats() {
  requireApoAccess_();
  var appointments = readAppointments_();
  var staffRows = readStaffRows_();
  var today = ApoCore.normalizeDateString(new Date());
  var since = ApoCore.normalizeDateString(new Date(Date.now() - 30 * 24 * 60 * 60 * 1000));
  return {
    date: today,
    sinceDate: since,
    fill: ApoCore.buildFillStats(appointments, today, ApoAccess.listSalesStaff(staffRows)),
    funnel: ApoCore.buildConversionStats(appointments, { sinceDate: since }),
    byTemperature: ApoCore.buildTemperatureStats(appointments, { sinceDate: since })
  };
}

function getFormOptions() {
  requireApoAccess_();
  var staffRows = readStaffRows_();
  return {
    salesStaff: ApoAccess.listSalesStaff(staffRows),
    setterStaff: ApoAccess.listSetterStaff(staffRows),
    formats: ApoSchema.APPOINTMENT_FORMATS,
    temperatures: ApoSchema.TEMPERATURES,
    statuses: ApoSchema.APPOINTMENT_STATUSES
  };
}

/**
 * 新規登録・編集の両方を受ける。ダブルブッキングは警告のみで登録は止めない:
 * confirmedOverlap=false で重複ありなら保存せず警告を返し、画面がもう一度
 * 保存させることで「警告を見たうえでの登録」にする(2度押し確定方式)。
 */
function saveAppointment(payload) {
  requireApoAccess_();
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) {
    throw new Error("他の操作が実行中のため保存できませんでした。少し待ってからもう一度お試しください。");
  }
  try {
    var appointments = readAppointments_();
    var overlaps = ApoCore.detectOverlap(appointments, payload);
    if (overlaps.length > 0 && !payload.confirmedOverlap) {
      return {
        ok: false,
        overlapWarning: overlaps.map(function (apo) {
          return { "開始時刻": apo["開始時刻"], "顧客名": apo["顧客名"] };
        })
      };
    }

    var staffRows = readStaffRows_();
    var operator = ApoAccess.resolveStaffName(Session.getActiveUser().getEmail(), staffRows);
    var salesStaff = ApoAccess.findStaffByName(payload["担当営業"], staffRows);
    var mention = ApoNotify.formatMention(salesStaff && salesStaff.slackUserId, payload["担当営業"]);

    if (payload["アポID"]) {
      var oldRecord = findAppointmentById_(appointments, payload["アポID"]);
      if (!oldRecord) throw new Error("対象のアポが見つかりません: " + payload["アポID"]);
      var diff = ApoCore.buildChangeDiff(oldRecord, payload);
      updateAppointmentRow_(payload, oldRecord);
      var notified = false;
      if (diff) {
        appendHistory_(payload["アポID"], operator, "変更", diff);
        var message = buildStatusAwareMessage_(payload, oldRecord["ステータス"], diff, mention);
        // 差し戻しで枠が空いたら、代打候補(GPSレス・2026-08-14決裁)を通知に添える。
        // 位置情報は取得せず、前後アポの場所を提示するだけ。行かせる判断・連絡は人間が行う
        if (payload["ステータス"] === "差し戻し" && oldRecord["ステータス"] !== "差し戻し") {
          message += "\n" + ApoNotify.buildSubstituteSection(
            ApoCore.buildSubstituteCandidates(appointments, payload, ApoAccess.listSalesStaff(staffRows)));
        }
        notified = notifySafely_(payload["アポID"], operator, "変更", message);
      }
      return { ok: true, apoId: payload["アポID"], notified: notified };
    }

    var apoId = generateUniqueApoId_(appointments);
    payload["アポID"] = apoId;
    appendAppointmentRow_(payload);
    appendHistory_(apoId, operator, "新規", ApoCore.buildChangeDiff({}, payload));
    var newNotified = notifySafely_(apoId, operator, "新規",
      ApoNotify.buildNewAppointmentMessage(payload, mention));
    return { ok: true, apoId: apoId, notified: newNotified };
  } finally {
    lock.releaseLock();
  }
}

/**
 * カードのアクションシートからのステータスだけの更新(2タップ操作)。
 * 履歴・通知は saveAppointment の編集と同じ扱いにする。
 * returnReason は「差し戻し」のときだけ使う(顧客都合/自社都合)。
 *
 * 差し戻し・対象外から稼働ステータスへ戻す場合だけはダブルブッキング検知を
 * 生かす(confirmedOverlapを立てない)。空いた枠に別アポが入っている可能性があるため
 * (2026-08-17レビュー指摘#5)。重複があれば saveAppointment が {ok:false} を返し、
 * 画面側が「編集から確認」を促す。
 */
function updateStatus(apoId, status, returnReason) {
  requireApoAccess_();
  if (ApoSchema.APPOINTMENT_STATUSES.indexOf(status) === -1) {
    throw new Error("不正なステータスです: " + status);
  }
  // ❸❹が持つステータスを❷から書き換えない(2026-08-21 軸の裁定②)。
  // 連携が通るまでの暫定期間だけ RESULT_INPUT_MODE = "許可" で通す。
  if (ApoSchema.HANDED_OFF_STATUSES.indexOf(status) !== -1 &&
      ApoSchema.RESULT_INPUT_MODE !== "許可") {
    throw new Error("「" + status + "」は対面営業マン物件管理システム側で更新してください。");
  }
  if (status === "差し戻し" && ApoSchema.RETURN_REASONS.indexOf(returnReason) === -1) {
    throw new Error("差し戻しには理由(顧客都合/自社都合)が必要です。");
  }
  var appointments = readAppointments_();
  var record = findAppointmentById_(appointments, apoId);
  if (!record) throw new Error("対象のアポが見つかりません: " + apoId);
  var reactivating = ApoSchema.SLOT_FREED_STATUSES.indexOf(record["ステータス"]) !== -1 &&
    ApoSchema.SLOT_FREED_STATUSES.indexOf(status) === -1;
  var updated = {};
  Object.keys(record).forEach(function (key) { updated[key] = record[key]; });
  updated["ステータス"] = status;
  updated["差し戻し理由"] = status === "差し戻し" ? returnReason : "";
  updated.confirmedOverlap = !reactivating;
  return saveAppointment(updated);
}

/**
 * 遅れそうワンタップ連絡。タップされたカードのアポを起点に、**そのアポの担当営業**の
 * 同日・そのアポ開始時刻以降のアポ(タップしたアポ自身を含む)を抽出し、
 * 各アポのアポ入れ担当へSlack通知する。アポの時刻は変更しない
 * (設計書 三名体制裁定①: 判断は人間・通知のみ)。
 *
 * 2026-08-17レビュー指摘#3#4の再設計: 以前は「操作者=遅れる営業」とみなして現在時刻以降を
 * 見ていたため、アポ入れ係が営業のカードから押すと誤った人物の遅延として通知され、
 * 開始時刻を過ぎた当該アポ自身も対象から漏れていた。apoIdを受け取り、遅れる人=
 * そのアポの担当営業・起点時刻=そのアポの開始時刻に変更。
 */
function reportDelay(minutes, apoId) {
  requireApoAccess_();
  var staffRows = readStaffRows_();
  var operator = ApoAccess.resolveStaffName(Session.getActiveUser().getEmail(), staffRows);
  var appointments = readAppointments_();
  var anchor = apoId ? findAppointmentById_(appointments, apoId) : null;
  var salesName = anchor ? anchor["担当営業"] : operator;
  var date = anchor ? anchor["日付"] : ApoCore.normalizeDateString(new Date());
  var fromTime = anchor ? anchor["開始時刻"]
    : Utilities.formatDate(new Date(), "Asia/Tokyo", "HH:mm");
  var targets = ApoCore.buildDelayTargets(appointments, salesName, date, fromTime);
  var mentionResolver = function (setterName) {
    var setter = ApoAccess.findStaffByName(setterName, staffRows);
    return ApoNotify.formatMention(setter && setter.slackUserId, setterName);
  };
  var historyApoId = anchor ? anchor["アポID"] : (targets.length > 0 ? targets[0]["アポID"] : "-");
  appendHistory_(historyApoId, operator, "遅延連絡",
    salesName + "さん +" + minutes + "分遅れ見込み(影響しうるアポ " + targets.length + "件)");
  var notified = notifySafely_(historyApoId, operator, "遅延連絡",
    ApoNotify.buildDelayMessage(salesName, minutes, targets, mentionResolver));
  return { ok: true, targetCount: targets.length, notified: notified };
}

// ---- 内部ヘルパー ----

function findAppointmentById_(appointments, apoId) {
  return appointments.filter(function (a) { return a["アポID"] === apoId; })[0] || null;
}

function generateUniqueApoId_(appointments) {
  for (var attempt = 0; attempt < 5; attempt++) {
    var apoId = ApoCore.generateApoId(new Date(), Math.random);
    if (!findAppointmentById_(appointments, apoId)) return apoId;
  }
  throw new Error("アポIDの採番に失敗しました。もう一度お試しください。");
}

function payloadToRow_(payload) {
  return ApoSchema.APPOINTMENT_HEADERS.map(function (header) {
    var value = payload[header];
    return value === undefined || value === null ? "" : value;
  });
}

function appendAppointmentRow_(payload) {
  payload["登録日時"] = nowStamp_();
  payload["最終更新日時"] = nowStamp_();
  var sheet = SpreadsheetApp.getActiveSpreadsheet()
    .getSheetByName(ApoSchema.APPOINTMENT_SHEET_NAME);
  sheet.appendRow(payloadToRow_(payload));
}

function updateAppointmentRow_(payload, existingRecord) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet()
    .getSheetByName(ApoSchema.APPOINTMENT_SHEET_NAME);
  var lastRow = sheet.getLastRow();
  if (lastRow < 2) throw new Error("アポ予定タブにデータがありません。");
  var idColumn = ApoSchema.APPOINTMENT_HEADERS.indexOf("アポID") + 1;
  var ids = sheet.getRange(2, idColumn, lastRow - 1, 1).getValues();
  for (var i = 0; i < ids.length; i++) {
    if (ids[i][0] === payload["アポID"]) {
      payload["登録日時"] = (existingRecord && existingRecord["登録日時"]) || nowStamp_();
      payload["最終更新日時"] = nowStamp_();
      sheet.getRange(i + 2, 1, 1, ApoSchema.APPOINTMENT_HEADERS.length)
        .setValues([payloadToRow_(payload)]);
      return;
    }
  }
  throw new Error("対象のアポ行が見つかりません: " + payload["アポID"]);
}

function appendHistory_(apoId, operator, operation, detail) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet()
    .getSheetByName(ApoSchema.HISTORY_SHEET_NAME);
  if (!sheet) return;
  var historyId = "H-" + Utilities.formatDate(new Date(), "Asia/Tokyo", "yyyyMMddHHmmss") +
    "-" + Math.floor(Math.random() * 1000);
  sheet.appendRow([historyId, apoId, nowStamp_(), operator, operation, detail || ""]);
}

/**
 * ステータス変化に応じて通知種別を出し分ける(申込🎉/差し戻し❌/その他は変更🔁)。
 */
function buildStatusAwareMessage_(payload, oldStatus, diff, mention) {
  var newStatus = payload["ステータス"];
  if (newStatus !== oldStatus) {
    if (newStatus === "申込") return ApoNotify.buildSignupMessage(payload, mention);
    if (newStatus === "差し戻し") return ApoNotify.buildReturnMessage(payload, mention);
  }
  return ApoNotify.buildChangeMessage(payload, diff, mention);
}

/**
 * Slack通知。失敗しても保存は成功扱い(保存が正・通知は従)。失敗は変更履歴に記録する。
 * 戻り値: 実際に送信できたら true。スキップ・失敗は false(画面のトースト文言が
 * 「通知済み」と偽らないための実績フラグ。2026-08-17レビュー指摘#10)。
 */
function notifySafely_(apoId, operator, operation, message) {
  try {
    return postToApoSlack_(message);
  } catch (error) {
    Logger.log("Slack通知に失敗しました: " + error);
    appendHistory_(apoId, operator, operation, "Slack通知失敗: " + error);
    return false;
  }
}

function postToApoSlack_(message) {
  var webhookUrl = PropertiesService.getScriptProperties().getProperty("SLACK_WEBHOOK_URL");
  if (!webhookUrl) {
    Logger.log("SLACK_WEBHOOK_URL が未設定のため通知をスキップしました: " + message);
    return false;
  }
  return ApoResilience.withRetry(function () {
    var response = UrlFetchApp.fetch(webhookUrl, {
      method: "post",
      contentType: "application/json",
      payload: JSON.stringify({ text: message }),
      muteHttpExceptions: true
    });
    var code = response.getResponseCode();
    if (code >= 300) {
      var error = new Error("Slack通知が失敗しました: HTTP " + code);
      error.statusCode = code;
      throw error;
    }
    return true;
  }, {
    isRetryable: function (error) {
      return ApoResilience.isRetryableHttpStatus(error.statusCode || 0);
    },
    sleepFn: function (ms) { Utilities.sleep(ms); }
  });
}

</script>
<script>

(function () {
  "use strict";
  function makeRunner() {
    var ok = null, ng = null;
    var proxy = {
      withSuccessHandler: function (fn) { ok = fn; return proxy; },
      withFailureHandler: function (fn) { ng = fn; return proxy; }
    };
    ["getBoard", "getStats", "getFormOptions", "saveAppointment", "updateStatus", "reportDelay"]
      .forEach(function (name) {
        proxy[name] = function () {
          var args = Array.prototype.slice.call(arguments);
          setTimeout(function () {
            try { ok && ok(window[name].apply(null, args)); }
            catch (e) { ng ? ng(e) : console.error(e); }
          }, 60);
        };
      });
    return proxy;
  }
  window.google = { script: {} };
  Object.defineProperty(window.google.script, "run", { get: makeRunner });
})();

</script>
<script>
var state = { view: 'day', owner: '', mine: false, meName: '', board: null, options: null, editingId: null, selected: null, confirmedOverlap: false, loaded: false };
function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function $(id) { return document.getElementById(id); }
function toast(message) {
  var el = $('toast'); el.textContent = message; el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 2600);
}
function todayString() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function load() {
  // 読み込み中は全体を隠さず、一覧部分だけ薄くする(初回のみ文言表示)
  if (state.loaded) { $('board').classList.add('dim'); }
  else { $('board').innerHTML = '<div class="empty">読み込み中…</div>'; }
  if (state.view === 'stats') {
    google.script.run.withSuccessHandler(renderStats).withFailureHandler(fail).getStats();
    return;
  }
  google.script.run.withSuccessHandler(renderBoard).withFailureHandler(fail)

  }).join("");
  who.addEventListener("change", function () {
    window.__demoUser = STAFF.filter(function (s) { return s.email === who.value; })[0];
    if (typeof setView === "function") { setView("day", "segDay"); } else { location.reload(); }
  });
  document.getElementById("demoReset").addEventListener("click", function () { location.reload(); });

  document.getElementById("demoHead").addEventListener("click", function () {
    panel.classList.toggle("open");
    document.getElementById("demoCaret").textContent = panel.classList.contains("open") ? "▼" : "▲";
  });

  window.__renderDemoNotifications = function () {
    var list = window.__demoNotifications;
    document.getElementById("demoCount").textContent = list.length + "件";
    var box = document.getElementById("demoMsgs");
    if (!list.length) {
      box.innerHTML = '<div class="empty">まだ通知はありません。アポを登録・変更すると、ここに出ます。</div>';
      return;
    }
    box.innerHTML = list.map(function (n) {
      var hh = String(n.at.getHours()).padStart(2, "0") + ":" + String(n.at.getMinutes()).padStart(2, "0");
      var body = n.text.replace(/[&<>]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
      });
      // Slackのリンク記法 <URL|表示名> は、実際のSlackではリンクとして表示される。
      // デモでも同じ見え方にする(生の記法を見せると「文字化けでは」と誤解される)
      body = body.replace(/&lt;(https?:[^|]+)\|([^&]+)&gt;/g, function (m, url, label) {
        return '<a href="' + url + '" target="_blank" rel="noopener" style="color:#F6C83E">' + label + '</a>';
      });
      body = body.replace(/&lt;@(\w+)&gt;/g, '<span style="color:#7fb6ff">@$1</span>');
      return '<div class="msg"><span style="color:#8d8474">' + hh + '</span>\n' + body + '</div>';
    }).join("");
    if (!panel.classList.contains("open")) {
      panel.classList.add("open");
      document.getElementById("demoCaret").textContent = "▼";
    }
  };
  window.__renderDemoNotifications();
})();

</script>
</body></html>
